<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="title desc">
<title id="title">Switcher V4 מתג חכם לדוד</title>
<desc id="desc">מתג Switcher V4 לבן חזיתי עם סמל שמש אדום וחיווי Wi-Fi כחול, ללא רקע</desc>
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d4d8df"/>
    <stop offset=".08" stop-color="#f6f7f8"/>
    <stop offset=".9" stop-color="#f8f9fa"/>
    <stop offset="1" stop-color="#cdd2da"/>
  </linearGradient>
  <linearGradient id="glass" x1=".12" y1="0" x2=".92" y2="1">
    <stop offset="0" stop-color="#fdfdfe"/>
    <stop offset=".46" stop-color="#f4f5f7"/>
    <stop offset="1" stop-color="#e9edf2"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f8fa"/>
    <stop offset="1" stop-color="#c8ced6"/>
  </linearGradient>
  <filter id="shadow" x="-35%" y="-25%" width="170%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="11"/>
    <feOffset dx="0" dy="15" result="offset"/>
    <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="subtle" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>
<g filter="url(#shadow)">
 <rect x="93" y="33" width="254" height="483" rx="18" fill="url(#edge)"/>
 <rect x="99" y="36" width="245" height="476" rx="16" fill="url(#frame)" stroke="#d8dce3" stroke-width="1.5"/>
 <rect x="105" y="42" width="233" height="464" rx="14" fill="url(#glass)" stroke="#fefefe" stroke-width="2"/>
 <path d="M117 48H316" stroke="#fff" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
 <path d="M107 61V490" stroke="#ffffff" stroke-opacity=".8" stroke-width="1.5" />
</g>
<!-- Wi-Fi indicator at the upper right -->
<g stroke="#8fa1d0" stroke-linecap="round" fill="none" transform="translate(295 98)">
 <path d="M-12 0Q0 -10 12 0" stroke-width="3.5"/>
 <path d="M-8 5Q0 -2 8 5" stroke-width="3"/>
 <path d="M-4 10Q0 6 4 10" stroke-width="3"/>
 <circle cx="0" cy="14" r="2.3" fill="#8fa1d0" stroke="none"/>
</g>
<!-- Delicate touch controls -->
<g stroke="#b5bbc4" stroke-width="1.5" stroke-linecap="round">
 <circle cx="178" cy="171" r="4.5" fill="none"/>
 <circle cx="178" cy="270" r="4.5" fill="none"/>
 <path d="M212 166v11M212 267v11M170 224h-10M262 224h-10"/>
</g>
<!-- two red LEDs -->
<circle cx="270" cy="173" r="4.5" fill="#ef6865"/>
<circle cx="270" cy="273" r="4.5" fill="#ef6865"/>
<!-- sun touch surface -->
<g transform="translate(220 223)" fill="#ed6b64" stroke="#ed6b64" stroke-linecap="round">
 <circle cx="0" cy="0" r="9.4" stroke="none"/>
 <path d="M0 -22V-15M0 15V22M-22 0H-15M15 0H22M-16 -16l5 5M11 11l5 5M-16 16l5 -5M11 -11l5 -5" stroke-width="4"/>
</g>
<!-- Switcher logo, an original device marking rather than an external caption -->
<g transform="translate(252 478)">
  <circle cx="0" cy="0" r="6" fill="none" stroke="#ef746e" stroke-width="1.4"/>
  <path d="M-3 -1q3 -3 6 0" fill="none" stroke="#ef746e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="2" r="1.5" fill="#ef746e"/>
  <text x="9" y="3.5" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9ba2ac">switcher</text>
</g>
</svg>