<!doctype html>
<html lang="he" dir="rtl" class="dv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>משקל חכם</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew",system-ui,sans-serif;font-size:17px}
button{font:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dial{pointer-events:none;position:relative;width:min(290px,calc(100vw - 70px),max(36vh,230px));aspect-ratio:1;margin:20px auto -6%;container-type:inline-size}
.dial svg{width:100%;height:100%;display:block}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:4%}
.big{font-size:27cqw;font-weight:200;line-height:1;letter-spacing:-.03em;direction:ltr}
.big small{font-size:.3em;font-weight:300;color:#aeaeb2;margin-inline-start:4px}
.st{color:#aeaeb2;font-weight:500;font-size:1.05rem;margin-top:4px}
.st2{color:#d1d1d6;font-size:.95rem;margin-top:4px;padding:0 12%}
.down{color:#30d158;font-weight:700}.up{color:#ff9f0a;font-weight:700}
.tile b{font-size:1.15rem;font-weight:700;direction:ltr}.tile span{font-size:.82rem;color:#aeaeb2}
.tile i{font-style:normal;font-size:.75rem;color:#d1d1d6;direction:ltr}
.chart{background:var(--dv-card);border-radius:24px;padding:12px 14px}
.chart svg{width:100%;height:90px;display:block}
.chart .h{display:flex;justify-content:space-between;color:#aeaeb2;font-size:.85rem;gap:8px}
.hist{background:var(--dv-card);border-radius:24px;overflow:hidden}
.hist .r{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;border-top:1px solid var(--dv-line)}
.hist .r:first-child{border-top:0}.hist .r span{color:#aeaeb2;font-size:.95rem}.hist .r b{direction:ltr;font-weight:600}
.bar2{flex:1;display:flex;align-items:center;gap:10px;padding:0 10px;min-height:60px;border-radius:22px;background:none;border:0;color:#fff;text-align:start}
.bar2 .bi{width:44px;height:44px;border-radius:14px;background:#ff9a3d2e;color:#ff9a3d;display:grid;place-items:center;flex:none}
.bar2 small{display:block;color:#aeaeb2;font-size:.85rem}.bar2 b{display:block;font-size:1.05rem}
.msg{background:var(--dv-card);border-radius:24px;padding:20px 18px;text-align:center;line-height:1.6}
.msg b{display:block;font-size:1.15rem;margin-bottom:6px}
.pri{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:14px;border-radius:999px;border:0;background:var(--dv-acc);color:var(--dv-acc-ink);font-weight:800}
dialog{background:#1c1c1e;color:#fff;border:0;border-radius:28px;padding:18px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 12px;font-size:1.2rem;text-align:center}
.mn{display:block;width:100%;min-height:52px;margin-top:8px;border-radius:18px;border:0;background:#2c2c2e;color:#fff;font-weight:600;text-align:start;padding:0 16px}
.fld label{display:block;color:#aeaeb2;margin-bottom:6px}
.fld input{width:100%;min-height:52px;border-radius:16px;border:1px solid #ffffff33;background:#000;color:#fff;padding:0 14px;direction:ltr;text-align:center}
.row2{display:flex;gap:8px}.row2 .mn{text-align:center}
/* iOS zooms into any field under 16px when zoom is allowed */
input,select,textarea{font-size:max(16px,1em)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="stylesheet" href="../device.css?v=4">
</head>
<body>
<main class="dv-page">
  <div class="dv-corners">
    <button class="dv-circle" id="back" aria-label="חזרה ל-HomeOn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    <button class="dv-circle" id="menu" aria-label="אפשרויות המשקל" aria-haspopup="dialog"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <h1 class="dv-title">משקל חכם</h1>
  <div id="app" aria-live="polite"></div>
</main>
<nav class="dv-bar" aria-label="יעד וממוצע" id="bar" hidden>
  <button class="bar2" id="goalB"><span class="bi" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></span><span><small id="goalS">יעד</small><b id="goalT">הגדרה</b></span></button>
  <div class="bar2" role="group" aria-labelledby="avgL"><span class="bi" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg></span><span><small id="avgL">ממוצע 7 ימים</small><b id="avgT">-</b></span></div>
</nav>
<dialog id="dlg" aria-labelledby="dlgH"></dialog>
<script>
const P=window.parent!==window?window.parent:window;
const NH=(()=>{try{return P.webkit.messageHandlers.homeon}catch(e){return null}})()||(()=>{try{return window.webkit.messageHandlers.homeon}catch(e){return null}})();
const native=async m=>{const r=await NH.postMessage(m);return typeof r==='string'?JSON.parse(r):r};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>(Math.round(n*10)/10).toFixed(1);
let D=null,RANGE=LS('unplug_scale_range')||'month',GOAL=parseFloat(LS('unplug_scale_goal'))||0,LOADING=true,ERR='';
try{D=JSON.parse(LS('unplug_scale_cache')||'null')}catch(e){}

const DAY=864e5,RN={week:['שבוע',7],month:['חודש',30],year:['שנה',365]};
const when=t=>{const d=new Date(t),n=new Date(),hm=d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  const days=Math.round((new Date(n.toDateString())-new Date(d.toDateString()))/DAY);
  return days===0?'היום '+hm:days===1?'אתמול '+hm:d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:d.getFullYear()===n.getFullYear()?undefined:'2-digit'})+' '+hm};
/* the reading of the same weighing (within 10 minutes) for another measure */
const near=(arr,t)=>{let b=null;for(const r of arr||[])if(Math.abs(r[0]-t)<6e5)b=r;return b};
function delta(cur,prev,unit,goodDown){if(!prev)return'';const d=cur-prev;if(Math.abs(d)<.05)return'<span>ללא שינוי</span>';
  return `<span class="${(d<0)===goodDown?'down':'up'}" dir="ltr">${d<0?'↓':'↑'} ${f1(Math.abs(d))}${unit}</span>`}

function arc(f){f=Math.max(0,Math.min(1,f));const a=(225-270*f)*Math.PI/180,x=150+133*Math.cos(a),y=150-133*Math.sin(a);
  return f<.01?'':`<path d="M56 244A133 133 0 ${270*f>180?1:0} 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="#3d8bff" stroke-width="12" stroke-linecap="round"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="#fff"/>`}

function chart(rows){if(rows.length<2)return `<div class="chart"><div class="h"><span>${RN[RANGE][0]} אחרון</span></div><p style="margin:14px 0;color:#aeaeb2;text-align:center">${rows.length?'שקילה אחת בתקופה הזו':'אין שקילות בתקופה הזו'}</p></div>`;
  const t1=Date.now(),t0=Math.max(t1-RN[RANGE][1]*DAY,rows[0][0]-DAY),vs=rows.map(r=>r[1]),mn=Math.min(...vs),mx=Math.max(...vs),pad=Math.max(.3,(mx-mn)*.15),lo=mn-pad,hi=mx+pad;
  const pts=rows.map(r=>[(r[0]-t0)/(t1-t0)*300,8+(hi-r[1])/(hi-lo)*74]);
  const g=GOAL&&GOAL>lo&&GOAL<hi?`<line x1="0" x2="300" y1="${(8+(hi-GOAL)/(hi-lo)*74).toFixed(1)}" y2="${(8+(hi-GOAL)/(hi-lo)*74).toFixed(1)}" stroke="#ff9a3d" stroke-width="1.5" stroke-dasharray="5 5"/>`:'';
  const last=pts[pts.length-1];
  return `<div class="chart" role="img" aria-label="גרף משקל ב${RN[RANGE][0]} האחרון: ${rows.length} שקילות, מ-${f1(vs[0])} ל-${f1(vs[vs.length-1])} קילו. הכי נמוך ${f1(mn)}, הכי גבוה ${f1(mx)}">
    <div class="h" aria-hidden="true"><span dir="ltr">${f1(mn)}–${f1(mx)} ק״ג</span><span>${RN[RANGE][0]} אחרון · ${rows.length} שקילות</span></div>
    <svg viewBox="0 0 300 90" preserveAspectRatio="none" aria-hidden="true">${g}<path d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}" fill="none" stroke="#3d8bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#3d8bff"/></svg></div>`}

function draw(){const el=$('app');
  if(!NH){$('bar').hidden=true;el.innerHTML=`<div class="msg"><b>המשקל עובד באפליקציית HomeOn באייפון</b>השקילות מגיעות מאפליקציית הבריאות של האייפון, ולכן הן לא זמינות ב-Safari.</div>`;fit();return}
  const W=(D&&D.w)||[];
  if(D&&D.ask||ERR==='auth'){$('bar').hidden=true;el.innerHTML=`<div class="msg"><b>חיבור לאפליקציית הבריאות</b>המשקל שולח את השקילות לאפליקציית Beurer HealthManager Pro, והיא כותבת אותן לאפליקציית הבריאות. HomeOn רק קוראת משם: משקל, אחוז שומן, BMI ומסה רזה.<button class="pri" id="auth">אישור גישה</button></div>`;$('auth').onclick=auth;fit();return}
  if(!W.length){$('bar').hidden=true;el.innerHTML=`<div class="msg"><b>${LOADING?'טוען שקילות...':ERR?'לא הצלחתי לקרוא מאפליקציית הבריאות':'אין עדיין שקילות'}</b>${LOADING?'':ERR?esc(ERR):`עלה על המשקל עם אפליקציית Beurer פתוחה, ובדוק שבאפליקציה שלהם מופעל סנכרון לאפליקציית הבריאות. אם כבר יש שקילות, בדוק בהגדרות ← בריאות ← גישה לנתונים ← HomeOn שהכול מסומן.`}${LOADING?'':'<button class="pri" id="rl">רענון</button>'}</div>`;const r=$('rl');if(r)r.onclick=()=>load();fit();return}
  const cur=W[W.length-1],prev=W[W.length-2],t=cur[0],w=cur[1];
  const fat=near(D.fat,t),bmi=near(D.bmi,t),lean=near(D.lean,t);
  const pf=prev&&near(D.fat,prev[0]),pl=prev&&near(D.lean,prev[0]);
  /* dial: how far along from the weight 90 days ago toward the goal */
  let f=0,goalTxt='';if(GOAL){const base=(W.find(r=>r[0]>Date.now()-90*DAY)||W[0])[1],left=w-GOAL;
    f=Math.abs(base-GOAL)<.05?(Math.abs(left)<.05?1:0):1-Math.abs(left)/Math.abs(base-GOAL);
    goalTxt=Math.abs(left)<.05?'הגעת ליעד':`עוד ${f1(Math.abs(left))} ק״ג ליעד`}
  const dTxt=prev?delta(w,prev[1],'',GOAL?GOAL<w||GOAL<prev[1]:true):'';
  const rows=W.filter(r=>r[0]>Date.now()-RN[RANGE][1]*DAY);
  const lab=`${f1(w)} קילו, ${when(t)}.${prev?(Math.abs(w-prev[1])<.05?' ללא שינוי מהשקילה הקודמת.':` ${w<prev[1]?'ירידה':'עלייה'} של ${f1(Math.abs(w-prev[1]))} קילו מהשקילה הקודמת.`):''}${goalTxt?' '+goalTxt+'.':''}`;
  el.innerHTML=`<div class="dial" role="img" aria-label="${esc(lab)}"><svg viewBox="0 0 300 300" aria-hidden="true"><path d="M56 244A133 133 0 1 1 244 244" fill="none" stroke="#ffffff14" stroke-width="12" stroke-linecap="round"/>${arc(f)}</svg>
    <div class="ctr" aria-hidden="true"><div class="big">${f1(w)}<small>ק״ג</small></div><div class="st">${esc(when(t))}</div><div class="st2">${prev?dTxt+' מהשקילה הקודמת':'שקילה ראשונה'}</div></div></div>
  <div class="dv-ctl" role="group" aria-label="תקופת הגרף">${Object.entries(RN).map(([k,[n]])=>`<button class="dv-chip" data-r="${k}" aria-pressed="${RANGE===k}">${n}</button>`).join('')}</div>
  ${chart(rows)}
  <div class="dv-label" id="bL">הרכב גוף · השקילה האחרונה</div>
  <div class="dv-tiles" role="list" aria-labelledby="bL" style="grid-template-columns:repeat(3,1fr)">
    <div class="dv-tile tile" role="listitem"><b>${bmi?f1(bmi[1]):'-'}</b><span>BMI</span></div>
    <div class="dv-tile tile" role="listitem" aria-label="שומן ${fat?f1(fat[1])+' אחוז':'אין נתון'}${fat&&pf?(Math.abs(fat[1]-pf[1])<.05?', ללא שינוי':`, ${fat[1]<pf[1]?'ירידה':'עלייה'} של ${f1(Math.abs(fat[1]-pf[1]))}`):''}"><b>${fat?f1(fat[1])+'%':'-'}</b><span>שומן</span>${fat&&pf?(Math.abs(fat[1]-pf[1])<.05?'':'<i>'+(fat[1]<pf[1]?'↓ ':'↑ ')+f1(Math.abs(fat[1]-pf[1]))+'</i>'):''}</div>
    <div class="dv-tile tile" role="listitem" aria-label="מסה רזה ${lean?f1(lean[1])+' קילו':'אין נתון'}"><b>${lean?f1(lean[1]):'-'}</b><span>מסה רזה ק״ג</span>${lean&&pl&&Math.abs(lean[1]-pl[1])>=.05?'<i>'+(lean[1]<pl[1]?'↓ ':'↑ ')+f1(Math.abs(lean[1]-pl[1]))+'</i>':''}</div>
  </div>
  <div class="dv-label" id="hL">שקילות אחרונות</div>
  <div class="hist" role="list" aria-labelledby="hL">${W.slice(-5).reverse().map(r=>`<div class="r" role="listitem"><span>${esc(when(r[0]))}</span><b>${f1(r[1])} ק״ג</b></div>`).join('')}</div>`;
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{RANGE=b.dataset.r;LS('unplug_scale_range',RANGE);draw();el.querySelector(`[data-r="${RANGE}"]`).focus()});
  const wk=W.filter(r=>r[0]>Date.now()-7*DAY);
  $('avgT').textContent=wk.length?f1(wk.reduce((s,r)=>s+r[1],0)/wk.length)+' ק״ג':'-';
  $('goalT').textContent=GOAL?f1(GOAL)+' ק״ג':'הגדרה';$('goalS').textContent=GOAL?(goalTxt==='הגעת ליעד'?'יעד · הושג':'יעד · עוד '+f1(Math.abs(w-GOAL))):'יעד';
  $('goalB').setAttribute('aria-label',GOAL?`יעד ${f1(GOAL)} קילו. ${goalTxt}. לשינוי היעד`:'הגדרת יעד משקל');
  $('bar').hidden=false;fit()}

async function load(){if(!NH){LOADING=false;return draw()}
  LOADING=true;ERR='';try{const r=await native({action:'health',cmd:'read',days:400});
    if(r&&r.ok===false)ERR=r.why==='nohealth'?'אפליקציית הבריאות לא זמינה במכשיר הזה':'לא הצלחתי לקרוא';
    else{D=r;LS('unplug_scale_cache',JSON.stringify(r));const l=r.w&&r.w[r.w.length-1];if(l)LS('unplug_scale_last',JSON.stringify(l))}}
  catch(e){ERR=/unknown action/.test(e.message||'')?'צריך לעדכן את אפליקציית HomeOn באייפון לגרסה החדשה':'לא הצלחתי לקרוא מאפליקציית הבריאות'}
  LOADING=false;draw()}
async function auth(){try{await native({action:'health',cmd:'auth'});D=null;await load()}catch(e){ERR=/unknown action/.test(e.message||'')?'צריך לעדכן את אפליקציית HomeOn באייפון לגרסה החדשה':'לא הצלחתי לבקש גישה';D=null;draw()}}

const dlg=$('dlg');let opener=null;
function openDlg(html,bind){opener=document.activeElement;dlg.innerHTML=html;bind();dlg.showModal()}
dlg.addEventListener('close',()=>{if(opener&&opener.focus)opener.focus()});
function goalDlg(){openDlg(`<h2 id="dlgH">יעד משקל</h2><div class="fld"><label for="gIn">יעד בקילו</label><input id="gIn" inputmode="decimal" value="${GOAL?f1(GOAL):''}" placeholder="לדוגמה 70"></div>
  <div class="row2"><button class="mn" id="gOk">שמירה</button>${GOAL?'<button class="mn" id="gDel">מחיקת יעד</button>':''}<button class="mn" id="gX">ביטול</button></div>`,()=>{
  $('gOk').onclick=()=>{const v=parseFloat(($('gIn').value||'').replace(',','.'));if(!(v>20&&v<300)){$('gIn').setAttribute('aria-invalid','true');$('gIn').focus();return}
    GOAL=v;LS('unplug_scale_goal',String(v));dlg.close();draw()};
  const d=$('gDel');if(d)d.onclick=()=>{GOAL=0;LS('unplug_scale_goal','');dlg.close();draw()};$('gX').onclick=()=>dlg.close()})}
$('goalB').onclick=goalDlg;
$('menu').onclick=()=>openDlg(`<h2 id="dlgH">משקל חכם</h2><button class="mn" id="mR">רענון השקילות</button><button class="mn" id="mG">יעד משקל</button>${NH?'<button class="mn" id="mH">פתיחת אפליקציית הבריאות</button>':''}<button class="mn" id="mX">סגירה</button>`,()=>{
  $('mR').onclick=()=>{dlg.close();load()};$('mG').onclick=()=>{dlg.close();goalDlg()};$('mX').onclick=()=>dlg.close();
  const h=$('mH');if(h)h.onclick=()=>{dlg.close();location.href='x-apple-health://'}});
$('back').onclick=()=>{if(window.parent!==window)parent.postMessage('unplug-close','*');else history.back()};
/* room for the bottom bar, however tall big text makes it */
function fit(){const b=$('bar'),pg=document.querySelector('.dv-page');if(pg)pg.style.paddingBottom=b.hidden?'24px':Math.ceil(innerHeight-b.getBoundingClientRect().top+14)+'px'}
addEventListener('resize',fit);addEventListener('storage',()=>setTimeout(fit,50));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!LOADING)load()});
/* HomeOn text size (settings) applies here too */(function(){const a=()=>{let s='100';try{const v=localStorage.getItem('unplug_ts');if(['100','115','130','150'].includes(v))s=v}catch(e){}document.documentElement.style.fontSize=s+'%'};a();addEventListener('storage',e=>{if(e.key==='unplug_ts')a()})})();
draw();load();
</script>
</body>
</html>
