:root{color-scheme:dark;--bg:#0a0f14;--card:#121a22;--card2:#18222c;--line:#223040;--ink:#f2f4f8;--mut:#b4bdca;
 --acc:#ffb23e;--acc2:#ff8a3d;--acc-ink:#1f1200;--acc-soft:#3a2a10;--acc-line:#a8741f;--acc-txt:#ffd28a;--ok:#3fd49a;--bad:#ff8fa3;--nav-h:64px}

button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--acc-txt);outline-offset:3px;border-radius:12px}

.pill svg{width:17px;height:17px}.pill.hot{background:#ffb23e1c;border-color:#ffb23e55;color:var(--acc-txt)}.pill.bad{color:var(--bad);border-color:#ff8fa355;background:#ff8fa314}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px}
.card{position:relative;background:linear-gradient(160deg,#ffffff0d,#ffffff03 55%),#10171f;border:1px solid #ffffff12;border-radius:28px;padding:16px;min-height:168px;display:flex;flex-direction:column;gap:4px;text-align:start;box-shadow:inset 0 1px 0 #ffffff10,0 10px 30px #0006;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s;overflow:hidden}

.card.is-on::before{opacity:1}

.card .open{position:absolute;inset:0;border-radius:27px;z-index:1}
.card .ic{width:62px;height:62px;border-radius:21px;background:#ffffff0c;border:1px solid #ffffff14;display:grid;place-items:center;color:#aeb8c6;transition:all .3s}
.card .ic svg{width:36px;height:36px}

.card.is-on .ic.photo,.card.is-on .ic:has(.art){background:none;box-shadow:none;filter:drop-shadow(0 6px 16px #ff9a3d88)}

.card:not(.is-on) .ic .art-neon{opacity:.55}
.big-pw:has(.art),.big-pw[data-photo]{background:none!important;border:0!important;box-shadow:none!important;padding:0}
.big-pw .art{width:100%;height:100%}
.big-pw[aria-checked="true"]:has(.art),.big-pw[data-photo][aria-checked="true"]{filter:drop-shadow(0 10px 28px #ff9a3daa)}
.big-pw:not([aria-checked="true"]) .art-clay,.big-pw:not([aria-checked="true"]) .art-glass{filter:saturate(.35) brightness(.85)}
.mini svg.art{width:44px;height:44px}
.card .ic img,.big-pw img,.mini img{width:100%;height:100%;object-fit:contain;display:block}



.mini{width:44px;height:44px;color:var(--acc);display:grid;place-items:center;flex:none}.mini svg{width:34px;height:34px}.mini.photo{padding:0}
.card.is-on .ic svg .d{fill-opacity:.35}
.card .st,.card .model{overflow-wrap:anywhere;line-height:1.35}.card .nm{font-weight:600;font-size:1.08rem;line-height:1.25;overflow-wrap:anywhere;margin-top:auto;padding-top:10px}

.card.is-on .st{color:var(--acc-txt)}
.card .pw{position:absolute;top:14px;left:12px;width:58px;height:48px;display:grid;place-items:center;z-index:2}
.card .pw::before{content:"";width:52px;height:32px;border-radius:999px;background:#ffffff1a;transition:background .25s}

.card .pw[aria-checked="true"]::before{background:linear-gradient(90deg,var(--acc2),var(--acc))}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;gap:10px}
.sec-h h2{font-size:.95rem;margin:0;color:var(--mut);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:62px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}.row .t{font-weight:500;font-size:1.05rem}.row .s{color:var(--mut);font-size:.92rem}
.row-btn{width:100%;text-align:start}

.empty b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}
.btn{min-height:50px;padding:0 18px;border-radius:16px;background:#1d2530;border:1px solid #34404f;color:#ffe9c7;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700;min-height:52px}
.btn.bad{color:var(--bad);border-color:#5a2a35}
.btn.wide{width:100%}
.btns{display:flex;gap:10px}.btns>.btn{flex:1}
.sw{width:56px;height:34px;border-radius:999px;background:#2a3644;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:#2ea36f}.sw[aria-checked="true"]::after{transform:translateX(-22px)}
nav.bar{position:fixed;z-index:20;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:560px;height:var(--nav-h);display:flex;padding:5px;border-radius:999px;
 background:linear-gradient(160deg,#4a4334b0,#1d1a14e0);border:1px solid #d6c39f4d;box-shadow:inset 0 1px 1.5px #ffffff40,0 14px 34px #000a;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
nav.bar:before{content:'';position:absolute;inset-block:5px;right:calc(5px + var(--tab,0)*(100% - 10px)/4);width:calc((100% - 10px)/4);border-radius:999px;background:linear-gradient(145deg,#f5dcc333,#d0a07112 55%,#ffe2bd1f);border:1px solid #ffe0bd66;box-shadow:inset 0 1px 2px #ffffff4d;transition:right .32s cubic-bezier(.2,.8,.2,1)}
nav.bar button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.8rem;font-weight:600;color:#ded6c8;border-radius:999px}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav.bar{background:#2a2418f5}}
.scrim{position:fixed;inset:0;z-index:30;display:flex;justify-content:center}
.sheet{width:100%;overflow-y:auto;overscroll-behavior:contain;background:radial-gradient(120% 40% at 50% 0,#2e2210,transparent 60%),var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
.sheet>*{width:100%;max-width:608px;margin-inline:auto}
.sheet{box-sizing:border-box;min-width:0;max-height:100dvh}.sheet>*{box-sizing:border-box;min-width:0}.sheet input{box-sizing:border-box;max-width:100%;min-width:0}.sheet label{display:block;overflow-wrap:anywhere}.sheet p{overflow-wrap:anywhere}.sheet .wb-form{display:grid;gap:14px;min-width:0}.sheet .wb-form input{display:block;width:100%;margin-top:8px;padding:12px;font-size:1rem;min-height:52px}.sheet .wb-form label{font-size:1rem;line-height:1.5}.sheet .wb-form p{font-size:1rem;line-height:1.55;margin:0}
@keyframes sheetIn{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.3px;overflow-wrap:anywhere;text-align:start}
.sheet>p{margin:0;color:var(--mut);line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field>span{font-weight:600;color:var(--mut);font-size:.95rem}
.field input,.field select{min-height:52px;border-radius:14px;border:1px solid #48556b;background:#11161e;padding:0 14px;font-size:1.05rem}
.err{color:var(--bad);font-weight:600;min-height:1.2em}

.state-line{text-align:center;font-weight:700;font-size:1.2rem}

input.tgl:checked{background:#3d8bff}input.tgl:checked::after{right:23px}

ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;line-height:1.55}

.quick{display:flex;gap:10px;margin-bottom:14px}.quick .btn{flex:1;min-height:54px}

.energy{display:none}

:root{--bg:#000;--tile:#1c1c1e;--tile-on:#2a2420}
body{background:#000}
.app{padding-top:calc(6px + env(safe-area-inset-top))}
header.top{margin:0 0 6px!important;padding:6px 2px 0!important}
.brandRow{flex-direction:row}
.homeBtn{margin:0;min-height:48px;padding:0;background:none!important;border:0!important;font-size:1.75rem;font-weight:700;color:#fff!important;letter-spacing:-.02em;gap:6px}
.homeBtn svg{width:20px!important;height:20px!important;transform:rotate(-90deg)!important;color:var(--mut)}
.icbtn{width:44px;height:44px;background:none!important;border:0!important;box-shadow:none!important;color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.icbtn svg{width:24px;height:24px}
.icbtn:disabled{opacity:.35}
#editBtn[aria-pressed="true"]{background:var(--gold)!important;border-radius:50%;color:#1f0e00}
.statusLine{margin:0 2px 12px;color:var(--mut);font-size:.95rem}.statusLine b{color:var(--gold-txt);font-weight:600}.statusLine .bad{color:#ff8f8f}
/* room tabs: text tabs like Smart Life */
.chips{gap:20px;padding:4px 2px 14px;align-items:center}
.chip{min-height:44px;padding:0;background:none!important;border:0!important;border-radius:0;font-size:1.3rem;font-weight:700;color:#5c5c63;letter-spacing:-.02em;box-shadow:none}
.chip[aria-pressed="true"]{color:#fff!important;background:none!important}
.chip[aria-pressed="true"]::after{display:none}
.chip.add{width:40px;height:40px;min-height:40px;border-radius:50%!important;color:var(--mut);font-size:1rem}
/* tiles */
.grid{gap:10px}
.card,.roomSec .card{background:var(--tile)!important;border:0!important;box-shadow:none!important;border-radius:22px;padding:14px}
.card.is-on,.roomSec .card.is-on{background:var(--tile-on)!important;box-shadow:none!important}
.card::before{display:none}
.card .nm{font-size:1.02rem;font-weight:600}
.card .st{color:#8e8e93!important;font-size:.82rem;margin-top:2px}
.card.is-on .st{color:var(--gold-txt)!important}
.card .ic,.card .ic.photo,.card .ic:has(.art),.card .ic:has(img.real){width:50px;height:50px}
.card.is-on .ic:has(img.real){filter:none}
.card:not(.is-on) .ic img.real{filter:none!important;opacity:.9}
.card .pw,.grp .pw{top:8px;left:8px}
.card .pw,.grp .pw{background:radial-gradient(circle,#3a3a3c 0 17px,transparent 17.5px)!important;color:#d1d1d6}
.card .pw[aria-checked="true"],.grp .pw[aria-checked="true"]{background:radial-gradient(circle,var(--gold) 0 17px,transparent 17.5px)!important;color:#1f0e00;filter:none}
.quick{margin-bottom:12px}.quick .btn{min-height:46px;border-radius:14px}
.grp{background:var(--tile);border:0}.grp.is-on{background:var(--tile-on);border:0}
.list,.ro,.empty,.search{background:var(--tile)!important;border:0!important;box-shadow:none!important}
.sheet{background:#1c1c1e!important;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:0 -10px 40px #000a}
.sheet .list,.sheet .ro{background:#2c2c2e!important}
nav.bar{background:rgba(28,28,30,.88)!important;border:0;box-shadow:0 0 0 .5px #ffffff1f,0 10px 30px #000c}
nav.bar:before{background:#ffffff14;border:0;box-shadow:none}
/* orange back as the accent */
.chip[aria-pressed="true"]{color:var(--gold)!important;position:relative}
.chip[aria-pressed="true"]::after{display:block!important;content:"";position:absolute;inset:auto 0 2px;height:4px;border-radius:2px;background:var(--gold)}
.homeBtn svg{color:var(--gold)!important}
.card.is-on,.roomSec .card.is-on{background:linear-gradient(160deg,#3d2512 0%,#1c1c1e 80%)!important;box-shadow:inset 0 0 0 1.5px #ff9a3d66,0 10px 26px -14px #ff9a3d88!important}
.card.is-on .nm{color:#fff}
.grp.is-on{background:linear-gradient(160deg,#3d2512 0%,#1c1c1e 80%);box-shadow:inset 0 0 0 1.5px #ff9a3d66}
#offBtn:not(:disabled){color:var(--gold)}
nav.bar:before{background:#ff9a3d24!important;box-shadow:inset 0 0 0 1px #ff9a3d44!important}

/* Device settings: the same quiet cards as the new home screen. */
.device-settings{border-radius:22px;overflow:hidden}
.device-settings .ctl{padding:18px 16px;gap:14px}
.device-settings .ctl-h{flex-wrap:wrap}
.device-settings .ctl-h .t{flex:1;min-width:0;overflow-wrap:anywhere}
.device-settings .ctl-h .sw{flex:none}
.device-settings .step{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
.device-settings .step button{width:48px;height:48px;font-size:1.5rem;background:#3a3a3c}
.device-settings .step input[type=range]{min-width:0;width:100%;margin:0}
.device-options{display:grid;grid-template-columns:repeat(var(--options),minmax(0,1fr));gap:4px;border-radius:16px}
.device-options button{min-width:0;min-height:48px;padding:10px 4px;border-radius:12px;overflow-wrap:anywhere;line-height:1.35}
@media(max-width:380px){.device-options{grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}}
.tabTitle{display:none;margin:4px 2px 14px;font-size:2rem;font-weight:700;letter-spacing:-.03em}
body:not([data-tab="devices"]) .tabTitle{display:block}
body:not([data-tab="devices"]) .brandRow,body:not([data-tab="devices"]) .statusLine{display:none}
.seg{flex-wrap:wrap}.seg button{min-width:0;flex:1 1 30%}
.actions{gap:2px}
.actions .icbtn{width:auto;min-width:52px;height:52px;border-radius:14px;flex-direction:column;gap:2px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.actions .icbtn svg{width:22px;height:22px}
.actions .icbtn small{font-size:.68rem;font-weight:600;color:var(--mut);white-space:nowrap}
#offBtn:not(:disabled) small{color:var(--gold-txt)}
#refBtn[hidden]{display:none!important}
#editBtn[aria-pressed="true"]{border-radius:14px!important}
#editBtn[aria-pressed="true"] small{color:#1f0e00}
.actions .icbtn{min-width:44px;width:44px;height:44px;border-radius:50%;background:#1c1c1e!important}
.actions .icbtn svg{width:22px;height:22px}
.actions .icbtn[hidden]{display:none!important}
body.reordering #editBtn{display:flex!important;background:var(--gold)!important;color:#1f0e00}
body.reordering #menuBtn{display:none!important}
.sheet .row-btn>svg:first-child{width:22px;height:22px;color:var(--gold);flex:none}
.sheet .row-btn:disabled{opacity:.45}
/* no blur at the top: content scrolls under a solid status-bar strip */
body::after{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#000;z-index:25;pointer-events:none}
header.top,header.top::before,.icbtn,.reBar{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.reBar{background:#1c1c1e!important}
.dropMenu{position:fixed;z-index:40;min-width:220px;max-width:calc(100vw - 24px);background:#2c2c2e;border-radius:18px;padding:6px;box-shadow:0 18px 50px #000c,0 0 0 .5px #ffffff22;transform-origin:top left;animation:dmIn .16s ease-out}
@keyframes dmIn{from{opacity:0;transform:scale(.92)}}
.dropMenu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border-radius:12px;font-size:1.02rem;font-weight:500;text-align:start;color:#fff}
.dropMenu button+button{box-shadow:0 -.5px 0 #ffffff14}
.dropMenu button svg{width:20px;height:20px;color:var(--gold);flex:none}
.dropMenu button:active,.dropMenu button:focus-visible{background:#ffffff12}
.dropMenu button:disabled{opacity:.4}
/* edit mode: calm, no text selection on long-press */
.app,.card,.chips,.grp,nav.bar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.reordering .card .reBtns{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);top:0;left:0}
.reordering .card .reBtns button:focus{position:fixed;clip:auto;width:44px;height:44px}
.edCorner{width:30px;height:30px;box-shadow:0 2px 6px #0009}
.edCorner svg{width:14px;height:14px}
.custom-picker{margin:18px 2px 8px;border:1px solid #ffffff30;border-radius:18px;padding:8px 12px;background:#ffffff08}
.custom-picker summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-size:1.12rem;font-weight:750}
.custom-picker summary::-webkit-details-marker{display:none}
.custom-picker-count{font-size:.9rem;color:#aab3c4;font-weight:500;white-space:nowrap}
.custom-picker[open] .icgrid{padding:10px 0 6px}
.edDel{top:6px;left:6px;right:auto}.edFav{top:6px;left:42px;right:auto;bottom:auto}.edSize{top:6px;left:78px;bottom:auto}
.reordering .card .edIcon{top:6px;left:114px;right:auto;bottom:auto;background:#e9edf3;color:#1a2635}
.reordering .card .ic{opacity:.9}
.reordering .card{outline:1.5px dashed #ff9a3d66;outline-offset:-1.5px}
.reBar{border-radius:16px!important;padding:8px 8px 8px 14px!important;font-size:.92rem}
.reBar .btn{min-height:40px;padding:0 18px}
.dragPh{background:transparent!important;outline:2px dashed #ff9a3d88!important;box-shadow:none!important;aspect-ratio:auto}
.card.dragging{transform:scale(1.04) rotate(-1deg)!important;box-shadow:0 24px 48px #000c!important;animation:none!important;opacity:.96}
.reordering .card:not(.dragging){animation:none}
/* no scrollbar: the page scrolls inside .app, whose indicator can be hidden on iOS */
html,body{height:100%;overflow:hidden}
.app{height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none}
.app::-webkit-scrollbar,.sheet::-webkit-scrollbar,.chips::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
.sheet{scrollbar-width:none}
/* sheets never move sideways */
.scrim{overflow:hidden;touch-action:none}
.sheet{overflow-x:hidden!important;overscroll-behavior:contain;touch-action:pan-y;width:100%;max-width:620px;box-sizing:border-box}
.sheet>*,.sheet .list,.sheet .row,.sheet .seg{max-width:100%;min-width:0;box-sizing:border-box}
.sheet .row .grow{min-width:0;overflow-wrap:anywhere}
.app{touch-action:pan-y}
/* no accidental zoom: no double-tap zoom, and inputs at 16px+ so iOS doesn't zoom on focus */
html,body,button,a,.card,.chip,.row{touch-action:manipulation}
input,select,textarea{font-size:max(16px,1rem)!important}
#shT:focus,#shT:focus-visible{outline:none}
.cmdBar{display:flex;align-items:center;gap:8px;background:#1c1c1e;border-radius:16px;padding:4px 6px 4px 14px;margin:0 0 14px}
.cmdBar input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;min-height:44px}
.cmdBar input::placeholder{color:#8e8e93}
.search .cmdMic{margin-inline-end:-8px}.qDo{margin:-4px 0 12px}
.cmdMic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--gold);flex:none}
.cmdMic svg{width:22px;height:22px}.cmdMic.rec{background:var(--gold);color:#1f0e00;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ff9a3d33}}
.cmdEx{margin:0;padding-inline-start:20px;color:var(--mut);line-height:1.9}
/* glass back, like Unbox: floating glass tab bar with a sliding pill, glass sheets and menu (strength from the settings slider) */
nav.bar{background:linear-gradient(160deg,rgba(58,52,46,calc(.35 + var(--g)*.5)),rgba(23,20,18,calc(.55 + var(--g)*.4)))!important;border:1px solid #ffd2a83d!important;box-shadow:inset 0 1px 1.5px #ffffff40,0 14px 34px #000a!important;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
nav.bar:before{background:linear-gradient(145deg,#ffb36b3d,#ff9a3d14 55%,#ffd2a826)!important;border:1px solid #ffc58a66!important;box-shadow:inset 0 1px 2px #ffffff4d!important;transition:right .38s cubic-bezier(.3,1.35,.5,1)!important}
.sheet{background:linear-gradient(180deg,rgba(44,40,36,calc(.5 + var(--g)*.42)),rgba(24,22,20,calc(.62 + var(--g)*.34)))!important;-webkit-backdrop-filter:blur(30px) saturate(170%)!important;backdrop-filter:blur(30px) saturate(170%)!important;border:1px solid #ffffff1f!important;box-shadow:inset 0 1px 1px #ffffff2e,0 -10px 40px #000a!important}
.sheet .list,.sheet .ro{background:rgba(255,255,255,.07)!important}
.sheet::before{content:"";display:block;flex:none;width:40px;height:5px;border-radius:3px;background:#ffffff4d;margin:-4px auto 2px}
.scrim{background:rgba(0,0,0,.32)}
.dropMenu{background:rgba(44,40,36,calc(.55 + var(--g)*.38))!important;-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 1px #ffffff2e,0 18px 50px #000c,0 0 0 .5px #ffffff2a!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav.bar,.sheet,.dropMenu{background:#24201cf7!important}}
@media (prefers-reduced-transparency: reduce){nav.bar,.sheet,.dropMenu{background:#24201c!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
/* swipe between rooms */
.grid.slideN{animation:slN .28s cubic-bezier(.2,.8,.2,1)}.grid.slideP{animation:slP .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slN{from{transform:translateX(-44px);opacity:.2}}@keyframes slP{from{transform:translateX(44px);opacity:.2}}
.sheet.dragging{transition:none!important}
.in-app .splash{display:none!important}
/* two-tone: blue power buttons on orange "on" cards */
.card .pw[aria-checked="true"],.grp .pw[aria-checked="true"],.card .pw[data-ember]:active{background:radial-gradient(circle,#3d8bff 0 17px,transparent 17.5px)!important;color:#fff!important}
.roomOff{color:#6fa8ff!important}
nav.bar button[aria-current="page"]{color:#6fa8ff!important}
.big-pw[aria-checked="true"]{box-shadow:0 0 0 4px #3d8bff,0 10px 40px #3d8bff44!important}
.big-pw[aria-checked="true"]:has(img.real){filter:drop-shadow(0 0 18px #3d8bff99)!important;box-shadow:none!important}
.big-pw[aria-checked="true"]:has(img.real){background:radial-gradient(circle at 50% 55%,#3d8bff40,transparent 62%)!important}
.sw[aria-checked="true"]{background:#3d8bff!important}
.statusLine b{color:#6fa8ff!important}
.livePill::before{content:"";width:8px;height:8px;border-radius:50%;background:#3d8bff;flex:none}
nav.bar{touch-action:none}nav.bar.dragging:before{transition:none!important;transform:scaleY(1.12) scaleX(1.06);background:linear-gradient(145deg,#ffb36b55,#ff9a3d22 55%,#ffd2a840)!important}
nav.bar:before{transition:right .38s cubic-bezier(.3,1.35,.5,1),transform .2s ease!important}
/* splash: roof drops in, two tiles light up */
.splash .roof{animation:plugIn .9s .1s cubic-bezier(.3,1.4,.5,1) both}
.splash .t1{animation:tOn .35s .75s ease-out both}.splash .t2{animation:tOn .35s 1s ease-out both}.splash .glow{animation:tOn .8s .9s ease-out both}
@keyframes tOn{from{opacity:0}}
.splash .w1{animation:tOn .3s 1.15s ease-out both}.splash .w2{animation:tOn .3s 1.3s ease-out both}
/* BOSS warming plate: enlarge 25% only in device-card thumbnail. */
.card .ic img.real:is([src^="real/hotplate.webp"],[src^="real/custom/boss_shabbat_hotplate.png"]){transform:scale(1.25);transform-origin:center center}
/* Favorites: a direct, accessible orange star on every device tile. */
.card .favToggle{position:absolute;left:8px;bottom:8px;z-index:3;width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:#92949b;cursor:pointer;touch-action:manipulation}
.card .favToggle svg{width:26px;height:26px;fill:currentColor;stroke:currentColor;stroke-width:1.5}
.card .favToggle[aria-pressed="true"]{color:#ff9a3d}
.card .favToggle[aria-pressed="true"] svg{fill:currentColor;filter:drop-shadow(0 0 5px #ff9a3d55)}
.card .favToggle:focus-visible{outline:2px solid #ff9a3d;outline-offset:1px}
.card.wide .favToggle{left:auto;right:10px;top:8px;bottom:auto}
.reordering .card .favToggle{display:none!important}
.reordering .card .edFav{background:#303237!important;color:#a3a3aa!important}
.reordering .card .edFav[aria-pressed="true"]{background:#413021!important;color:#ff9a3d!important}
.reordering .card .edFav[aria-pressed="true"] svg{fill:currentColor}

/* Prevent mixed RTL/LTR model names and long statuses from clipping. */
.card .model{direction:ltr;unicode-bidi:isolate;text-align:right;white-space:normal!important;overflow-wrap:anywhere;word-break:break-word;text-overflow:clip!important}
.card .nm,.card .st{white-space:normal!important;overflow-wrap:anywhere;text-overflow:clip!important}
.card:not(.wide){height:auto;min-height:190px;aspect-ratio:auto}
.card:not(.wide) .nm{margin-top:auto}
.card:not(.wide) .st{padding-bottom:2px}
/* Device tile layout: image and text have separate space, including wide tiles. */
.card,.roomSec .card{box-sizing:border-box;min-height:0;aspect-ratio:1 / 1;display:flex;flex-direction:column;gap:0;overflow:hidden}
.card .ic,.card .ic.photo,.card .ic:has(.art),.card .ic:has(img.real){position:static;flex:0 0 auto;align-self:flex-start;width:52px;height:52px;order:-2;margin:0 0 8px;min-width:0;max-width:100%;transform:none}
.card .nm{position:relative;z-index:0;order:0;flex:0 0 auto;min-width:0;max-width:100%;margin:auto 0 0;overflow-wrap:anywhere;line-height:1.22}
.card .model{position:relative;z-index:0;order:1;flex:0 0 auto;font-size:.86rem;line-height:1.25;color:#c4c9d1;margin-top:3px;min-width:0;max-width:100%;overflow-wrap:anywhere}
.card .st{position:relative;z-index:0;order:2;flex:0 0 auto;min-width:0;max-width:100%;margin-top:4px;line-height:1.2;overflow-wrap:anywhere}
.card.wide{display:grid;grid-template-columns:minmax(0,1fr) minmax(76px,96px);grid-template-rows:minmax(0,1fr) auto auto auto;column-gap:10px;min-height:0;height:124px;aspect-ratio:auto;align-items:end}
.card.wide .ic,.card.wide .ic.photo,.card.wide .ic:has(.art),.card.wide .ic:has(img.real){
  position:static;grid-column:2;grid-row:1/5;align-self:center;justify-self:center;
  width:100%;height:82px;max-width:96px;min-width:0;margin:0;transform:none
}
.card.wide .nm,.card.wide .model,.card.wide .st{grid-column:1;min-width:0;max-width:100%;width:100%}
.card.wide .nm{grid-row:2;margin:0}
.card.wide .model{grid-row:3}
.card.wide .st{grid-row:4}
/* Prevent long labels from increasing intrinsic square tile height. */
.card:not(.wide),.roomSec .card:not(.wide){contain:size;min-width:0;min-height:0;aspect-ratio:1 / 1;overflow:hidden}
/* Keep compact square tiles readable: reserve room for status and prevent model overflow. */
.card:not(.wide) .nm{font-size:clamp(.88rem,3.4vw,1.02rem);line-height:1.16;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;padding-top:0}
.card:not(.wide) .model{font-size:.75rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto}
.card:not(.wide) .st{font-size:.76rem;line-height:1.2;white-space:normal;overflow-wrap:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;text-overflow:ellipsis}
.card:not(.wide) .ic,.card:not(.wide) .ic.photo,.card:not(.wide) .ic:has(.art),.card:not(.wide) .ic:has(img.real){width:48px;height:48px;margin-bottom:4px}
.card:not(.wide){padding:12px;gap:2px}

/* Stable compact edit controls; no changes to card image or layout. */
.reordering .card .editActions{display:contents}
.reordering .card .edCorner{position:absolute!important;width:34px!important;height:34px!important;bottom:auto!important;right:auto!important;transform:none!important;z-index:5}
/* edit mode like Smart Life: a small minus in one corner, a small resize in the other, tap a card for the rest */
.reordering .card .edCorner,.reordering .card .edCorner.edDel{width:32px!important;height:32px!important;min-width:32px!important;min-height:32px!important;border-radius:50%}
.reordering .card .edCorner svg{width:16px;height:16px}
.reordering .card .edCorner::before{content:"";position:absolute;inset:-6px;border-radius:50%}
.reordering .card .edDel{top:8px!important;left:8px!important;background:#3a3f4b!important;color:#fff!important}
.reordering .card .edSize{top:auto!important;bottom:8px!important;left:8px!important;background:#e9edf3!important;color:#1a2635!important}
.reordering .card .edFav,.reordering .card .edIcon{width:1px!important;height:1px!important;min-width:0!important;min-height:0!important;overflow:hidden;clip-path:inset(50%);top:0!important;left:0!important}
.reordering .card .edFav:focus-visible,.reordering .card .edIcon:focus-visible{width:28px!important;height:28px!important;clip-path:none}

.reordering .card.draggingCard{z-index:30;box-shadow:0 20px 44px #000c;opacity:.95}
/* the selected room tab: blue, like the selected tab in the bottom bar */
.chips .chip[aria-pressed="true"]::after{background:#6fa8ff!important}
.reordering .reBar{position:relative;top:auto;width:max-content;max-width:100%;margin:0 0 10px;padding:0!important;background:transparent;border:0;box-shadow:none}
.reordering #view{padding-bottom:calc(var(--nav-h,80px) + env(safe-area-inset-bottom) + 110px)!important}
.card .pw{top:2px!important}

/* Compact, accessible schedule editor; scoped to this sheet only. */
.schedule-editor{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
.schedule-editor .field{margin:10px 0}

/* ---------- api ---------- */
async function api(path,body){
  let r;try{r=await fetch(CFG.api.replace(/\/$/,'')+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},CFG.key?{'X-Kor-Key':CFG.key}:{}),body:JSON.stringify(body||{})})}
  catch(e){throw new Error('אין חיבור לאינטרנט')}
  let j;try{j=await r.json()}catch(e){throw new Error('השרת לא ענה ('+r.status+')')}
  if(r.status===401&&CFG.key&&!/^\/(share|recover|dev)/.test(path)){setKey('');render();openConnect();throw new Error(j.error||'החיבור פג')}
  if(!j.ok)throw new Error(j.error||'שגיאה');
  return j;
}

/* Tuya's REST "online" flag is often stale (Smart Life itself uses a live channel), so a device counts as
   reachable unless a command to it actually failed. */
const FAIL={};
const norm=d=>{if(!d)return d;d.cloudOnline=d.online;d.online=!FAIL[d.id];return d};
/* The cloud reports a new state a few seconds late; for a short while after a command, what was sent wins over a stale report,
   so a switch doesn't flip back and forth. */
const PENDING={};
function applyPending(x){const p=PENDING[x.id];if(p){if(Date.now()-p.at<8000)Object.assign(x.status,p.vals);else delete PENDING[x.id]}return x}
async function send(d,cmds){
  if(typeof washGuardOff==='function'&&!washGuardOff(d,cmds))return;
  if(typeof acGuardOn==='function'&&!acGuardOn(d,cmds))return;
  const old={...d.status};cmds.forEach(c=>d.status[c.code]=c.value);refreshOpen(d);render();
  try{if(!(await localSend(d,cmds)))await api('/command',{id:d.id,commands:cmds});PENDING[d.id]={at:Date.now(),vals:Object.fromEntries(cmds.map(c=>[c.code,c.value]))};if(FAIL[d.id]){delete FAIL[d.id];d.online=true}addLog(dname(d),cmdsText({device:d.id,cmds}));LSset('unplug_devs',JSON.stringify(DEVS));setTimeout(()=>refreshOne(d.id),1800);setTimeout(()=>refreshOne(d.id),9000)}
  catch(e){d.status=old;if(/offline|not online|device is offline|1106|2008|נותק|מנותק/i.test(e.message)){FAIL[d.id]=Date.now();d.online=false;toast(dname(d)+' לא מגיב - בדוק שהוא מחובר לחשמל ול-WiFi')}else toast('לא בוצע: '+e.message);refreshOpen(d);render()}
}

let LOCAL=LSj('unplug_local',{at:0,map:{}});
async function loadLocal(force){
  if(!IN_APP||!CFG.key)return;if(!force&&Date.now()-LOCAL.at<12*3600e3&&Object.keys(LOCAL.map).length){nativeCall({action:'tuyaSet',devices:LOCAL.keys||[]}).catch(()=>{});return}
  try{const j=await api('/local');const map={},keys=[];
    for(const x of j.devices||[]){map[x.id]=x.dps;keys.push({id:x.id,key:x.key,name:x.name})}
    LOCAL={at:Date.now(),map,keys};LSset('unplug_local',JSON.stringify(LOCAL));await nativeCall({action:'tuyaSet',devices:keys})}catch(e){}
}
/* true = done on the home WiFi; false = use the cloud as before */
async function localSend(d,cmds){
  const m=IN_APP&&LOCAL.map[d&&d.id];if(!m)return false;
  const dps={};for(const c of cmds){const x=m[c.code];if(!x||x.local===false||(x.conv&&x.conv!=='default'))return false;dps[String(x.id)]=c.value}
  try{const r=await Promise.race([nativeCall({action:'tuyaCmd',id:d.id,dps}),new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),3000))]);

async function syncHeaterLink(){

    const raw=await nativeCall({action:'heater',cmd:'state'});

    if(!state||state.ok!==true||typeof state.on!=='boolean')throw new Error('אין חיווי מהדוד');

 ['16:29','19:09','17:29','20:09'],['16:50','19:30','17:50','20:30'],

function waterbarIsSummer(d){
 const y=d.getFullYear(),lastSunday=m=>{const x=new Date(y,m,0);x.setDate(x.getDate()-x.getDay());return x};

 return d>=march&&d<october;
}
function waterbarClock(){

 const nextFriday=new Date(now);nextFriday.setDate(now.getDate()+(5-now.getDay()+7)%7);nextFriday.setHours(0,0,0,0);
 const entry=WATERBAR_SCHEDULE[nextFriday.getMonth()][i],exit=WATERBAR_SCHEDULE[nextFriday.getMonth()][i+1];

 const friStart=asDate(nextFriday,entry),satEnd=asDate(new Date(nextFriday.getFullYear(),nextFriday.getMonth(),nextFriday.getDate()+1),exit);
 let active=now>=friStart&&now<satEnd;
 if(now.getDay()===6){const prev=new Date(now);prev.setDate(now.getDate()-1);const prevEntry=WATERBAR_SCHEDULE[prev.getMonth()][i];active=now>=asDate(prev,prevEntry)&&now<asDate(now,WATERBAR_SCHEDULE[prev.getMonth()][i+1]);}

}

async function openSiri(){
  let tok;try{tok=(await api('/token')).token}catch(e){return toast(e.message)}
  const U=(d,cmds,say)=>`${CFG.api.replace(/\/$/,'')}/act?k=${encodeURIComponent(tok)}&d=${encodeURIComponent(d)}&c=${b64url(cmds)}&s=${encodeURIComponent(say)}`;
  const items=[];
  DEVS.filter(powerCode).forEach(d=>{const pc=powerCode(d);items.push({t:'הדלקת '+dname(d),urls:[U(d.id,[{code:pc,value:true}],dname(d)+' נדלק')]},{t:'כיבוי '+dname(d),urls:[U(d.id,[{code:pc,value:false}],dname(d)+' כבה')]})});
  SCENES.forEach(sc=>items.push({t:'סצנה: '+sc.name,urls:sc.acts.map((a,k)=>U(a.device,[a.cmd],k===sc.acts.length-1?'"'+sc.name+'" בוצעה':'.'))}));
  sheet('Siri וקיצורי דרך',`<p>כל פעולה כאן היא קישור. שמים אותו בקיצור באפליקציית <b>קיצורים</b>, ואז אפשר לבקש מסירי או להוסיף כפתור למסך הבית.</p>
   <ol><li>לחץ <b>העתקה</b> ליד הפעולה</li><li>בקיצורים: <b>+</b> ← הוסף פעולה ← <b>קבל תוכן של URL</b> והדבק</li><li>${'בסצנה עם כמה קישורים - פעולה אחת לכל קישור'}</li><li>תן לקיצור שם, למשל "תדליק טוסטר". זה מה שאומרים לסירי</li></ol>
   <div class="list">${items.map((it,k)=>`<div class="row"><span class="grow t">${esc(it.t)}${it.urls.length>1?` <span class="s">(${it.urls.length} קישורים)</span>`:''}</span><button class="btn" data-cp="${k}" aria-label="העתקת הקישור ל${esc(it.t)}">העתקה</button></div>`).join('')||'<div class="row"><span class="s">אין מכשירים</span></div>'}</div>
   <p style="font-size:.9rem">הקישורים פרטיים. מי שיש לו אותם יכול להפעיל את המכשירים.</p><button class="btn bad wide" id="sR">ביטול כל הקישורים ויצירת חדשים</button>`,(el,close)=>{
    el.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(items[+b.dataset.cp].urls.join('\n')).then(()=>{b.textContent='הועתק';toast('הקישור הועתק')},()=>toast('ההעתקה לא הצליחה'))});
    el.querySelector('#sR').onclick=async()=>{if(!confirm('הקיצורים הקיימים יפסיקו לעבוד. להמשיך?'))return;try{await api('/token',{renew:true});close();openSiri()}catch(e){toast(e.message)}};
  });
}

function openBackup(){
  const data=()=>({app:'HomeOn',v:1,at:new Date().toISOString(),meta:META,scenes:SCENES.map(({schedIds,...x})=>x),wash:LSj('unplug_wash',{}),acp:LSj('unplug_acp',{}),shabbat:LSj('unplug_shabbat',null),presence:LSj('unplug_presence',null),widget:LSj('unplug_widget',null)});
  const code=()=>'UNPLUG1:'+b64url({meta:META,scenes:SCENES.map(({schedIds,...x})=>x)});
  const restore=o=>{if(!o||!o.meta)throw 0;Object.assign(META,{names:{},rooms:{},roomList:[],fav:{}},o.meta);saveMeta();SCENES=o.scenes||[];saveScenes();
    for(const[k,ls]of[['wash','unplug_wash'],['acp','unplug_acp'],['shabbat','unplug_shabbat'],['presence','unplug_presence'],['widget','unplug_widget']])if(o[k]!=null)LSset(ls,JSON.stringify(o[k]))};
  sheet('גיבוי ושחזור',`<p>שומר שמות, חדרים, סמלילים, מועדפים, סצנות, מכונת הכביסה, מצב שבת והווידג׳ט.</p>
    ${typeof gbRowHtml==='function'?gbRowHtml():''}
    <div class="sec-h"><h2>Google Drive — גיבוי כקובץ</h2></div>
    <p>שמור קובץ גיבוי ב-Google Drive דרך תפריט השיתוף של האייפון. זהו גיבוי ידני, לא סנכרון אוטומטי.</p>
    <button class="btn pri wide" id="bkFileSave">שמירת גיבוי ב-Google Drive</button>
    <div class="field"><label for="bkFileLoad">שחזור מקובץ גיבוי</label><input id="bkFileLoad" type="file" accept=".json,application/json"></div>
    <div class="sec-h"><h2>קוד גיבוי</h2></div>
    <div class="code" id="bkC">${esc(code())}</div><button class="btn wide" id="bkCp">${svg('save')}העתקת הקוד</button>
    <div class="field"><label for="bkI">שחזור מקוד</label><textarea class="field-ta" id="bkI" placeholder="UNPLUG1:..."></textarea></div>
    <div class="err" id="bkE" role="alert"></div><button class="btn pri wide" id="bkR">שחזור</button>`,(el,close)=>{
    if(typeof gbBind==='function')gbBind(el,()=>openBackup());
    el.querySelector('#bkFileSave').onclick=async()=>{
      const blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'});
      const file=new File([blob],'HomeOn-backup-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
      try{
        if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'גיבוי HomeOn'});return}
      }catch(e){if(e.name==='AbortError')return}
      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
      toast('הקובץ הורד. אפשר לשמור אותו ב-Google Drive');
    };
    el.querySelector('#bkFileLoad').onchange=async e=>{
      const f=e.target.files?.[0];if(!f)return;
      try{
        if(f.size>5e6)throw Error('הקובץ גדול מדי');
        const o=JSON.parse(await f.text());
        if(o.app!=='HomeOn'||!o.meta||!Array.isArray(o.scenes))throw Error('קובץ לא מתאים');
        if(!confirm('לשחזר את גיבוי HomeOn? ההגדרות הנוכחיות יוחלפו.'))return;
        restore(o);close();render();toast('הגיבוי שוחזר');
      }catch(err){el.querySelector('#bkE').textContent='לא ניתן לשחזר: '+(err.message||'קובץ לא תקין')}
    };
    el.querySelector('#bkCp').onclick=()=>navigator.clipboard?.writeText(code()).then(()=>toast('הועתק'),()=>{});
    el.querySelector('#bkR').onclick=()=>{try{const t=el.querySelector('#bkI').value.trim().replace(/^UNPLUG1:/,'');restore(JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/'))))));close();render();toast('שוחזר. סצנות מתוזמנות צריך לשמור שוב')}catch(e){el.querySelector('#bkE').textContent='הקוד לא תקין'}}
  });
}

   ${META.icons&&META.icons[d.id]?'<button class="btn wide" id="icA">חזרה לבחירה אוטומטית</button>':''}${customPicker(cur)}`,(el,close)=>{
    const set=k=>{META.icons=META.icons||{};k&&k!=='photo'?META.icons[d.id]=k:delete META.icons[d.id];saveMeta();close();cb&&cb()};
    el.querySelectorAll('[data-ic2]').forEach(b=>b.onclick=()=>set(b.dataset.ic2));
    el.querySelector('#icA')&&(el.querySelector('#icA').onclick=()=>set(null));
  });

function renameRoom(o,after){
  const n=(prompt('שם חדש לחדר',o)||'').trim();if(!n||n===o)return false;
  if(META.roomList.includes(n)){toast('יש כבר חדר בשם הזה');return false}
  META.roomList[META.roomList.indexOf(o)]=n;META.roomHome[n]=roomHomeOf(o);delete META.roomHome[o];
  for(const k in META.rooms)if(META.rooms[k]===o)META.rooms[k]=n;if(ROOM===o)ROOM=n;
  META.roomAlias=META.roomAlias||{};for(const k in META.roomAlias)if(META.roomAlias[k]===o)META.roomAlias[k]=n;
  if(!Object.values(META.roomAlias).includes(n))META.roomAlias[o]=n;
  saveMeta();render();toast('השם עודכן');after&&after();return true;
}
function manageRooms(focusRoom){
  const H=META.home,rooms=()=>roomsOf(H),devs=devicesForHome(H);

  sheet('חדרים בבית '+esc(curHome().name),`<div class="list" id="rl"></div><button class="btn wide" id="ra">${svg('plus')}חדר חדש</button>
    <div class="sec-h"><h2>שיוך מכשירים</h2></div><div class="list" id="dl"></div>`,(el)=>{
    const draw=()=>{
      el.querySelector('#rl').innerHTML=rooms().length?rooms().map(r=>`<div class="row"><button class="row-btn grow" data-ren="${esc(r)}" aria-label="שינוי שם לחדר ${esc(r)}" style="display:block"><span class="t">${esc(r)} <span aria-hidden="true" style="display:inline-block;width:16px;height:16px;vertical-align:-2px;color:var(--gold)">${svg('edit')}</span></span><br><span class="s">${devs.filter(d=>roomOf(d)===r).length} מכשירים · הקש לשינוי שם</span></button><button class="icbtn" data-del="${esc(r)}" aria-label="מחיקת חדר ${esc(r)}">${svg('trash')}</button></div>`).join(''):`<div class="row"><span class="s">עוד אין חדרים בבית הזה</span></div>`;
      el.querySelector('#dl').innerHTML=devs.map(d=>`<div class="ctl"><div class="ctl-h"><span class="mini">${devArt(d)}</span><span class="t grow" style="flex:1">${esc(dname(d))}</span></div>
        <div class="field"><label for="ra_${esc(d.id)}" class="sr">חדר של ${esc(dname(d))}</label><select id="ra_${esc(d.id)}" data-dr="${esc(d.id)}"><option value="">ללא חדר</option>${rooms().map(r=>`<option${roomOf(d)===r?' selected':''}>${esc(r)}</option>`).join('')}</select></div>
        ${multi?`<div class="field"><label for="hm_${esc(d.id)}">בית</label><select id="hm_${esc(d.id)}" data-dh="${esc(d.id)}">${META.homes.map(h=>`<option value="${h.id}"${homeOf(d)===h.id?' selected':''}>${esc(h.name)}</option>`).join('')}</select></div>`:''}</div>`).join('')||`<div class="row"><span class="s">אין מכשירים בבית הזה</span></div>`;
      el.querySelectorAll('[data-dr]').forEach(x=>x.onchange=()=>{x.value?META.rooms[x.dataset.dr]=x.value:delete META.rooms[x.dataset.dr];saveMeta();render();toast('נשמר')});
      el.querySelectorAll('[data-dh]').forEach(x=>x.onchange=()=>{META.devHome[x.dataset.dh]=x.value;delete META.rooms[x.dataset.dh];saveMeta();draw();render();toast('המכשיר עבר בית')});
      el.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>renameRoom(b.dataset.ren,draw));
      el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const r=b.dataset.del;if(!confirm(`למחוק את החדר "${r}"? המכשירים יישארו בלי חדר.`))return;META.roomList.splice(META.roomList.indexOf(r),1);delete META.roomHome[r];for(const k in META.rooms)if(META.rooms[k]===r)delete META.rooms[k];saveMeta();draw();render()});
    };
    draw();
    el.querySelector('#ra').onclick=()=>{const n=(prompt('שם החדר החדש','סלון')||'').trim();if(n&&!META.roomList.includes(n)){META.roomList.push(n);META.roomHome[n]=H;saveMeta();draw();render()}};
    if(focusRoom){const sel=el.querySelector('[data-dr]');sel&&sel.focus()}
  });
}
/* import homes & rooms from Smart Life (needs the /homes server route) */
async function importTuya(manual){
  let j;try{j=await api('/homes')}catch(e){if(manual)toast(/נתיב לא מוכר|404/.test(e.message)?'השרת עוד לא מעודכן - צריך עדכון שרת אחד':e.message);return false}
  if(!j.homes||!j.homes.length){if(manual)toast('לא נמצאו בתים ב-Smart Life');return false}
  const idOf=h=>'t'+h.id;
  for(const h of j.homes){const ex=META.homes.find(x=>x.id===idOf(h));ex?ex.name=h.name||ex.name:META.homes.push({id:idOf(h),name:h.name||'בית'})}
  // Never merge homes by display name: Elior, Apartment and Shuva remain independent.
  // Preserve local homes and their device assignments unless Smart Life gives an exact device mapping.
  if(!META.homes.some(h=>h.id===UNASSIGNED_HOME))META.homes.push({id:UNASSIGNED_HOME,name:'לא משויכים'});
  for(const[did,w]of Object.entries(j.where||{})){if(w.home==null||!j.homes.some(h=>String(h.id)===String(w.home)))continue;META.devHome[did]=idOf({id:w.home});
    if(w.room&&w.room.name){const hid=idOf({id:w.home});const base=(META.roomAlias||{})[w.room.name]||w.room.name;let r=base;if(META.roomList.includes(r)&&roomHomeOf(r)!==hid){const label=(j.homes.find(h=>String(h.id)===String(w.home))||{}).name||String(w.home);r=base+' ('+label+')'}if(!META.roomList.includes(r))META.roomList.push(r);META.roomHome[r]=hid;if(manual||!META.rooms[did])META.rooms[did]=r}}
  if(!META.homes.some(h=>h.id===META.home))META.home=META.homes[0].id;
  META.tuyaAt=Date.now();saveMeta();render();if(manual)toast('יובא מ-Smart Life');return true;
}
function openHomeDiagnostics(){
  sheet('אבחון שיוך בתים','<p>השוואה לקריאה בלבד בין Smart Life לבין HomeOn.</p><div class="list" id="diagRows" aria-live="polite">טוען...</div><button class="btn wide" id="diagAgain">בדיקה מחדש</button>',el=>{
    const out=el.querySelector('#diagRows');
    const run=async()=>{
      out.textContent='בודק שיוכים בשרת...';
      try{
        const [j,d]=await Promise.all([api('/homes'),api('/devices')]);
        const homes=Array.isArray(j.homes)?j.homes:[],where=j.where||{},devices=Array.isArray(d.devices)?d.devices:[];
        const rows=[];
        for(const h of homes){
          const members=Object.entries(where).filter(([,w])=>String(w?.home)===String(h.id));
          rows.push('<div class="row"><span class="t">'+esc(h.name)+' · '+members.length+' מכשירים בשרת</span></div>');
          for(const [id] of members){
            const device=devices.find(x=>String(x.id)===String(id));
            const local=META.devHome[id];
            const localName=META.homes.find(x=>x.id===local)?.name||'ללא שיוך';
            rows.push('<div class="row"><span class="grow"><span class="t">'+esc(META.names?.[id]||device?.name||'מכשיר ללא שם')+'</span><br><span class="s">HomeOn: '+esc(localName)+(local!=='t'+String(h.id)?' · שיוך שונה':'')+'</span></span></div>');
          }
        }
        const missing=devices.filter(x=>!where[String(x.id)]);
        rows.push('<div class="row"><span class="t">ללא שיוך בשרת: '+missing.length+' מכשירים</span></div>');
        for(const d of missing)rows.push('<div class="row"><span class="t">'+esc(META.names?.[d.id]||d.name||'ללא שם')+'</span></div>');
        const extra=META.homes.filter(h=>!homes.some(x=>h.id==='t'+String(x.id)));
        rows.push('<div class="row"><span class="grow"><span class="t">בתים מקומיים נוספים</span><br><span class="s">'+esc(extra.map(x=>x.name).join(' · ')||'אין')+'</span></span></div>');
        out.innerHTML=rows.join('');
      }catch(e){out.textContent='שגיאה בבדיקת השרת: '+(e.message||String(e))}
    };
    el.querySelector('#diagAgain').onclick=run;run();
  });
}

      el.querySelectorAll('[data-hs]').forEach(b=>b.onclick=()=>{META.home=b.dataset.hs;ROOM='all';saveMeta();close();render()});
      el.querySelectorAll('[data-hr]').forEach(b=>b.onclick=()=>{const h=META.homes.find(x=>x.id===b.dataset.hr),n=(prompt('שם הבית',h.name)||'').trim();if(n){h.name=n;saveMeta();draw();render()}});
      el.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{const h=META.homes.find(x=>x.id===b.dataset.hd);if(!confirm(`למחוק את "${h.name}"? המכשירים והחדרים שלו יעברו ל"${META.homes.find(x=>x.id!==h.id).name}".`))return;
        META.homes=META.homes.filter(x=>x.id!==h.id);const to=META.homes[0].id;for(const k in META.devHome)if(META.devHome[k]===h.id)META.devHome[k]=to;for(const k in META.roomHome)if(META.roomHome[k]===h.id)META.roomHome[k]=to;if(META.home===h.id)META.home=to;saveMeta();draw();render()});
    };
    draw();
    el.querySelector('#hDiag').onclick=()=>{close();openHomeDiagnostics()};
    el.querySelector('#hImp').onclick=async()=>{const b=el.querySelector('#hImp');b.disabled=true;b.textContent='מייבא...';const ok=await importTuya(true);if(ok)close();else{b.disabled=false;b.innerHTML=svg('ref')+'ייבוא מ־Smart Life'}};
    el.querySelector('#ha').onclick=()=>{const n=(prompt('שם הבית החדש','בית ההורים')||'').trim();if(!n)return;const id='h'+Date.now().toString(36);META.homes.push({id,name:n});saveMeta();draw()};
  });
}
function openAdd(){

  if(META.router===false&&confirm('להחזיר את הראוטר ל-HomeOn?')){delete META.router;saveMeta();render();return}
  if(META.mova===false&&confirm('להחזיר את MOVA E30 Ultra ל־HomeOn?')){delete META.mova;saveMeta();render();return}
  if(META.oralb===false&&confirm('להחזיר את Oral-B iO2 ל־HomeOn?')){delete META.oralb;saveMeta();render();return}
  const before=new Set(DEVS.map(d=>d.id));
  sheet('הוספת מכשיר',`<p>את הצימוד עצמו עושים פעם אחת ב-Smart Life, כי אייפון לא מאפשר לאפליקציית רשת להעביר למכשיר את סיסמת ה-WiFi.</p>
    <button class="btn pri wide" id="aO">${svg('plus')}פתיחת Smart Life להוספה</button>
    <ol><li>ב-Smart Life לחץ <b>+</b> למעלה ← <b>הוספת מכשיר</b></li><li>בחר את המכשיר, או חכה שיזוהה לבד</li><li>הזן את סיסמת ה-WiFi של הבית וסיים</li><li>חזור לכאן - HomeOn יחפש את המכשיר החדש לבד</li></ol>
    <button class="btn wide" id="aR">${svg('ref')}כבר צימדתי, רענן</button>
    ${IN_APP&&!META.tv?`<div class="sec-h"><h2>לא מ-Smart Life</h2></div><button class="btn wide" id="aTV">${svg('plus')}Google TV</button>`:''}`,(el,close)=>{
    el.querySelector('#aTV')&&(el.querySelector('#aTV').onclick=()=>{close();tvSetup()});
    const check=async()=>{await loadDevices();await importTuya(false);const n=DEVS.filter(d=>!before.has(d.id));
      if(n.length){close();TAB='devices';ROOM='all';render();const visible=n.filter(inHome);toast(visible.length?(n.length===1?`נוסף: ${dname(n[0])}`:`נוספו ${n.length} מכשירים`):'המכשיר נמצא, אבל משויך לבית אחר. החלף בית למעלה')}else toast('לא נמצא מכשיר חדש בחשבון המחובר. בדוק חשבון ובית ב-Smart Life')};
    let away=false;const onVis=()=>{if(document.visibilityState==='hidden')away=true;else if(away&&document.body.contains(el)){away=false;check()}};
    document.addEventListener('visibilitychange',onVis);
    el.querySelector('#aO').onclick=()=>{const t=Date.now();location.href='smartlife://';
      setTimeout(()=>{if(document.visibilityState==='visible'&&Date.now()-t<2600)location.href='https://apps.apple.com/app/id1115101477'},1600)};
    el.querySelector('#aR').onclick=()=>{check()};
  });
}

/* ---------- connect ---------- */
function linkOk(k){setKey(k);if(!LS('kor_key'))LSset('kor_key',k);document.querySelector('.scrim')?.remove();document.querySelector('.app').removeAttribute('aria-hidden');toast('מחובר');loadDevices();loadSched()}
function openConnect(){
  sheet('התחברות',`<p>בוחרים דרך אחת. מספיק פעם אחת.</p>
    <button class="btn pri wide" id="cR">יש לי קוד שחזור מ-Breeze</button>
    <button class="btn wide" id="cQ">התחברות עם Smart Life (QR)</button>`,(el)=>{
    el.querySelector('#cR').onclick=openRecover;el.querySelector('#cQ').onclick=openQRStart});
}
function openRecover(){
  sheet('קוד שחזור',`<p>הקוד מופיע ב-Breeze בהגדרות, בפורמט XXXXX-XXXXX.</p>
    <div class="field"><label for="rcI">הקוד</label><input id="rcI" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX" style="direction:ltr;text-align:center;font-size:1.5rem;letter-spacing:.06em"></div>
    <div class="err" id="rcE" role="alert"></div><div class="btns"><button class="btn" id="rcB">חזרה</button><button class="btn pri" id="rcG">התחברות</button></div>`,(el)=>{
    el.querySelector('#rcB').onclick=openConnect;
    el.querySelector('#rcG').onclick=async()=>{const b=el.querySelector('#rcG');b.disabled=true;b.textContent='בודק...';
      try{const j=await api('/recover',{code:el.querySelector('#rcI').value});linkOk(j.key)}catch(e){el.querySelector('#rcE').textContent=e.message;b.disabled=false;b.textContent='התחברות'}};
  });
}
function openQRStart(){
  sheet('Smart Life',`<p>ב-Smart Life: <b>אני ← הגדרות ← חשבון ואבטחה ← User Code</b>. העתק את הקוד והדבק כאן.</p>
    <div class="field"><label for="uc">User Code</label><input id="uc" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(LS('kor_uc')||'')}" style="direction:ltr"></div>
    <div class="err" id="qE" role="alert"></div><div class="btns"><button class="btn" id="qB">חזרה</button><button class="btn pri" id="qN">המשך</button></div>`,(el)=>{
    el.querySelector('#qB').onclick=openConnect;
    el.querySelector('#qN').onclick=async()=>{const uc=el.querySelector('#uc').value.trim();if(!uc)return;const b=el.querySelector('#qN');b.disabled=true;b.textContent='רגע...';
      try{const j=await api('/share/qr',{userCode:uc});LSset('kor_uc',uc);showQR(uc,j)}catch(e){el.querySelector('#qE').textContent=e.message;b.disabled=false;b.textContent='המשך'}};
  });
}
function showQR(uc,j){
  let stop=false;
  sheet('סריקה ב-Smart Life',`<div class="qrbox" id="qrb" role="img" aria-label="קוד QR להתחברות"></div>
    <ol><li>צלם מסך עכשיו (צד + הגברת עוצמה)</li><li>ב-Smart Life: <b>אני ← סמל הסריקה למעלה ← אלבום</b> ובחר את צילום המסך</li><li>אשר שם, ואני ממשיך לבד</li></ol>
    <div class="err" id="pE" role="alert"></div>`,(el,close)=>{
    try{const q=qrcode(0,'Q');q.addData(j.qr);q.make();el.querySelector('#qrb').innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){el.querySelector('#qrb').textContent=j.qr}
    el.querySelector('[data-x]').addEventListener('click',()=>stop=true);
  });
  const t0=Date.now();
  (async function poll(){while(!stop&&document.querySelector('#qrb')){await new Promise(r=>setTimeout(r,2500));if(stop||!document.querySelector('#qrb'))return;
    if(Date.now()-t0>170000){const p=document.querySelector('#pE');if(p)p.textContent='הקוד פג. חזור ונסה שוב.';return}
    try{const r=await api('/share/poll',{userCode:uc,token:j.token});if(r.linked){linkOk(r.key);return}}catch(e){}}})();
}

/* ---------- boot ---------- */
function applyPrefs(){document.documentElement.style.setProperty('--ts',(LS('unplug_ts')||'100')+'%');document.documentElement.style.setProperty('--g',(+(LS('unplug_glass')??55))/100)}
document.querySelectorAll('nav.bar button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();if(TAB==='sched')loadSched().catch(()=>{}).then(render);window.document.querySelector('.app').scrollTo(0,0)});
$('refBtn').onclick=async()=>{await loadDevices();await importTuya(false);loadSched().catch(()=>{})};
$('homeBtn').onclick=openHomes;
$('menuBtn').onclick=()=>{
  const old=document.getElementById('dropMenu');if(old){old.remove();$('menuBtn').setAttribute('aria-expanded','false');return}
  const HD=DEVS.filter(inHome),on=HD.filter(d=>d.online&&isOn(d)).length,btn=$('menuBtn'),r=btn.getBoundingClientRect();
  const m=document.createElement('div');m.id='dropMenu';m.className='dropMenu';m.setAttribute('role','menu');m.setAttribute('aria-label','תפריט');
  m.style.top=(r.bottom+8)+'px';m.style.left=Math.max(12,r.left)+'px';
  const items=[['edit','עריכת המסך',()=>{TAB='devices';setReorder(true)}],['power',on?`לכבות הכול (${on})`:'לכבות הכול',()=>$('offBtn').onclick(),!on],['plus','הוספת מכשיר',openAdd],['list','חדרים - שמות ושיוך',()=>manageRooms()],['house','בתים',openHomes],['ref','רענון',async()=>{await loadDevices();await importTuya(false);loadSched()}]];
  m.innerHTML=items.map(([ic,t,,dis],i)=>`<button role="menuitem" data-mi="${i}" ${dis?'disabled':''}>${svg(ic)}<span>${t}</span></button>`).join('');
  document.body.append(m);btn.setAttribute('aria-expanded','true');
  const close=()=>{m.remove();btn.setAttribute('aria-expanded','false');removeEventListener('pointerdown',out,true);removeEventListener('keydown',key,true)};
  const out=e=>{if(!m.contains(e.target)&&e.target!==btn&&!btn.contains(e.target))close()};
  const key=e=>{const bs=[...m.querySelectorAll('button:not(:disabled)')],i=bs.indexOf(document.activeElement);
    if(e.key==='Escape'){close();btn.focus()}else if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus()}};
  addEventListener('pointerdown',out,true);addEventListener('keydown',key,true);
  m.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{close();items[+b.dataset.mi][2]()});
  m.querySelector('button:not(:disabled)').focus();
};
$('editBtn').onclick=()=>{if(TAB!=='devices'){TAB='devices'}typeof setReorder==='function'&&setReorder(!REORDER)};
$('addBtn').onclick=openAdd;
setTimeout(()=>{const sp=$('splash');if(!sp)return;sp.classList.add('out');setTimeout(()=>sp.remove(),450)},matchMedia('(prefers-reduced-motion: reduce)').matches?0:1500);
applyPrefs();try{render()}catch(e){console.error(e)}
function openFromHash(){const m=location.hash.match(/dev=([^&]+)/);if(!m)return;const id=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname);
  const go=()=>{const d=DEVS.find(x=>x.id===id);if(d){TAB='devices';render();openDevice(d)}};DEVS.length?go():setTimeout(go,2500)}
addEventListener('hashchange',openFromHash);setTimeout(openFromHash,600);
if(CFG.key){LSset('unplug_key',CFG.key);loadDevices();loadSched().catch(()=>{})}else openConnect();
setInterval(()=>{if(document.visibilityState==='visible'&&CFG.key&&!document.querySelector('.scrim [type=range]:active')&&!(typeof REORDER!=='undefined'&&REORDER))loadDevices()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CFG.key){loadDevices();loadSched().catch(()=>{})}});
</script>
