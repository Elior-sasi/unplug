<style>
/* Unplug - same family as Unbox: black base, one accent (amber), Rubik, glass pill nav, cards with soft top light. */
@font-face{font-family:Rubik;src:url(fonts/rubik-hebrew-400-normal.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Rubik;src:url(fonts/rubik-hebrew-500-normal.woff2) format('woff2');font-weight:500 600;font-display:swap;unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Rubik;src:url(fonts/rubik-hebrew-700-normal.woff2) format('woff2');font-weight:700 800;font-display:swap;unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-500-normal.woff2) format('woff2');font-weight:500 600;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:Rubik;src:url(fonts/rubik-latin-700-normal.woff2) format('woff2');font-weight:700 800;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
:root{color-scheme:dark;--bg:#0a0f14;--card:#121a22;--card2:#18222c;--line:#223040;--ink:#f2f4f8;--mut:#b4bdca;
 --acc:#ffb23e;--acc2:#ff8a3d;--acc-ink:#1f1200;--acc-soft:#3a2a10;--acc-line:#a8741f;--acc-txt:#ffd28a;--ok:#3fd49a;--bad:#ff8fa3;--nav-h:64px}
*{box-sizing:border-box}
html{font-size:var(--ts,100%);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--acc-txt);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:640px;margin:0 auto;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));background:radial-gradient(120% 50% at 100% 0,#3d2a0f66,transparent 60%)}
header.top{padding:4px 4px 0;margin-bottom:18px}
.brandRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:flex-end;gap:1px;font-size:1.5rem;font-weight:700;color:#fff3e0;line-height:1;letter-spacing:-.2px;direction:ltr}
.brand svg{height:1.45em;width:auto;margin:0 1px -.04em 0}
.actions{display:flex;gap:8px}
.icbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ffffff0d;border:1px solid #ffffff14;color:#e6ebf2;flex:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.icbtn svg{width:22px;height:22px}
.icbtn[aria-busy="true"] svg{animation:r 1s linear infinite}
.hello{margin:22px 0 0;color:var(--mut);font-size:1rem;font-weight:500}
header.top h1{font-size:2.3rem;font-weight:700;letter-spacing:-.6px;margin:2px 0 0;line-height:1.15}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:#ffffff0b;border:1px solid #ffffff14;font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}
.pill svg{width:17px;height:17px}.pill.hot{background:#ffb23e1c;border-color:#ffb23e55;color:var(--acc-txt)}.pill.bad{color:var(--bad);border-color:#ff8fa355;background:#ff8fa314}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;background:#ffffff09;border:1px solid #ffffff12;color:var(--mut);white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px}
.card{position:relative;background:linear-gradient(160deg,#ffffff0d,#ffffff03 55%),#10171f;border:1px solid #ffffff12;border-radius:28px;padding:16px;min-height:168px;display:flex;flex-direction:column;gap:4px;text-align:start;box-shadow:inset 0 1px 0 #ffffff10,0 10px 30px #0006;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s;overflow:hidden}
.card:active{transform:scale(.97)}
.card::before{content:"";position:absolute;inset:auto -30% -55% auto;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffb23e55,transparent 65%);opacity:0;transition:opacity .4s;pointer-events:none}
.card.is-on{background:linear-gradient(160deg,#ffb23e26,#ff8a3d0a 60%),#14140f;border-color:#ffb23e50}
.card.is-on::before{opacity:1}
.card.off-line{opacity:.62}
.card .open{position:absolute;inset:0;border-radius:27px;z-index:1}
.card .ic{width:62px;height:62px;border-radius:21px;background:#ffffff0c;border:1px solid #ffffff14;display:grid;place-items:center;color:#aeb8c6;transition:all .3s}
.card .ic svg{width:36px;height:36px}
.card.is-on .ic{background:linear-gradient(150deg,#ffd27a,#ff8a3d);border-color:transparent;color:#2a1500;box-shadow:0 8px 24px #ff9a3d66}
svg .d{fill:currentColor;fill-opacity:.22}
.card .ic.photo,.card .ic:has(.art){background:none;border:0;box-shadow:none;width:70px;height:70px;padding:0}
.card .ic .art{width:100%;height:100%}
.card.is-on .ic.photo,.card.is-on .ic:has(.art){background:none;box-shadow:none;filter:drop-shadow(0 6px 16px #ff9a3d88)}
.card:not(.is-on) .ic .art-clay,.card:not(.is-on) .ic .art-glass{filter:saturate(.35) brightness(.85)}
.card:not(.is-on) .ic .art-neon{opacity:.55}
.big-pw:has(.art),.big-pw[data-photo]{background:none!important;border:0!important;box-shadow:none!important;padding:0}
.big-pw .art{width:100%;height:100%}
.big-pw[aria-checked="true"]:has(.art),.big-pw[data-photo][aria-checked="true"]{filter:drop-shadow(0 10px 28px #ff9a3daa)}
.big-pw:not([aria-checked="true"]) .art-clay,.big-pw:not([aria-checked="true"]) .art-glass{filter:saturate(.35) brightness(.85)}
.mini svg.art{width:44px;height:44px}
.card .ic img,.big-pw img,.mini img{width:100%;height:100%;object-fit:contain;display:block}



.mini{width:44px;height:44px;color:var(--acc);display:grid;place-items:center;flex:none}.mini svg{width:34px;height:34px}.mini.photo{padding:0}
.card.is-on .ic svg .d{fill-opacity:.35}
.card .nm{font-weight:600;font-size:1.08rem;line-height:1.25;overflow-wrap:anywhere;margin-top:auto;padding-top:10px}
.card .st{color:var(--mut);font-size:.9rem;font-variant-numeric:tabular-nums}
.card.is-on .st{color:var(--acc-txt)}
.card .pw{position:absolute;top:14px;left:12px;width:58px;height:48px;display:grid;place-items:center;z-index:2}
.card .pw::before{content:"";width:52px;height:32px;border-radius:999px;background:#ffffff1a;transition:background .25s}
.card .pw::after{content:"";position:absolute;top:10px;right:6px;width:28px;height:28px;border-radius:50%;background:#e9edf3;box-shadow:0 2px 6px #0007;transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.card .pw[aria-checked="true"]::before{background:linear-gradient(90deg,var(--acc2),var(--acc))}
.card .pw[aria-checked="true"]::after{transform:translateX(-20px);background:#fff}
.card .pw svg{display:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;gap:10px}
.sec-h h2{font-size:.95rem;margin:0;color:var(--mut);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:62px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}.row .t{font-weight:500;font-size:1.05rem}.row .s{color:var(--mut);font-size:.92rem}
.row-btn{width:100%;text-align:start}
.row-btn>svg{width:20px;height:20px;color:var(--mut);flex:none}
.empty{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;text-align:center;color:var(--mut);line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}

const DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'],DAYSL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function daysText(s){const ds=(s.days||[]).slice().sort();if(s.once)return 'פעם אחת';if(ds.length===7)return 'כל יום';if(ds.join()==='0,1,2,3,4')return 'א׳-ה׳';if(ds.join()==='5,6')return 'סופ״ש';return ds.map(i=>DAYS[i]).join(' ')}
function cmdsText(s){const d=DEVS.find(x=>x.id===s.device);return (s.cmds||[]).map(c=>{const f=d&&(d.functions||[]).find(x=>x.code===c.code);
  if(d&&c.code===powerCode(d))return c.value?'הדלקה':'כיבוי';const n=f?nameOf(f):c.code;
  return n+': '+(typeof c.value==='boolean'?(c.value?'דלוק':'כבוי'):f&&f.type==='Integer'?fmtNum(c.value,f):vname(c.value))}).join(', ')}
function schedRow(s,withDev){const d=DEVS.find(x=>x.id===s.device);
  return `<div class="row"><button class="row-btn grow" data-se="${esc(s.id)}" style="display:block"><span class="t" style="font-family:var(--f-num);font-size:1.3rem">${esc(s.time)}</span> <span class="t">${esc(cmdsText(s))}</span><br><span class="s">${withDev?esc(d?dname(d):'מכשיר שהוסר')+' · ':''}${esc(daysText(s))}${s.label&&s.label!=='טיימר'?' · '+esc(s.label):''}</span></button>
   <button class="sw" role="switch" data-sen="${esc(s.id)}" aria-checked="${!!s.enabled}" aria-label="תזמון ${esc(s.time)} פעיל"></button></div>`}
function bindSchedRows(root){
  root.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>{const s=SCHED.find(x=>x.id===b.dataset.se);openSchedEdit(s,DEVS.find(x=>x.id===s.device))});
  root.querySelectorAll('[data-sen]').forEach(b=>b.onclick=async()=>{const s=SCHED.find(x=>x.id===b.dataset.sen);s.enabled=!s.enabled;b.setAttribute('aria-checked',s.enabled);
    try{await api('/schedules/save',s)}catch(e){s.enabled=!s.enabled;b.setAttribute('aria-checked',s.enabled);toast(e.message)}});
}
function viewSched(v){
  const list=SCHED.filter(s=>!(s.once&&s.label==='טיימר')&&!String(s.label||'').startsWith('סצנה: ')).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const tm=SCHED.filter(s=>s.once&&s.label==='טיימר');
  v.innerHTML=`<button class="btn pri wide" id="ns">${svg('plus')}תזמון חדש</button>
   ${tm.length?`<div class="sec-h"><h2>טיימרים פעילים</h2></div><div class="list">${tm.map(s=>schedRow(s,true)).join('')}</div>`:''}
   ${SCENES.some(x=>x.at)?`<div class="sec-h"><h2>סצנות מתוזמנות</h2></div><div class="list">${SCENES.filter(x=>x.at).map(x=>`<div class="row"><span class="grow"><span class="t" style="font-size:1.3rem">${esc(x.at)}</span> <span class="t">${esc(x.name)}</span><br><span class="s">${esc(daysText({days:x.days}))} · ${x.acts.length} פעולות</span></span></div>`).join('')}</div>`:''}
   <div class="sec-h"><h2>תזמונים</h2></div>
   ${list.length?`<div class="list">${list.map(s=>schedRow(s,true)).join('')}</div>`:`<div class="empty"><b>אין תזמונים</b>אפשר לתזמן כל מכשיר, לכל יום ולכל שעה.</div>`}`;
  $('ns').onclick=()=>pickDevice('לאיזה מכשיר?',d=>openSchedEdit(null,d));
  bindSchedRows(v);

function pickDevice(title,cb){
  const ds=DEVS.filter(inHome).concat(DEVS.filter(d=>!inHome(d))),rooms=[...new Set(ds.map(d=>roomOf(d)))];
  rooms.sort((x,y)=>(x?0:1)-(y?0:1));
  const row=d=>`<button class="row row-btn" data-pd="${esc(d.id)}"><span class="mini">${devArt(d)}</span><span class="grow t">${esc(dname(d))}</span>${svg('chev')}</button>`;
  sheet(title,rooms.map(r=>`<div class="sec-h" style="margin:8px 4px 0"><h2>${r?esc(r):'בלי חדר'}</h2></div><div class="list">${ds.filter(d=>roomOf(d)===r).map(row).join('')}</div>`).join(''),
   (el,close)=>el.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{close();cb(DEVS.find(x=>x.id===b.dataset.pd))}));
}
/* action picker - what to send: power on/off or any control value */
function actionEditor(d,cur){
  const fns=(d.functions||[]).filter(f=>!SKIP.has(f.code)&&['Boolean','Enum','Integer'].includes(f.type));
  const pc=powerCode(d);
  const opts=[];if(pc){opts.push({k:'on',t:'הדלקה',c:{code:pc,value:true}},{k:'off',t:'כיבוי',c:{code:pc,value:false}})}
  fns.filter(f=>f.code!==pc).forEach(f=>opts.push({k:'f:'+f.code,t:nameOf(f),f}));
  let sel=cur&&cur.code===pc?(cur.value?'on':'off'):cur?'f:'+cur.code:opts[0]?.k;
  const html=`<div class="field"><label for="actK">פעולה</label><select id="actK">${opts.map(o=>`<option value="${esc(o.k)}"${o.k===sel?' selected':''}>${esc(o.t)}</option>`).join('')}</select></div><div id="actV"></div>`;
  return {html,bind(el){
    const k=el.querySelector('#actK'),box=el.querySelector('#actV');
    const draw=()=>{const o=opts.find(x=>x.k===k.value);box.innerHTML='';if(!o||!o.f)return;const f=o.f,v=cur&&cur.code===f.code?cur.value:d.status[f.code];
      if(f.type==='Boolean')box.innerHTML=`<div class="field"><label for="actX">ערך</label><select id="actX"><option value="1"${v?' selected':''}>דלוק</option><option value="0"${v?'':' selected'}>כבוי</option></select></div>`;
      else if(f.type==='Enum')box.innerHTML=`<div class="field"><label for="actX">ערך</label><select id="actX">${(f.values.range||[]).map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(vname(o))}</option>`).join('')}</select></div>`;
      else{const x=f.values||{},sc=+x.scale||0;box.innerHTML=`<div class="field"><label for="actX">ערך${x.unit?' ('+esc(unitHe(x.unit))+')':''}</label><input id="actX" inputmode="decimal" value="${(v??+x.min??0)/10**sc}"></div>`}};
    k.onchange=draw;draw();
    return ()=>{const o=opts.find(x=>x.k===k.value);if(!o)return null;if(o.c)return o.c;const f=o.f,x=el.querySelector('#actX');
      if(f.type==='Boolean')return{code:f.code,value:x.value==='1'};if(f.type==='Enum')return{code:f.code,value:x.value};
      const vv=f.values||{},sc=+vv.scale||0;let n=Math.round(parseFloat(x.value)*10**sc);if(isNaN(n))return null;n=Math.min(+vv.max,Math.max(+vv.min,n));return{code:f.code,value:n}}}};
}
function openSchedEdit(s,d){
  if(!d)return toast('המכשיר לא נמצא');
  const ed=actionEditor(d,s&&s.cmds&&s.cmds[0]);let days=new Set(s?s.days:[]);
  sheet(s?'עריכת תזמון':'תזמון חדש',`<p>${esc(dname(d))}</p>
    <div class="field"><label for="sT">שעה</label><input id="sT" type="time" value="${esc(s?s.time:'07:00')}" style="font-size:1.6rem;direction:ltr;text-align:center"></div>
    <div class="field"><span style="font-weight:600" id="dL">ימים</span><div class="days" role="group" aria-labelledby="dL">${DAYS.map((x,i)=>`<button data-d="${i}" aria-pressed="${days.has(i)}" aria-label="${DAYSL[i]}">${x}</button>`).join('')}</div><div class="seg" role="group" aria-label="בחירה מהירה" style="margin-top:8px"><button data-dp="0,1,2,3,4,5,6">כל יום</button><button data-dp="0,1,2,3,4">א׳-ה׳</button><button data-dp="5,6">סופ״ש</button></div></div>
    <label class="row" style="background:var(--surface);border-radius:14px"><span class="grow t">פעם אחת בלבד</span><input type="checkbox" id="sO" ${s&&s.once?'checked':''} style="width:28px;height:28px;accent-color:var(--accent)"></label>
    ${ed.html}
    <div class="field"><label for="sL">תיאור (לא חובה)</label><input id="sL" value="${esc(s&&s.label!=='טיימר'?s.label||'':'')}"></div>
    <div class="err" id="sE" role="alert"></div>
    <div class="btns">${s?`<button class="btn bad" id="sD">${svg('trash')}מחיקה</button>`:''}<button class="btn pri" id="sS">שמירה</button></div>`,
  (el,close)=>{
    const get=ed.bind(el);
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;days.has(i)?days.delete(i):days.add(i);b.setAttribute('aria-pressed',days.has(i))});
    el.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{days=new Set(b.dataset.dp.split(',').map(Number));el.querySelectorAll('[data-d]').forEach(x=>x.setAttribute('aria-pressed',days.has(+x.dataset.d)))});
    el.querySelector('#sS').onclick=async()=>{const c=get(),t=el.querySelector('#sT').value,once=el.querySelector('#sO').checked;
      if(!t)return el.querySelector('#sE').textContent='בחר שעה';if(!c)return el.querySelector('#sE').textContent='ערך לא תקין';
      let ds=[...days];if(once){const now=new Date(),[h,m]=t.split(':').map(Number),at=new Date();at.setHours(h,m,0,0);if(at<=now)at.setDate(at.getDate()+1);ds=[at.getDay()]}
      if(!ds.length)return el.querySelector('#sE').textContent='בחר לפחות יום אחד';
      try{await api('/schedules/save',{id:s?.id,device:d.id,time:t,days:ds,cmds:[c],label:el.querySelector('#sL').value.trim(),enabled:true,once});await loadSched();close();render();refreshOpen(d);toast('נשמר')}
      catch(e){el.querySelector('#sE').textContent=e.message}};
    if(s)el.querySelector('#sD').onclick=async()=>{if(!confirm('למחוק את התזמון?'))return;try{await api('/schedules/delete',{id:s.id});await loadSched();close();render();refreshOpen(d);toast('נמחק')}catch(e){toast(e.message)}};
  });
}

    <button class="btn wide" id="nr">${svg('plus')}חדר חדש</button>`,(el,close)=>{
    const set=r=>{r?META.rooms[d.id]=r:delete META.rooms[d.id];saveMeta();close();cb&&cb()};

  });
}

/* ---------- scenes (run several actions in one tap) ---------- */
function viewScenes(v){
  v.innerHTML=`<button class="row row-btn list" id="shbS" style="margin-bottom:12px"><span class="grow"><span class="t">מצב שבת</span><br><span class="s">הדלקה וכיבוי לפי זמני כניסת ויציאת שבת</span></span>${svg('chev')}</button><button class="btn pri wide" id="nsc">${svg('plus')}סצנה חדשה</button><div class="sec-h"><h2>סצנות</h2></div>
   ${SCENES.length?`<div class="list">${SCENES.map((s,i)=>`<div class="row"><button class="row-btn grow" data-ed="${i}" style="display:block"><span class="t">${esc(s.name)}</span><br><span class="s">${s.acts.length} פעולות${s.at?' · '+esc(s.at)+' '+esc(daysText({days:s.days})):''}</span></button><button class="btn pri" data-run="${i}" aria-label="הפעלת ${esc(s.name)}">${svg('play')}הפעל</button></div>`).join('')}</div>`
   :`<div class="empty"><b>אין סצנות</b>סצנה מפעילה כמה מכשירים בלחיצה אחת, למשל "יוצא מהבית" שמכבה הכול.</div>`}`;
  $('nsc').onclick=()=>openScene(null);$('shbS').onclick=()=>openShabbat();
  v.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>openScene(+b.dataset.ed));
  v.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runScene(SCENES[+b.dataset.run],b));
}
async function runScene(s,b){
  b&&(b.disabled=true);let ok=0,bad=0;
  for(const a of s.acts){const d=DEVS.find(x=>x.id===a.device);if(!d){bad++;continue}
    try{await api('/command',{id:d.id,commands:[a.cmd]});d.status[a.cmd.code]=a.cmd.value;ok++}catch(e){bad++}}
  addLog('סצנה',s.name);b&&(b.disabled=false);render();toast(bad?`בוצעו ${ok}, נכשלו ${bad}`:`"${s.name}" בוצעה`);
}
function openScene(i){
  const s=i==null?{name:'',acts:[],_new:true}:JSON.parse(JSON.stringify(SCENES[i]));const isNew=!!s._new;
  const close=sheet(isNew?'סצנה חדשה':'עריכת סצנה',`<div class="field"><label for="scN">שם הסצנה</label><input id="scN" value="${esc(s.name)}" placeholder="יוצא מהבית"></div>
    <div class="sec-h" style="margin:6px 4px 0"><h2>פעולות</h2></div><div class="list" id="scA"></div>
    <button class="btn wide" id="scAdd">${svg('plus')}הוספת פעולה</button>
    <div class="sec-h" style="margin:6px 4px 0"><h2>הפעלה אוטומטית</h2></div>
    <div class="list"><label class="row"><span class="grow t">להפעיל בשעה קבועה</span><input type="checkbox" id="scT" ${s.at?'checked':''} style="width:28px;height:28px;accent-color:var(--acc)"></label>
     <div class="ctl" id="scTB" ${s.at?'':'hidden'}><div class="field"><label for="scTm">שעה</label><input id="scTm" type="time" value="${esc(s.at||'07:00')}" style="font-size:1.5rem;direction:ltr;text-align:center"></div>
     <div class="days" role="group" aria-label="ימים">${DAYS.map((x,k)=>`<button data-sd="${k}" aria-pressed="${(s.days||[]).includes(k)}" aria-label="${DAYSL[k]}">${x}</button>`).join('')}</div></div></div>
    <div class="err" id="scE" role="alert"></div>
    <div class="btns">${!isNew?`<button class="btn bad" id="scD">${svg('trash')}מחיקה</button>`:''}<button class="btn pri" id="scS">שמירה</button></div>`,(el,cl)=>{
    const draw=()=>{el.querySelector('#scA').innerHTML=s.acts.length?s.acts.map((a,k)=>{const d=DEVS.find(x=>x.id===a.device);
      return `<div class="row"><span class="grow"><span class="t">${esc(d?dname(d):'מכשיר שהוסר')}</span><br><span class="s">${esc(cmdsText({device:a.device,cmds:[a.cmd]}))}</span></span><button class="icbtn" data-rm="${k}" aria-label="הסרת פעולה">${svg('trash')}</button></div>`}).join(''):`<div class="row"><span class="s">עוד אין פעולות</span></div>`;
      el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{s.acts.splice(+b.dataset.rm,1);draw()})};
    draw();
    const sd=new Set(s.days||[]);
    el.querySelector('#scT').onchange=e=>{el.querySelector('#scTB').hidden=!e.target.checked};
    el.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{const k=+b.dataset.sd;sd.has(k)?sd.delete(k):sd.add(k);b.setAttribute('aria-pressed',sd.has(k))});
    const keepT=()=>{s._at=el.querySelector('#scT').checked?el.querySelector('#scTm').value:'';s._days=[...sd]};
    el.querySelector('#scAdd').onclick=()=>{s.name=el.querySelector('#scN').value;keepT();s.at=s._at;s.days=s._days;pickDevice('איזה מכשיר?',d=>{const ed=actionEditor(d);
      sheet(esc(dname(d)),ed.html+`<button class="btn pri wide" id="aOk">הוספה</button>`,(e2,c2)=>{const g=ed.bind(e2);e2.querySelector('#aOk').onclick=()=>{const c=g();if(!c)return toast('ערך לא תקין');s.acts.push({device:d.id,cmd:c});c2();reopen()}})})};
    const reopen=()=>{const tmpI=i;SCENES_TMP=s;openSceneObj(tmpI)};
    el.querySelector('#scS').onclick=async()=>{s.name=el.querySelector('#scN').value.trim();if(!s.name)return el.querySelector('#scE').textContent='תן שם לסצנה';if(!s.acts.length)return el.querySelector('#scE').textContent='הוסף לפחות פעולה אחת';
      keepT();if(s._at&&!s._days.length)return el.querySelector('#scE').textContent='בחר לפחות יום אחד';
      const b=el.querySelector('#scS');b.disabled=true;b.textContent='שומר...';
      try{await syncSceneSched(s,s._at,s._days)}catch(e){b.disabled=false;b.textContent='שמירה';return el.querySelector('#scE').textContent='התזמון לא נשמר: '+e.message}
      delete s._new;delete s._at;delete s._days;i==null?SCENES.push(s):SCENES[i]=s;saveScenes();cl();render();toast('נשמר')};
    if(!isNew)el.querySelector('#scD').onclick=async()=>{if(!confirm('למחוק את הסצנה?'))return;try{await syncSceneSched(s,'',[])}catch(e){}SCENES.splice(i,1);saveScenes();cl();render()};
  });
}
let SCENES_TMP=null;
/* a scheduled scene = one server schedule per action, all with the same time and days */
async function syncSceneSched(s,at,days){
  for(const id of s.schedIds||[])await api('/schedules/delete',{id}).catch(()=>{});
  s.schedIds=[];s.at=at||'';s.days=days;
  if(at)for(const a of s.acts){const j=await api('/schedules/save',{device:a.device,time:at,days,cmds:[a.cmd],label:'סצנה: '+s.name,enabled:true,once:false});s.schedIds.push(j.id)}
  loadSched();
}
function openSceneObj(i){const keep=SCENES_TMP;SCENES_TMP=null;if(i==null){SCENES.push(keep);openScene(SCENES.length-1);SCENES.pop()}else{const o=SCENES[i];SCENES[i]=keep;openScene(i);SCENES[i]=o}}

function linkOk(k){setKey(k);if(!LS('kor_key'))LSset('kor_key',k);document.querySelector('.scrim')?.remove();document.querySelector('.app').removeAttribute('aria-hidden');toast('מחובר');loadDevices();loadSched()}
function openConnect(){
  sheet('התחברות',`<p>בוחרים דרך אחת. מספיק פעם אחת.</p>
    <button class="btn pri wide" id="cR">יש לי קוד שחזור מ-Breeze</button>
    <button class="btn wide" id="cQ">התחברות עם Smart Life (QR)</button>`,(el)=>{
    el.querySelector('#cR').onclick=openRecover;el.querySelector('#cQ').onclick=openQRStart});
}
function openRecover(){
  sheet('קוד שחזור',`<p>הקוד מופיע ב-Breeze בהגדרות, בפורמט XXXXX-XXXXX.</p>
    <div class="field"><label for="rcI">הקוד</label><input id="rcI" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX" style="direction:ltr;text-align:center;font-size:1.5rem;letter-spacing:.06em"></div>
    <div class="err" id="rcE" role="alert"></div><div class="btns"><button class="btn" id="rcB">חזרה</button><button class="btn pri" id="rcG">התחברות</button></div>`,(el)=>{
    el.querySelector('#rcB').onclick=openConnect;
    el.querySelector('#rcG').onclick=async()=>{const b=el.querySelector('#rcG');b.disabled=true;b.textContent='בודק...';
      try{const j=await api('/recover',{code:el.querySelector('#rcI').value});linkOk(j.key)}catch(e){el.querySelector('#rcE').textContent=e.message;b.disabled=false;b.textContent='התחברות'}};
  });
}
function openQRStart(){
  sheet('Smart Life',`<p>ב-Smart Life: <b>אני ← הגדרות ← חשבון ואבטחה ← User Code</b>. העתק את הקוד והדבק כאן.</p>
    <div class="field"><label for="uc">User Code</label><input id="uc" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(LS('kor_uc')||'')}" style="direction:ltr"></div>
    <div class="err" id="qE" role="alert"></div><div class="btns"><button class="btn" id="qB">חזרה</button><button class="btn pri" id="qN">המשך</button></div>`,(el)=>{
    el.querySelector('#qB').onclick=openConnect;
    el.querySelector('#qN').onclick=async()=>{const uc=el.querySelector('#uc').value.trim();if(!uc)return;const b=el.querySelector('#qN');b.disabled=true;b.textContent='רגע...';
      try{const j=await api('/share/qr',{userCode:uc});LSset('kor_uc',uc);showQR(uc,j)}catch(e){el.querySelector('#qE').textContent=e.message;b.disabled=false;b.textContent='המשך'}};
  });
}
function showQR(uc,j){
  let stop=false;
  sheet('סריקה ב-Smart Life',`<div class="qrbox" id="qrb" role="img" aria-label="קוד QR להתחברות"></div>
    <ol><li>צלם מסך עכשיו (צד + הגברת עוצמה)</li><li>ב-Smart Life: <b>אני ← סמל הסריקה למעלה ← אלבום</b> ובחר את צילום המסך</li><li>אשר שם, ואני ממשיך לבד</li></ol>
    <div class="err" id="pE" role="alert"></div>`,(el,close)=>{
    try{const q=qrcode(0,'Q');q.addData(j.qr);q.make();el.querySelector('#qrb').innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){el.querySelector('#qrb').textContent=j.qr}
    el.querySelector('[data-x]').addEventListener('click',()=>stop=true);
  });
  const t0=Date.now();
  (async function poll(){while(!stop&&document.querySelector('#qrb')){await new Promise(r=>setTimeout(r,2500));if(stop||!document.querySelector('#qrb'))return;
    if(Date.now()-t0>170000){const p=document.querySelector('#pE');if(p)p.textContent='הקוד פג. חזור ונסה שוב.';return}
    try{const r=await api('/share/poll',{userCode:uc,token:j.token});if(r.linked){linkOk(r.key);return}}catch(e){}}})();
}

/* ---------- boot ---------- */
function applyPrefs(){document.documentElement.style.setProperty('--ts',(LS('unplug_ts')||'100')+'%');document.documentElement.style.setProperty('--g',(+(LS('unplug_glass')??55))/100)}
document.querySelectorAll('nav.bar button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();if(TAB==='sched')loadSched().then(render);window.document.querySelector('.app').scrollTo(0,0)});
$('refBtn').onclick=()=>{loadDevices();loadSched()};
$('homeBtn').onclick=openHomes;
$('menuBtn').onclick=()=>{
  const old=document.getElementById('dropMenu');if(old){old.remove();$('menuBtn').setAttribute('aria-expanded','false');return}
  const HD=DEVS.filter(inHome),on=HD.filter(d=>d.online&&isOn(d)).length,btn=$('menuBtn'),r=btn.getBoundingClientRect();
  const m=document.createElement('div');m.id='dropMenu';m.className='dropMenu';m.setAttribute('role','menu');m.setAttribute('aria-label','תפריט');
  m.style.top=(r.bottom+8)+'px';m.style.left=Math.max(12,r.left)+'px';
  const items=[['edit','עריכת המסך',()=>{TAB='devices';setReorder(true)}],['power',on?`לכבות הכול (${on})`:'לכבות הכול',()=>$('offBtn').onclick(),!on],['plus','הוספת מכשיר',openAdd],['list','חדרים - שמות ושיוך',()=>manageRooms()],['house','בתים',openHomes],['ref','רענון',()=>{loadDevices();loadSched()}]];
  m.innerHTML=items.map(([ic,t,,dis],i)=>`<button role="menuitem" data-mi="${i}" ${dis?'disabled':''}>${svg(ic)}<span>${t}</span></button>`).join('');
  document.body.append(m);btn.setAttribute('aria-expanded','true');
  const close=()=>{m.remove();btn.setAttribute('aria-expanded','false');removeEventListener('pointerdown',out,true);removeEventListener('keydown',key,true)};
  const out=e=>{if(!m.contains(e.target)&&e.target!==btn&&!btn.contains(e.target))close()};
  const key=e=>{const bs=[...m.querySelectorAll('button:not(:disabled)')],i=bs.indexOf(document.activeElement);
    if(e.key==='Escape'){close();btn.focus()}else if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus()}};
  addEventListener('pointerdown',out,true);addEventListener('keydown',key,true);
  m.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{close();items[+b.dataset.mi][2]()});
  m.querySelector('button:not(:disabled)').focus();
};
$('editBtn').onclick=()=>{if(TAB!=='devices'){TAB='devices'}typeof setReorder==='function'&&setReorder(!REORDER)};
$('addBtn').onclick=openAdd;
setTimeout(()=>{const sp=$('splash');if(!sp)return;sp.classList.add('out');setTimeout(()=>sp.remove(),450)},matchMedia('(prefers-reduced-motion: reduce)').matches?0:1500);
applyPrefs();try{render()}catch(e){console.error(e)}
function openFromHash(){const m=location.hash.match(/dev=([^&]+)/);if(!m)return;const id=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname);
  const go=()=>{const d=DEVS.find(x=>x.id===id);if(d){TAB='devices';render();openDevice(d)}};DEVS.length?go():setTimeout(go,2500)}
addEventListener('hashchange',openFromHash);setTimeout(openFromHash,600);
if(CFG.key){LSset('unplug_key',CFG.key);loadDevices();loadSched()}else openConnect();
setInterval(()=>{if(document.visibilityState==='visible'&&CFG.key&&!document.querySelector('.scrim [type=range]:active')&&!(typeof REORDER!=='undefined'&&REORDER))loadDevices()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CFG.key){loadDevices();loadSched()}});
</script>
