name: White kitchen icons - targeted replacement only
on:
  push:
    paths:
      - .github/workflows/white-kitchen-icons.yml
permissions:
  contents: write
jobs:
  white-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare image processing
        run: python3 -m pip install --user 'Pillow>=10,<13'
      - name: Replace only approved red/older kitchen images
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, subprocess, urllib.request
          from PIL import Image
          files={"toaster":{"url":"https://75a04222-6bd9-4922-ae21-228b021935c7.sandbox.floot.app/_cdn/static/d55e26e2-6947-44a6-bfac-9135dffea433-unplug-white-toaster-front-20261104.png","sha256":"79dfce5991fe7a95c8fb093d1f53fe8d96d356e8c78c278955baaee8f401c568","targets":["real/toaster.png","real/custom/pop_up_toaster.png"]},"sandwich":{"url":"https://75a04222-6bd9-4922-ae21-228b021935c7.sandbox.floot.app/_cdn/static/a7cd38df-8509-417b-87f3-1b0f1ec83c45-unplug-white-sandwich-press-20261104.png","sha256":"3fb56134f6c3bf209626e3910cd04a4dd9b35d9344ee3f609909b00e10786f4b","targets":["real/custom/white_sandwich_press.png"]},"mixer":{"url":"https://75a04222-6bd9-4922-ae21-228b021935c7.sandbox.floot.app/_cdn/static/093587bc-5580-439c-93e5-c6e1240cbdd4-unplug-white-stand-mixer-20261104.png","sha256":"004ec9181f98efaced60a42e9ba5c4cfb2abd7be519f48fb55688d9cc832ef3e","targets":["real/custom/white_stand_mixer.png"]},"blender":{"url":"https://75a04222-6bd9-4922-ae21-228b021935c7.sandbox.floot.app/_cdn/static/6c6882ba-7df2-498a-80e6-c5bc4a69dfcd-unplug-white-blender-20261104.png","sha256":"0147286fcc19142103bb664e7559c047ffc9d2fc7c7c96651c940b25a65bedf9","targets":["real/custom/white_blender.png"]}}
          expected={"real/toaster.png":"5f101a40d5f8999e3c0b96ad3f6e38eae7e23646","real/custom/pop_up_toaster.png":"e154fac18864c60fb62b222d07096f0c71780e89","real/custom/white_sandwich_press.png":"f65f6072d4c54ddaaa95dc2326c5148ce6e35570","real/custom/white_stand_mixer.png":"b4eb29b66061014034cf49f2fd8fe7f71bdb2ed8","real/custom/white_blender.png":"d63640856c9719b4ffdd80f398ccbb0f72595439"}
          assert {t for s in files.values() for t in s['targets']} == set(expected)
          changed=[]
          for name,spec in files.items():
              data=urllib.request.urlopen(urllib.request.Request(spec['url'],headers={'User-Agent':'Unplug-white-icons-sync/1.0'}), timeout=90).read()
              assert hashlib.sha256(data).hexdigest()==spec['sha256'],f'Source integrity failed: {name}'
              with Image.open(io.BytesIO(data)) as img:
                  img=img.convert('RGBA')
                  assert img.size==(1254,1254), f'Unexpected source size: {name}'
                  img=img.resize((512,512),Image.Resampling.LANCZOS)
                  output=io.BytesIO()
                  img.save(output,format='PNG',optimize=True)
                  newbytes=output.getvalue()
              assert newbytes.startswith(bytes([137,80,78,71,13,10,26,10]))
              for target in spec['targets']:
                  path=pathlib.Path(target)
                  assert path.is_file(),f'Cannot replace missing file {target}'
                  current=subprocess.check_output(['git','hash-object',target],text=True).strip()
                  assert current==expected[target],f'Target changed since review {target}: {current}'
                  path.write_bytes(newbytes)
                  changed.append(target)
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==set(expected), f'Unexpected changes: {actual}'
          print('Replaced exactly 5 approved image paths with 4 white product images:', ', '.join(changed))
          PY
      - name: Commit five image file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real/toaster.png real/custom/pop_up_toaster.png real/custom/white_sandwich_press.png real/custom/white_stand_mixer.png real/custom/white_blender.png
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Replace red kitchen icons with approved white product images"
          git push origin HEAD:main
