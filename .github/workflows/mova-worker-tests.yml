name: MOVA gateway checks
on:
  push:
    paths:
      - 'mova-worker/**'
      - '.github/workflows/mova-worker-tests.yml'
  pull_request:
    paths:
      - 'mova-worker/**'
      - '.github/workflows/mova-worker-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mova-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run gateway and discovery diagnostics tests
        run: python -m pytest -q
      - name: Build worker container
        run: docker build -t homeon-mova-worker:test .
