name: Import 79 Unplug device photos
on:
  push:
    paths:
      - .github/workflows/import-device-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing Unplug repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified ZIP and synchronize all icons
        env:
          SOURCE_URL: https://75a04222-6bd9-4922-ae21-228b021935c7.sandbox.floot.app/_cdn/static/c9e12a56-77e2-42ab-8de8-bf8f1434d797-unplug-icon-bundle-79.zip
          SOURCE_SHA256: 8f8ab3a3acea2ca1191f8c4b9ef187f037e3a5a7d088bbbe0bf624830b18919b
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, re, urllib.request, zipfile
          url=os.environ["SOURCE_URL"]
          blob=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Unplug-Device-Icon-Importer/1.0"}), timeout=90).read()
          digest=hashlib.sha256(blob).hexdigest()
          expected=os.environ["SOURCE_SHA256"]
          assert digest==expected, f"Archive SHA-256 mismatch: {digest}"
          keys=["washer","fridge","coffee","kettle","toaster","ac","led","ceiling","bulb","lamp","ceilfan","heater","boiler","dish","plug","phone","charger","router","speaker","game","laptop","tv","remote","plant","sensor","camera","curtain","switch","strip","vacuum","blinds","dryer","stickvac","fanheater","water","lock","doorsensor","purifier","humidifier","dehumid","projector","streamer","receiver","doorbell","smoke","leak","thermo_h","gate","irrigation","adapter","portac","hood","cooktop","toasteroven","airfryer","urn","blanket","soundbar","towerfan","screen","garage","hub","blindsw","dimmer","thermostat","presence","gas","intercom","valve","siren","gardenlight","mop","walllight","petfeeder","toothbrush","sandwich","mixer","blender","hotplate"]
          assert len(keys)==79 and len(set(keys))==79
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              names=z.namelist()
              assert len(names)==79, f"Archive has {len(names)} files, expected 79"
              files={}
              for name in names:
                  m=re.match(r"^(\d{2}) - .+\.png$",name)
                  assert m, f"Unexpected archive name: {name!r}"
                  i=int(m.group(1))
                  assert 1<=i<=79 and i not in files, f"Invalid numbering {i}"
                  files[i]=name
              assert len(files)==79
              folder=pathlib.Path("real")
              folder.mkdir(exist_ok=True)
              for i,key in enumerate(keys,1):
                  data=z.read(files[i])
                  assert data[:8]==b"\x89PNG\r\n\x1a\n",f"Invalid PNG #{i}"
                  (folder/f"{key}.png").write_bytes(data)
          html_path=pathlib.Path("index.html")
          html=html_path.read_text("utf-8")
          old_line="const realImg=k=>`<img class=\"real\" src=\"real/${REAL.has(k)?k:'plug'}.${k==='hotplate'?'webp':'png'}?v=2\" alt=\"\" decoding=\"sync\">`;"
          new_line="const realImg=k=>`<img class=\"real\" src=\"real/${REAL.has(k)?k:'plug'}.png?v=79-20261104\" alt=\"\" decoding=\"sync\">`;"
          assert old_line in html, "Unexpected realImg implementation; refusing unsafe rewrite"
          html=html.replace(old_line,new_line,1)
          old_types='"hotplate": "פלטת שבת BOSS"}'
          new_types='"hotplate": "פלטת שבת BOSS", "blinds": "תריס גלילה חשמלי", "toothbrush": "מברשת שיניים Oral-B iO2", "sandwich": "טוסטר לחיצה", "mixer": "מיקסר", "blender": "בלנדר"}'
          assert old_types in html, "Device type anchor missing"
          html=html.replace(old_types,new_types,1)
          start="const NAMEKEY=["
          prefix="const NAMEKEY=[[/מברשת שיניים|oral.?b|toothbrush/i,'toothbrush'],[/טוסטר לחיצה|טוסטר סנדוויץ|sandwich press|panini/i,'sandwich'],[/מצנם|pop ?up toaster/i,'toaster'],[/מיקסר|stand mixer/i,'mixer'],[/בלנדר|blender/i,'blender'],[/תריס גלילה|roller shutter/i,'blinds'],"
          assert html.count(start)==1, "NAMEKEY anchor missing/ambiguous"
          html=html.replace(start,prefix,1)
          html=html.replace('"curtain": "תריס חשמלי"','"curtain": "וילונות חשמליים"',1)
          html_path.write_text(html,"utf-8")
          assert (pathlib.Path("real")/"hotplate.png").exists()
          print("IMPORTED 79 exact original PNG files, 512x512 from verified ZIP; updated icon mappings.")
          PY
      - name: Commit updated images and device picker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html real/
          if git diff --cached --quiet; then
            echo "No icon changes."
          else
            git commit -m "Sync all 79 approved device icons into Unplug"
            git push origin HEAD:main
          fi
