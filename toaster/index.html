<style>
:root{
  --bg:#0b0f14; --surface:#121821; --surface-2:#18202b; --line:#232d3a;
  --fg:#e9eef5; --muted:#8392a6; --accent:#ff9a52; --accent-soft:rgba(255,154,82,.15);
  --off:#3a4554; --warn:#ffb454; --ok:#5fd39a; --danger:#ff6b6b;
  --f-body:"Heebo",system-ui,sans-serif; --f-num:"Sora","Heebo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:0.9375rem;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
input{user-select:text;-webkit-user-select:text}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.25rem;font-weight:700;margin:0}
.sub{font-size:0.8125rem;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--ok)} .pill.bad .dot{background:var(--danger)}

.hero{position:relative;display:grid;place-items:center;padding-block:4px}
.glow{position:absolute;inset:8% 14%;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 68%);transition:opacity .5s;pointer-events:none}
.ring{width:min(100%,300px);aspect-ratio:1;max-width:100%;position:relative}
.ring>svg{width:100%;height:100%;display:block}
.track{stroke:var(--line);stroke-width:14;fill:none}
.val{stroke:var(--accent);stroke-width:14;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .4s}
.tick{stroke:var(--muted);stroke-width:2;opacity:.35}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:4px}
.icon{width:52px;height:44px;margin-bottom:6px}
.icon *{fill:none;stroke:var(--off);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.app.is-on .icon *{stroke:var(--accent)}
.app.is-on .icon .heat{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.time{font-family:var(--f-num);font-weight:200;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.state{font-size:0.875rem;color:var(--accent);font-weight:500;transition:color .4s}
.hint{font-size:0.75rem;color:var(--muted)}
.app:not(.is-on) .time,.app:not(.is-on) .state{color:var(--off)}
.app:not(.is-on) .val{stroke:var(--off)}
.app:not(.is-on) .glow{opacity:0}

.prow{display:flex;gap:8px}
.power{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);font-size:1.0625rem;font-weight:700;transition:background .4s,transform .12s}
.power:active,.ext:active{transform:scale(.98)}
.power:disabled{opacity:.6}
.app.is-on .power{background:var(--accent);color:#1a0d04;border-color:transparent}
.power svg{width:22px;height:22px}
.ext{flex:0 0 96px;border-radius:20px;background:var(--surface-2);border:1px solid var(--accent);color:var(--accent);font-family:var(--f-num);font-weight:600;font-size:1rem;direction:ltr;transition:transform .12s}

.sec h2{display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;font-weight:500;color:var(--muted);letter-spacing:.6px;margin:0 0 8px}
.link{font-size:0.7812rem;color:var(--accent);letter-spacing:0;padding:2px 4px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:13px;color:var(--muted);transition:background .25s,color .25s}
.seg b{font-family:var(--f-num);font-weight:300;font-size:1.25rem;font-variant-numeric:tabular-nums}
.seg span{font-size:0.7812rem}
.seg svg{width:22px;height:22px;margin-block:2px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.profiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);text-align:start;min-width:0;transition:transform .12s,border-color .25s}
.prof:active{transform:scale(.97)}
.prof svg{width:26px;height:26px;color:var(--accent);flex:none}
.prof div{min-width:0}
.prof b{display:block;font-size:0.875rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof span{font-size:0.7812rem;color:var(--muted)}
.prof[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:start;min-width:0;transition:border-color .25s,background .25s}
.tog .t{font-size:0.8438rem;font-weight:500}
.tog .s{font-size:0.7812rem;color:var(--muted)}
.tog svg{width:20px;height:20px;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tog[aria-pressed="true"] svg,.tog[aria-pressed="true"] .s{color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-weight:300;font-size:26px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat b.word{font-family:var(--f-body);font-size:1.0625rem;font-weight:500;line-height:31px}
.stat span{font-size:0.7812rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;margin-top:10px;padding:10px 12px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;height:96px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:18px;border-radius:5px 5px 2px 2px;background:var(--accent);opacity:.85;min-height:3px}
.bar i.zero{background:var(--line);opacity:1}
.bar small{font-size:0.7812rem;color:var(--muted);padding-bottom:6px}
.bar.today small{color:var(--accent);font-weight:700}
.bar.future{opacity:.4}

.note{font-size:0.75rem;color:var(--muted);line-height:1.5;margin:0;padding:12px 14px;border:1px dashed var(--line);border-radius:14px}
.foot{display:flex;justify-content:center;gap:16px}
.foot button{font-size:0.7812rem;color:var(--muted);padding:6px}

.scrim{position:fixed;inset:0;background:rgba(3,6,10,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:460px;max-height:88%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:1.125rem}
.sheet p,.sheet ol{margin:0;color:var(--muted);font-size:0.8438rem;line-height:1.6}
.sheet ol{padding-inline-start:20px}
.sheet ol b{color:var(--fg);font-weight:500}
.big{font-family:var(--f-num);font-size:44px;font-weight:300;text-align:center;direction:ltr}
.big small{font-size:1rem;color:var(--muted);font-family:var(--f-body)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.row{display:flex;gap:8px}

let S={min:3,prof:-1,profiles:DEF_PROFILES,notify:true,siri:0,log:[]};
try{Object.assign(S,JSON.parse(LS('toaster_state')||'{}'))}catch(e){}
const save=()=>LSset('toaster_state',JSON.stringify(S));
if((S.pv||1)<2){const have=new Set(S.profiles.map(p=>p.ic+'|'+p.n));const out=[];
  DEF_PROFILES.forEach(d=>{const ex=S.profiles.find(p=>p.n===d.n);out.push(ex||d)});
  S.profiles.forEach(p=>{if(!out.includes(p))out.push(p)});
  const cur=S.prof>=0?S.profiles[S.prof]:null;S.profiles=out.slice(0,12);S.prof=cur?S.profiles.indexOf(cur):-1;S.pv=3;save()}
if((S.pv||1)<3||!S.pita3){S.profiles.forEach(p=>{if(p.ic==='pita'&&(p.n==='הפשרת פיתה'||p.n==='פיתה קפואה')&&p.m<=1.5){p.n='פיתה קפואה';p.m=4;p.r=2}});S.pv=3;S.pita3=1;save()}

const R={on:false,endAt:0,total:S.min*60,busy:false};
const NATIVE=()=>window.IN_HOMEON&&window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.homeon;
const nativeCancel=()=>{if(NATIVE())NATIVE().postMessage({action:'notify',cmd:'cancel',id:'toast'}).catch(()=>{})};

let linked=!!CFG.key, DEV=null, CAP=null, online=true;

/* ---------- api ---------- */
async function api(path,body){
  /* inside HomeOn on the iPhone: on the home WiFi, talk to the device directly */
  if(path==='/command'){try{const L=window.parent!==window&&window.parent.HOLOCAL;if(L&&await L.send(body.id,body.commands))return {ok:true,sent:true,local:true}}catch(e){}}
  const r=await fetch(API+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},CFG.key?{'X-Kor-Key':CFG.key}:{}),body:JSON.stringify(body||{})});
  let j;try{j=await r.json()}catch(e){throw new Error('השרת לא ענה ('+r.status+')')}
  if(r.status===401){logout(true);throw new Error(j.error||'החיבור פג')}
  if(!j.ok)throw new Error(j.error||'שגיאה');
  return j;
}
const netMsg=e=>/fetch|load failed|network/i.test(e.message)?'אין חיבור לשרת. בדוק אינטרנט':e.message;

/* ---------- plug capabilities ---------- */
function caps(dev){
  const F={};(dev.functions||[]).forEach(f=>F[f.code]=f);
  const has=c=>c in F||c in (dev.status||{});
  const power=['switch_1','switch','switch_on','power'].find(has);
  const cd=['countdown_1','countdown','countdown_set'].find(c=>c in F);
  let cdMax=86400;try{cdMax=+(F[cd]?.values?.max)||86400}catch(e){}
  return {power,cd,cdMax};
}
function readStatus(st){
  if(!CAP)return;
  const on=!!st[CAP.power];
  const left=CAP.cd?+st[CAP.cd]||0:0;
  const was=R.on;
  if(on){
    /* the cloud often still shows the countdown as it was set (a stale, larger number), so it may only bring the end closer, never push it back */
    if(CAP.cd&&left>0){let end=Date.now()+left*1000;const saved=+(LS('toaster_end')||0);if(!was&&saved>Date.now())end=Math.min(end,saved);
      if(!was||end<R.endAt-3000)R.endAt=end;if(!was)R.total=Math.max(left,R.total||0)}
    else if(!was){R.endAt=0}
  }
  R.on=on;
  if(was&&!on&&R.endAt&&R.endAt-Date.now()<6000)finished(true);
  render();
}

/* ---------- connect ---------- */
function setConn(){
  const p=$('conn');p.classList.toggle('ok',linked&&!!DEV&&online);p.classList.toggle('bad',linked&&(!online||!DEV));
  $('connTxt').textContent=!linked?'מצב הדגמה':!DEV?'בחר תקע':online?'מחובר':'התקע לא מחובר';
  
  $('fDev').hidden=$('fOut').hidden=!linked;
}
async function loadDevices(pick){
  try{
    const j=await api('/devices');
    const plugs=j.devices.filter(d=>{const c=caps(d);return c.power&&!['kt','ktkzq','kts'].includes(d.category)});
    let d=plugs.find(x=>x.id===CFG.dev);
    if(!d&&!pick){d=plugs.find(x=>/טוסטר|toast/i.test(x.name))||(plugs.length===1?plugs[0]:null)}
    if(!d||pick)return pickDevice(plugs.length?plugs:j.devices);
    useDevice(d);
  }catch(e){toast(netMsg(e));setConn()}
}
function useDevice(d){
  DEV=d;CAP=caps(d);CFG.dev=d.id;LSset('toaster_dev',d.id);online=d.online!==false;
  $('note').textContent=CAP.cd?'התקע מספק חשמל בלבד. אחרי ההדלקה צריך ללחוץ את הידית של הטוסטר. הספירה רצה בתוך התקע עצמו, אז הוא ייכבה בזמן גם אם תסגור את האפליקציה.'
    :'התקע הזה לא תומך בספירה לאחור משלו, ולכן הכיבוי האוטומטי עובד רק כשהאפליקציה פתוחה.';
  readStatus(d.status||{});setConn();startPoll();
}
function pickDevice(list){
  sheet(`<h3>איזה תקע מחובר לטוסטר?</h3><div class="opts">${list.map(d=>`<button class="opt" data-id="${esc(d.id)}"><span>${esc(d.name||d.id)}</span><span>${d.online===false?'לא מחובר':''}</span></button>`).join('')||'<p>לא נמצאו מכשירים בחשבון.</p>'}</div>`,(el,close)=>{
    el.querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;close();useDevice(list.find(x=>x.id===b.dataset.id))};
  });
}
let pollT=null;
function startPoll(){clearInterval(pollT);pollT=setInterval(refresh,5000)}
let inFlight=false;
async function refresh(){
  if(!DEV||document.hidden||R.busy||inFlight)return;
  inFlight=true;
  try{const j=await api('/device',{id:DEV.id});if(j.device){online=j.device.online!==false;readStatus(j.device.status||{})}setConn()}catch(e){}
  finally{inFlight=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

function linkOk(key){CFG.key=key;LSset('toaster_key',key);linked=true;setConn();loadDevices()}
function logout(silent){CFG.key='';LSset('toaster_key',null);LSset('toaster_dev',null);linked=false;DEV=null;CAP=null;clearInterval(pollT);R.on=false;setConn();render();if(!silent)toast('התנתקת')}

function openConnect(){
  sheet(`<h3>חיבור לטוסטר</h3>
    <ol><li>ב-Smart Life: <b>אני ← הגדרות ← חשבון ואבטחה ← User Code</b></li><li>העתק את הקוד והדבק כאן</li></ol>
    <div class="field"><label for="uc">User Code</label><input id="uc" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(LS('kor_uc')||'')}"></div>

}
function showQR(uc,j){
  let stop=false;
  const close=sheet(`<h3>סרוק עם Smart Life</h3>
    <div class="qrbox" id="qrb"></div>
    <ol><li>צלם מסך עכשיו</li><li>ב-Smart Life: <b>אני ← סמל הסריקה למעלה ← אלבום</b>, ובחר את צילום המסך</li><li>אשר, וחזור לכאן</li></ol>
    <div class="err-msg" id="perr"></div>
    <button class="btn" id="qx">ביטול</button>`,(el,cl)=>{
    try{const q=qrcode(0,'Q');q.addData(j.qr);q.make();el.querySelector('#qrb').innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true})}
    catch(e){el.querySelector('#qrb').textContent=j.qr}
    el.querySelector('#qx').onclick=()=>{stop=true;cl()};
  });
  const t0=Date.now();
  (async function poll(){
    while(!stop&&document.querySelector('#qrb')){
      await new Promise(r=>setTimeout(r,2500));
      if(stop||!document.querySelector('#qrb'))return;
      if(Date.now()-t0>170000){const p=document.querySelector('#perr');if(p)p.textContent='הקוד פג. סגור ונסה שוב.';return}
      try{const r=await api('/share/poll',{userCode:uc,token:j.token});
        if(r.linked){close();linkOk(r.key);toast('מחובר');return}}catch(e){}
    }
  })();
}

/* ---------- commands ---------- */
function onCmds(sec){const c=[{code:CAP.power,value:true}];if(CAP.cd)c.push({code:CAP.cd,value:Math.min(CAP.cdMax,Math.round(sec))});return c}
async function send(cmds){
  R.busy=true;
  try{await api('/command',{id:DEV.id,commands:cmds});return true}
  catch(e){toast(netMsg(e));return false}
  finally{R.busy=false}
}
const live=()=>linked&&DEV&&CAP;

async function turnOn(name,rounds){if(R.busy)return;
  R.justDone=false;R.rounds=rounds||1;R.midDone=false;
  const sec=S.min*60;
  /* the toaster shows "on" the moment you tap; if the plug doesn't confirm, it goes back */
  R.on=true;R.total=sec;R.endAt=Date.now()+sec*1000;render();
  if(live()&&!(await send(onCmds(sec)))){R.on=false;R.endAt=0;render();return}
  S.log.push({t:Date.now(),n:name||fmtMin(S.min)+' דק׳'});if(S.log.length>2000)S.log=S.log.slice(-2000);
  save();render();toast(R.rounds>1?'התקע הודלק - לחץ את הידית. באמצע אזכיר ללחוץ שוב':'התקע הודלק - לחץ את הידית');
  armPush(name);
}
async function turnOff(msg){if(R.busy)return;
  const was={endAt:R.endAt};R.on=false;R.endAt=0;render();
  if(live()&&!(await send([{code:CAP.power,value:false}]))){R.on=true;R.endAt=was.endAt;render();return}
  if(msg)toast(msg);nativeCancel();
  if(live()&&S.push)api('/push/cancel').catch(()=>{});
}
async function extend(){
  if(!R.on)return;const left=Math.max(0,(R.endAt-Date.now())/1000)+30;
  if(live()&&CAP.cd&&!(await send([{code:CAP.cd,value:Math.min(CAP.cdMax,Math.round(left))}])))return;
  R.endAt=Date.now()+left*1000;R.total+=30;render();toast('נוספו 30 שניות');
  armPush(lastName);
}
function finished(fromPlug){
  if(!R.on&&fromPlug==='dup')return;
  R.justDone=true;clearTimeout(R.jd);R.jd=setTimeout(()=>{R.justDone=false;render()},60000);
  const br=$('breads');br.classList.remove('pop');void br.getBBox();br.classList.add('pop');setTimeout(()=>br.classList.remove('pop'),1000);
  R.on=false;R.endAt=0;render();buzz([120,80,120]);beep();clearBadge();nativeCancel();
  if(S.notify)showDone();else toast('הזמן נגמר - החשמל נותק');
}


/* ---------- alerts: in-app beep + phone notification ---------- */
let lastName='';
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
let swReg=null;
if('serviceWorker' in navigator&&!window.IN_HOMEON){navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='toast-ready'&&R.on){finished(true)}})}
const clearBadge=()=>{try{navigator.clearAppBadge&&navigator.clearAppBadge()}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)clearBadge()});clearBadge();
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{once:true});
const SOUNDS={ding:'דינג',bell:'טיימר מטבח',marimba:'מרימבה',chime:'פעמון',micro:'מיקרוגל'};
function tone(f,at,dur,vol,type){const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.008);g.gain.exponentialRampToValueAtTime(.0008,at+dur);
  o.connect(g).connect(actx.destination);o.start(at);o.stop(at+dur+.05)}
function pop(at){const n=actx.sampleRate*.06,b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
  const src=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();f.type='bandpass';f.frequency.value=1800;g.gain.value=.9;
  src.buffer=b;src.connect(f).connect(g).connect(actx.destination);src.start(at)}
function beep(kind){
  unlockAudio();if(!actx)return;
  const t=actx.currentTime+.03,k=SOUNDS[kind||S.sound]?(kind||S.sound):'ding';
  try{
    const strike=(f,at,v,parts)=>parts.forEach(([r,a,d])=>tone(f*r,at,d,v*a));
    if(k==='marimba'){const M=[[1,1,.9],[4,.35,.12],[9.9,.12,.04]];
      [659,784,1047].forEach((f,i)=>strike(f,t+i*.16,.5,M));[523,659].forEach((f,i)=>strike(f,t+.75+i*.16,.35,M));strike(784,t+1.07,.45,M)}
    else if(k==='bell'){let at=t;for(let i=0;i<22;i++){strike(2350,at,.5*(1-i/26),[[1,1,.5],[2.76,.45,.25],[5.4,.2,.12],[8.9,.08,.06]]);at+=.055+i*.0035}}
    else if(k==='ding'){pop(t);[[1568,.5],[3136,.16],[4704,.07]].forEach(([f,v])=>tone(f,t+.09,1.6,v));
      [[1568,.35],[3136,.1]].forEach(([f,v])=>tone(f,t+1.1,1.4,v))}
    else if(k==='chime'){for(let r=0;r<2;r++)[1047,1319,1568,2093].forEach((f,i)=>tone(f,t+r*1.1+i*.16,1.1,.28,'triangle'))}
    else{[0,.28,.56].forEach((d,i)=>tone(i===2?1320:988,t+d,.24,.35))}
  }catch(e){}
}
function armPush(name){
  lastName=name||lastName||'';
  if(NATIVE()){if(S.notify&&R.endAt)NATIVE().postMessage({action:'notify',cmd:'at',id:'toast',at:R.endAt,title:'הטוסט מוכן',body:(lastName?lastName+' - ':'')+'החשמל נותק, אפשר להוציא'}).catch(()=>{});return}
  if(!live()||!S.notify||!S.push||!R.endAt)return;
  api('/push/at',{at:R.endAt/1000,title:'הטוסט מוכן',body:(lastName?lastName+' - ':'')+'החשמל נותק, אפשר להוציא'}).catch(()=>{});
}
const u8=b=>{const p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function subscribePush(){
  if(!live())throw new Error('קודם צריך לחבר את הטוסטר');
  if(!pushOK())throw new Error('הדפדפן הזה לא תומך בהתראות');
  const perm=await Notification.requestPermission();
  if(perm!=='granted')throw new Error('לא אישרת התראות. אפשר לשנות בהגדרות ← התראות ← טוסטר');
  const reg=swReg||await navigator.serviceWorker.ready;
  const {key}=await api('/push/key');
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)});
  await api('/push/subscribe',{sub:sub.toJSON()});
  S.push=true;save();render();
}
function soundPicker(){return `<p>צליל בסיום:</p><div class="opts" id="nSnd">${Object.entries(SOUNDS).map(([k,n])=>`<button class="opt" data-k="${k}" aria-pressed="${(SOUNDS[S.sound]?S.sound:'ding')===k}"><span>${n}</span><span>▶ השמע</span></button>`).join('')}</div>`}

  if(phone){
    body=`<p>כשהזמן נגמר תקבל התראה עם צליל, רטט ומספר על האייקון, גם כשהאפליקציה סגורה. כשהיא פתוחה יש גם צפצוף.</p>
      <div class="row"><button class="btn" id="nTest">שלח בדיקה</button><button class="btn" id="nOff">${S.notify?'השתק':'הפעל'}</button></div>
      <button class="btn pri" id="nClose">סגור</button>`;
  }else if(ios&&!standalone()){
    body=`<p>באייפון התראות עובדות רק כשהאפליקציה על מסך הבית:</p>
      <ol><li>לחץ על <b>שיתוף</b> בתחתית Safari</li><li>בחר <b>הוסף למסך הבית</b></li><li>פתח את "טוסטר" מהאייקון, וחזור לכאן</li></ol>
      <p>בינתיים, כשהאפליקציה פתוחה, יש צפצוף וחלון "הטוסט מוכן".</p>
      <div class="row"><button class="btn" id="nOff">${S.notify?'השתק צפצוף':'הפעל צפצוף'}</button><button class="btn pri" id="nClose">הבנתי</button></div>`;
  }else{
    body=`<p>אשר התראות, וכשהטוסט מוכן תקבל התראה עם צליל, רטט ומספר על האייקון, גם כשהאפליקציה סגורה.</p>
      <div class="err-msg" id="nErr"></div>
      <button class="btn pri" id="nOn">הפעל התראות</button>

  sheet(`<h3>התראה בסוף</h3>${body}`,(el,close)=>{

    el.querySelector('#nOff')&&(el.querySelector('#nOff').onclick=()=>{S.notify=!S.notify;save();render();close();toast(S.notify?'ההתראות פעילות':'ההתראות הושתקו')});
    el.querySelector('#nTest')&&(el.querySelector('#nTest').onclick=async()=>{try{await api('/push/test');toast('נשלחה התראת בדיקה')}catch(e){toast(netMsg(e))}});
    el.querySelector('#nOn')&&(el.querySelector('#nOn').onclick=async()=>{const b=el.querySelector('#nOn');b.disabled=true;b.textContent='רגע...';
      try{await subscribePush();S.notify=true;save();render();close();toast('ההתראות פעילות');beep()}
      catch(e){el.querySelector('#nErr').textContent=/נתיב לא מוכר|הותקנו/.test(e.message)?'ההתראות לטלפון יעבדו אחרי עדכון השרת. בינתיים יש צפצוף כשהאפליקציה פתוחה, וצלצול דרך קיצור Siri.':netMsg(e);b.disabled=false;b.textContent='הפעל התראות'}});

/* ---------- ui ---------- */
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtMin=m=>m%1?(Math.floor(m)+':30'):String(m);

$('power').onclick=()=>{buzz();unlockAudio();R.on?turnOff('הטוסטר כובה'):(lastName='',turnOn())};
$('ext').onclick=()=>{buzz();extend()};
$('times').onclick=e=>{const b=e.target.closest('button');if(!b)return;buzz();
  if(b.dataset.m==='custom')return openCustom();
  S.min=+b.dataset.m;S.prof=-1;save();render()};
$('profiles').onclick=e=>{const b=e.target.closest('.prof');if(!b)return;buzz();
  const p=S.profiles[b.dataset.p];S.min=p.m;S.prof=+b.dataset.p;save();
  if(R.on)turnOff().then(()=>turnOn(p.n,p.r));else turnOn(p.n,p.r)};
$('tNotify').onclick=()=>{buzz();unlockAudio();openNotify()};
$('tSiri').onclick=()=>{buzz();openSiri()};
$('editProfiles').onclick=()=>{buzz();openEdit()};
$('conn').onclick=()=>{buzz();linked?(DEV?refresh().then(()=>toast(online?'מחובר':'התקע לא מחובר')):loadDevices(true)):openConnect()};
$('fDev').onclick=()=>loadDevices(true);
$('fOut').onclick=()=>{sheet(`<h3>להתנתק?</h3><p>הטוסטר עצמו לא ישתנה. תצטרך לסרוק QR שוב כדי להתחבר.</p><div class="row"><button class="btn" id="nx">ביטול</button><button class="btn pri" id="ny">התנתק</button></div>`,(el,close)=>{
  el.querySelector('#nx').onclick=close;el.querySelector('#ny').onclick=()=>{close();logout()}})};

function sheet(html,init){
  const sc=document.createElement('div');sc.className='scrim';sc.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;
  document.body.appendChild(sc);const close=()=>sc.remove();sc.onclick=e=>{if(e.target===sc)close()};
  init&&init(sc,close);return close;
}
function openCustom(){
  sheet(`<h3>כיבוי אחרי</h3><div class="big"><span id="sv"></span> <small>דקות</small></div>
    <input type="range" id="sr" min="1" max="15" step="1" value="${Math.round(S.min)}" aria-label="דקות">
    <div class="row"><button class="btn" id="sc">ביטול</button><button class="btn pri" id="ss">שמור</button></div>`,(sc,close)=>{
    const sr=sc.querySelector('#sr'),sv=sc.querySelector('#sv');sv.textContent=sr.value;
    sr.oninput=()=>{sv.textContent=sr.value;buzz()};
    sc.querySelector('#sc').onclick=close;
    sc.querySelector('#ss').onclick=()=>{S.min=+sr.value;S.prof=-1;save();render();close()};
  });
}
function openEdit(){
  let draft=S.profiles.map(p=>({...p}));
  sheet(`<h3>עריכת פרופילים</h3><div id="elist" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="add" id="eadd">+ פרופיל חדש</button>
    <div class="row"><button class="btn" id="ec">ביטול</button><button class="btn pri" id="es">שמור</button></div>`,(sc,close)=>{
    const list=sc.querySelector('#elist');
    const draw=()=>{list.innerHTML=draft.map((p,i)=>`<div class="erow" data-i="${i}">
        <input id="pn${i}" value="${esc(p.n)}" maxlength="18" aria-label="שם הפרופיל">
        <div class="stp"><button data-a="-" aria-label="פחות">−</button><span>${fmtMin(p.m)}′</span><button data-a="+" aria-label="יותר">+</button></div>
        <button class="del" data-a="x" aria-label="מחק">${svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>')}</button></div>`).join('');
      sc.querySelector('#eadd').hidden=draft.length>=12};
    const sync=()=>draft.forEach((p,i)=>{const el=list.querySelector('#pn'+i);if(el)p.n=el.value.trim()||p.n});
    list.onclick=e=>{const b=e.target.closest('button');if(!b)return;sync();const i=+b.closest('.erow').dataset.i;buzz();
      if(b.dataset.a==='+')draft[i].m=Math.min(15,draft[i].m+.5);
      if(b.dataset.a==='-')draft[i].m=Math.max(.5,draft[i].m-.5);
      if(b.dataset.a==='x')draft.splice(i,1);draw()};
    sc.querySelector('#eadd').onclick=()=>{sync();draft.push({n:'פרופיל חדש',m:3,ic:'star'});draw();list.querySelector('#pn'+(draft.length-1))?.select()};
    sc.querySelector('#ec').onclick=close;
    sc.querySelector('#es').onclick=()=>{sync();S.profiles=draft;if(S.prof>=draft.length)S.prof=-1;if(S.siri>=draft.length)S.siri=0;save();render();close();toast('הפרופילים נשמרו')};
    draw();
  });
}
const b64url=o=>btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function openSiri(){
  if(!live())return sheet(`<h3>קיצור דרך ב-Siri</h3><p>קודם צריך לחבר את הטוסטר. אחרי החיבור תקבל כאן קישור להוספה לקיצורים.</p><button class="btn pri" id="sc">חבר עכשיו</button>`,(el,close)=>{el.querySelector('#sc').onclick=()=>{close();openConnect()}});
  const close0=sheet('<h3>קיצור דרך ב-Siri</h3><p>מכין קישור...</p>');
  let tok;try{tok=(await api('/token',{})).token}catch(e){close0();return toast(netMsg(e))}
  close0();
  const urlFor=p=>API+'/act?k='+encodeURIComponent(tok)+'&d='+encodeURIComponent(DEV.id)+'&c='+b64url(onCmds(p.m*60))+'&s='+encodeURIComponent('הטוסטר דולק ל-'+fmtMin(p.m)+' דקות');
  sheet(`<h3>קיצור דרך ב-Siri</h3>
    <div class="phrase">"היי סירי, טוסט"</div>
    <p>בחר איזה פרופיל הפקודה תפעיל:</p>
    <div class="opts" id="sopts">${S.profiles.map((p,i)=>`<button class="opt" data-i="${i}" aria-pressed="${i===S.siri}"><span>${esc(p.n)}</span><span>${fmtMin(p.m)} דק׳</span></button>`).join('')}</div>
    <ol><li>העתק את הקישור</li><li>באפליקציית <b>קיצורים</b>: <b>+ ← הוסף פעולה ← קבל תוכן של URL</b>, והדבק</li><li>הוסף פעולה <b>התחל טיימר</b> ל-<b id="smin"></b> דקות. השעון יצלצל כשהטוסט מוכן, גם כשהטלפון נעול</li><li>קרא לקיצור <b>טוסט</b></li></ol>
    <div class="url" id="surl"></div>
    <div class="row"><button class="btn" id="sx">סגור</button><button class="btn pri" id="scp">העתק קישור</button></div>`,(sc,close)=>{
    const upd=()=>{const p=S.profiles[S.siri]||S.profiles[0];sc.querySelector('#surl').textContent=urlFor(p);sc.querySelector('#smin').textContent=fmtMin(p.m)};upd();
    sc.querySelector('#sopts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;buzz();S.siri=+b.dataset.i;save();render();
      sc.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));upd()};
    sc.querySelector('#sx').onclick=close;
    sc.querySelector('#scp').onclick=()=>{const t=sc.querySelector('#surl').textContent;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('הקישור הועתק')).catch(()=>{
        const r=document.createRange();r.selectNodeContents(sc.querySelector('#surl'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('סמן והעתק ידנית')})};
  });
}
function showDone(){
  document.querySelector('.done')?.remove();
  const d=document.createElement('div');d.className='done';
  d.innerHTML=`<div class="card" role="alertdialog" aria-label="הטוסט מוכן">
    <svg class="icon" viewBox="0 0 52 44" aria-hidden="true"><path d="M14 14V5a5 5 0 0 1 10 0v9"/><path d="M28 14V5a5 5 0 0 1 10 0v9"/><rect x="4" y="18" width="44" height="22" rx="7"/></svg>
    <h3>הטוסט מוכן</h3><p>החשמל נותק</p>
    <div class="row"><button class="btn" id="dAgain">עוד אחד</button><button class="btn pri" id="dOk">תודה</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#dOk').onclick=()=>d.remove();
  d.querySelector('#dAgain').onclick=()=>{d.remove();turnOn(S.prof>=0?S.profiles[S.prof]?.n:undefined)};
}
let tt;function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),2200)}

function renderStats(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const weekStart=today-now.getDay()*DAY;
  $('stWeek').textContent=S.log.filter(x=>x.t>=weekStart).length;
  $('stTotal').textContent=S.log.length;
  const cnt={};S.log.forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1);
  $('stFav').textContent=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-';
  const DN=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const days=Array.from({length:7},(_,i)=>{const s=weekStart+i*DAY;return{l:DN[i],t:s===today,f:s>today,c:S.log.filter(x=>x.t>=s&&x.t<s+DAY).length}});
  const piece=i=>`<svg viewBox="0 0 18 16" aria-hidden="true" fill="${rgb(shadeAt(.25+((i*37)%5)/10))}">${SLICE}</svg>`;
  $('bars').innerHTML=days.map(d=>`<div class="bar${d.t?' today':''}${d.f?' future':''}"><div class="stack">${d.c?Array.from({length:Math.min(d.c,5)},(_,i)=>piece(i)).join('')+(d.c>5?`<span class="more">+${d.c-5}</span>`:''):'<span class="none"></span>'}</div><small>${d.l}</small></div>`).join('');
}
function drawClock(){
  const timed=R.on&&R.endAt;
  const left=timed?R.endAt-Date.now():(R.on?0:S.min*60000);
  $('time').textContent=R.on&&!timed?'--:--':fmt(left);
  const target=doneness(R.on?R.total/60:S.min);
  const prog=timed?Math.max(0,Math.min(1,1-left/(R.total*1000))):(R.on?.5:1);
  const d=R.on?target*prog:(R.justDone?target:target);
  const crumb=shadeAt(R.on?d*.9:(R.justDone?target*.9:.02)),crust=shadeAt(Math.min(1,(R.on||R.justDone?d:.08)+.28));
  const h=$('hero');h.style.setProperty('--crumb',rgb(crumb));h.style.setProperty('--crust',rgb(crust));
}
function setAccent(){
  const p=S.prof>=0?S.profiles[S.prof]:null,c=(p&&HUE[p.ic])||'#ff9f0a';
  const rgb=c.match(/\w\w/g).map(h=>parseInt(h,16));
  document.documentElement.style.setProperty('--accent',c);
  document.documentElement.style.setProperty('--accent-soft',`rgba(${rgb},.15)`);
}
function render(){
  setAccent();
  if(CAP)LSset('toaster_end',R.on&&R.endAt?String(R.endAt):null);
  $('app').classList.toggle('is-on',R.on);document.documentElement.classList.toggle('glow-warm',!!R.on);
  drawClock();
  $('state').textContent=R.on?(R.rounds>1?(R.midDone?'סיבוב שני':'סיבוב ראשון'):'קולה...'):R.justDone?'הטוסט מוכן':'מוכן לקלייה';
  $('hint').textContent=R.on?(R.endAt?'לחץ את הידית למטה. החשמל ינותק בסוף':'אין טיימר פעיל'):R.justDone?'אפשר להוציא':'בחר שחום והדלק';
  $('power').setAttribute('aria-pressed',R.on);$('powerTxt').textContent=R.on?'כבה עכשיו':'הדלק';
  $('ext').disabled=!R.on||!R.endAt;
  const isCustom=!TIMES.includes(S.min)&&S.prof<0;
  const sw=(m,dash)=>{const c=shadeAt(doneness(m));return `<svg viewBox="0 0 36 40" aria-hidden="true"><path class="${dash?'swd':'sw'}" d="M5 38V13C1 10 2 2 10 2h16c8 0 9 8 5 11v25Z" fill="${dash?'none':rgb(shadeAt(Math.min(1,doneness(m)+.28)))}" ${dash?'stroke="#8392a6" stroke-dasharray="3 3" stroke-width="1.5"':''}/>${dash?'':`<path d="M9 35V15C6 13 7 6 12 6h12c5 0 6 7 3 9v20Z" fill="${rgb(mix(c,[255,240,210],.18))}"/>`}</svg>`};
  $('times').innerHTML=TIMES.map(m=>`<button class="shade" data-m="${m}" aria-pressed="${S.min===m&&S.prof<0}">${sw(m)}<b>${m}′</b><span>${SHADE_NAME[m]}</span></button>`).join('')+
    `<button class="shade custom" data-m="custom" aria-pressed="${isCustom}">${isCustom?sw(S.min):sw(3,true)}<b>${isCustom?fmtMin(S.min)+'′':'...'}</b><span>אחר</span></button>`;
  $('profiles').innerHTML=S.profiles.map((p,i)=>`<button class="prof" data-p="${i}" style="--h:${HUE[p.ic]||HUE.star}" aria-pressed="${R.on&&i===S.prof}"><span class="chip">${svg(ICONS[p.ic]||ICONS.star)}</span><b>${esc(p.n)}</b><span${p.r>1?' aria-label="'+fmtMin(p.m)+' דקות, 2 סיבובים"':''}>${fmtMin(p.m)} דק׳${p.r>1?' ×2':''}</span></button>`).join('');
  $('tNotify').setAttribute('aria-pressed',S.notify);$('sNotify').textContent=!S.notify?'מושתק':window.IN_HOMEON?(NATIVE()?'התראה לטלפון':'צפצוף באפליקציה'):(S.push&&pushOK()&&Notification.permission==='granted')?'צליל, רטט וסימן':'רק באפליקציה';
  $('sSiri').textContent=S.profiles[S.siri]?'"טוסט" - '+S.profiles[S.siri].n:'לא הוגדר';
  renderStats();
  const isC=!TIMES.includes(S.min);
  $('bbShadeIc').innerHTML=SHADE_ICON(S.min);
  $('bbShadeTxt').textContent=(isC?'מותאם':SHADE_NAME[S.min])+(window.IN_HOMEON?'':' · '+fmtMin(S.min)+'′');
  $('bbSoundTxt').textContent=SOUNDS[S.sound]||SOUNDS.ding;
}
function openShade(){
  sheet(`<h3>כמה שחום?</h3><div class="pick" id="shp">${TIMES.map(m=>`<button class="pk" data-m="${m}" aria-pressed="${S.min===m}">${SHADE_ICON(m)}<b>${m} דק׳</b><span>${SHADE_NAME[m]}</span></button>`).join('')}
    <button class="pk" data-m="custom" aria-pressed="${!TIMES.includes(S.min)}">${SHADE_ICON(TIMES.includes(S.min)?3:S.min)}<b>${TIMES.includes(S.min)?'אחר':fmtMin(S.min)+' דק׳'}</b><span>זמן משלך</span></button></div>`,(el,close)=>{
    el.querySelector('#shp').onclick=e=>{const b=e.target.closest('.pk');if(!b)return;buzz();close();
      if(b.dataset.m==='custom')return openCustom();
      S.min=+b.dataset.m;S.prof=-1;save();render()};
  });
}
function openSound(){
  sheet(`<h3>צליל בסיום</h3><div class="opts" id="sdp">${Object.entries(SOUNDS).map(([k,n])=>`<button class="opt" data-k="${k}" aria-pressed="${(SOUNDS[S.sound]?S.sound:'ding')===k}"><span>${n}</span><span>▶</span></button>`).join('')}</div>`,(el)=>{
    el.querySelector('#sdp').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;unlockAudio();S.sound=b.dataset.k;save();render();
      el.querySelectorAll('#sdp .opt').forEach(o=>o.setAttribute('aria-pressed',o===b));beep(S.sound)};
  });
}
function openMenu(){
  sheet(`<h3>טוסטר</h3><div class="list">
    ${linked?`<button class="row-i" id="mDev"><span class="ri-ic" style="--h:#30d158">${svg('<rect x="7" y="3" width="10" height="14" rx="3"/><path d="M10 17v4M14 17v4M10 7v3M14 7v3"/>')}</span><span class="ri-t">בחירת תקע</span><span class="ri-v">${esc(DEV?.name||'')}</span></button>
    <button class="row-i" id="mOut"><span class="ri-ic" style="--h:#ff453a">${svg('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>')}</span><span class="ri-t">התנתקות</span><span class="ri-v"></span></button>`
    :`<button class="row-i" id="mIn"><span class="ri-ic" style="--h:#30d158">${svg('<path d="M9 4H5v16h4M14 8l4 4-4 4M18 12H8"/>')}</span><span class="ri-t">חיבור לטוסטר</span><span class="ri-v"></span></button>`}
  </div>`,(el,close)=>{
    el.querySelector('#mDev')&&(el.querySelector('#mDev').onclick=()=>{close();loadDevices(true)});
    el.querySelector('#mOut')&&(el.querySelector('#mOut').onclick=()=>{close();$('fOut').click()});
    el.querySelector('#mIn')&&(el.querySelector('#mIn').onclick=()=>{close();openConnect()});
  });
}
$('bbShade').onclick=()=>{buzz();openShade()};
$('bbSound').onclick=()=>{buzz();openSound()};
$('menuBtn').onclick=()=>{buzz();openMenu()};
setInterval(()=>{if(R.on&&R.endAt&&R.rounds>1&&!R.midDone&&R.endAt-Date.now()<=R.total*500){
  R.midDone=true;beep('micro');buzz([150,80,150]);toast('הטוסטר קפץ? לחץ שוב את הידית');
  $('state').textContent='סיבוב שני';$('hint').textContent='לחץ שוב את הידית למטה'}
  if(R.on&&R.endAt){
  if(Date.now()>=R.endAt){
    if(!live())finished();
    else if(!CAP.cd)turnOff().then(()=>finished());
    else refresh();
  }else drawClock()}},500);

render();setConn();
if(linked)loadDevices();else setTimeout(openConnect,400);
window.TST={get R(){return R},get S(){return S},save:()=>save(),render:()=>render(),extend:()=>extend(),buzz:n=>buzz(n),SHADE_NAME};
})();
</script>
</body>
