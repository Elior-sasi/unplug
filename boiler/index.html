<head>

<title>דוד</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--fg:#fff;--mut:#aeaeb2;--line:#ffffff14;--acc:#ff9a3d;--ink:#1f0e00;--on:#3d8bff;--on-txt:#6fa8ff;--bad:#ff6961;
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #ffc48a;outline-offset:3px;border-radius:14px}
svg{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;min-height:52px}
.circ{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
header .tt{flex:1;min-width:0}
header h1{margin:0;font-size:1.6rem;font-weight:700;line-height:1.1}
header .sub{font-size:.9rem;color:var(--mut)}
.hero{background:var(--card);border-radius:28px;padding:14px 12px 4px;position:relative}
.adj{position:absolute;bottom:12px;width:58px;height:58px;border-radius:50%;background:#2c2c2e;display:grid;place-items:center;font-size:1.9rem;font-weight:700;color:#fff;z-index:2}
.adj:disabled{opacity:.35}
.adj.mi{left:14px}.adj.pl{right:14px}
.dial .pre{fill:none;stroke:#ff9a3d88;stroke-width:14;stroke-linecap:round}
.last{font-size:.95rem;color:var(--mut);text-align:center;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg button{flex:1 1 22%;min-height:52px;border-radius:16px;background:var(--card2);font-weight:700;font-size:1rem;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.sw{width:56px;height:34px;border-radius:999px;background:#48484a;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:right .2s}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{right:25px}
.lbl{font-weight:700;margin:4px 4px 8px}
.tm{display:flex;gap:10px;margin-bottom:14px}.tm label{flex:1;display:flex;flex-direction:column;gap:6px;font-weight:700}
.tm input{min-height:52px;border-radius:16px;background:var(--card2);color:#fff;border:0;padding:0 12px;font-size:1.15rem;font-family:inherit}
.wide{width:100%;min-height:56px;border-radius:999px;background:var(--acc);color:var(--ink);font-weight:800;font-size:1.05rem;margin-top:8px}
.wide.sec{background:var(--card2);color:#fff}
.kpis{display:flex;gap:8px;margin-bottom:14px}.kpis div{flex:1;background:var(--card2);border-radius:16px;padding:12px;text-align:center}.kpis b{display:block;font-size:1.35rem}.kpis span{font-size:.85rem;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin:4px 0 6px;direction:ltr}.bars i{flex:1;background:#ff9a3d99;border-radius:4px 4px 0 0;min-height:2px}.bars i.today{background:var(--acc)}
.dial{position:relative;width:260px;aspect-ratio:1;margin:0 auto -8%;container-type:inline-size}
.dial svg{width:100%;height:100%;display:block}
.trk{stroke:#3a3a3c;stroke-width:14;fill:none;stroke-linecap:round}
.val{stroke:#8e8e93;stroke-width:14;fill:none;stroke-linecap:round;transition:stroke .4s}
.dial.on .val{stroke:var(--acc)}
.tick{stroke:#5a5a5e;stroke-width:3;stroke-linecap:round}
.knob{fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4% 18% 0}
.big{font-size:24cqw;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.st{font-size:1.05rem;font-weight:600;color:var(--mut);margin-top:6px}
.dial.on .st{color:var(--acc)}
.st2{font-size:.95rem;font-weight:600;margin-top:6px;color:#ddd}
.mainrow{display:flex;gap:10px}
.sq{flex:0 0 84px;min-height:62px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.85rem;font-weight:700}
.pw{flex:1;min-height:62px;border-radius:999px;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.25rem;font-weight:700}
.pw.on{background:var(--on);color:#fff}
h2{font-size:1.1rem;margin:2px 4px -4px;font-weight:700}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}

.chip[aria-pressed="true"]{background:var(--acc);color:var(--ink)}

details.more{background:var(--card);border-radius:22px}

details.more summary svg{transition:transform .2s}
details.more[open] summary svg{transform:rotate(180deg)}
.it{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;border-top:1px solid var(--line);text-align:start;width:100%}

.warn.bad{background:#3a1512;border:1px solid #ff453a88}
.note{font-size:.92rem;color:var(--mut);line-height:1.45;margin:0 4px}
.scrim{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--card);border-radius:38px 38px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:48px}.sh-h h3{flex:1;margin:0;font-size:1.35rem}.sh-h .circ{background:var(--card3)}
.grp{background:var(--card2);border-radius:20px;overflow:hidden}.grp .it:first-child{border-top:0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);margin:auto;max-width:420px;background:#2c2c2e;border:1px solid #ffffff14;border-radius:18px;padding:12px 16px;text-align:center;font-weight:600;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Ember look: warm glow, thin big numbers, quick-time tiles, bottom bar ---------- */
html,body{background:radial-gradient(120% 65% at 50% 32%,#2b1609 0%,#120a05 48%,#000 100%) fixed #000}

.ebar{position:fixed;left:max(16px,calc((100vw - 608px)/2));right:max(16px,calc((100vw - 608px)/2));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;padding:8px;border-radius:30px;background:rgba(36,30,26,.92);border:1px solid #ff9a3d33;box-shadow:0 10px 30px #0009;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:5}
.ebar button{flex:1;min-width:0;min-height:60px;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:start;border-radius:22px}

.ebar small{display:block;color:#aeaeb2;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ebar b{display:block;font-size:1.05rem;overflow-wrap:anywhere;line-height:1.15}
.sw[aria-checked="true"]{background:var(--on)!important}
.seg button[aria-pressed="true"]{background:#3d8bff!important;color:#fff!important}

/* ---------- one grid for every device page: same header, dial size, rows and bar ---------- */

.ctl{margin-bottom:12px}
.quick button{min-height:0!important;height:96px}
.ebar{bottom:env(safe-area-inset-bottom,0px)!important}

.fc2 .pw{min-height:52px!important;height:52px}.fc3 .ebar button{min-height:52px!important}

/* no title row: back and ⋯ float in the top corners, the dial starts at the top; the name stays for VoiceOver */

.days{display:flex;justify-content:space-between;gap:4px;margin-bottom:8px}.days button{width:48px;height:48px;min-height:48px;flex:0 0 48px;border-radius:50%;padding:0;display:grid;place-items:center;font-weight:700}.days button{background:var(--card2);color:#fff}.days button[aria-pressed="true"]{background:#3d8bff;color:#fff}

<script>
(function(){
const P=window.parent!==window?window.parent:null;
if(!P||!P.HOH){location.replace('/unplug/');return}
const H=P.HOH,E=H.EMBER;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=t=>{$('live').textContent='';setTimeout(()=>$('live').textContent=t,30)};
let tt;const toast=t=>{document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);say(t);clearTimeout(tt);tt=setTimeout(()=>e.remove(),2600)};
const buzz=()=>{try{P.webkit.messageHandlers.homeon.postMessage({action:'haptic'})}catch(e){}};
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const I={power:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
 left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 wifi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-3 3.6M6.6 6.6C4.3 8.2 3 12 3 12s4 6 9 6a9 9 0 0 0 4.4-1.1"/></svg>',
 refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>'};
const DUR=[[15,'15 דק׳'],[30,'30 דק׳'],[45,'45 דק׳'],[60,'שעה'],[90,'שעה וחצי'],[120,'שעתיים'],[0,'ללא טיימר']];
const mins=m=>m===0?'ללא טיימר':(DUR.find(d=>d[0]===m)||[0,m+' דק׳'])[1];
const PRESET={15:'קצר',30:'מקלחת',45:'שתי מקלחות',60:'אמבטיה'};
const DN=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'],DNL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const hhmm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const toMin=v=>{const[a,b]=String(v||'0:0').split(':').map(Number);return (a||0)*60+(b||0)};
const daysTxt=s=>s.once?'פעם אחת':s.days.length===7?'כל יום':s.days.join()==='0,1,2,3,4'?'א׳-ה׳':s.days.map(i=>DN[i]).join(' ');
const hrs=sec=>{const h=Math.round(sec/3600);return h===1?'שעה':h===2?'שעתיים':h+' שעות'};
let SC=null,SE=null,ST=null,SR='week';
const when=t=>{const d=new Date(t),n=new Date(),k=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5),hm=d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  return k<=0?'היום '+hm:k===1?'אתמול '+hm:d.toLocaleDateString('he-IL',{weekday:'long'})+' '+hm};
let pick=LS.get('ember_pick',30),total=LS.get('ember_total',30),busy=false,tick=null,L=H.link();

  if(b.dataset.open==='sched'){SE=null;return openSched()}
  if(b.dataset.sc!=null||b.dataset.pk!=null){const x=b.dataset.sc!=null?(SC.list||[]).find(s=>s.slot===+b.dataset.sc):(SC.parked||[]).find(p=>p.id===b.dataset.pk);if(!x)return;SE={src:b.dataset.sc!=null?{slot:x.slot}:{parked:x.id},days:x.days.slice(),start:x.start,end:x.end,active:b.dataset.sc!=null};return openSched()}
  if(b.dataset.sct!=null||b.dataset.pkt!=null){const act=b.dataset.sct!=null,x=act?(SC.list||[]).find(s=>s.slot===+b.dataset.sct):(SC.parked||[]).find(p=>p.id===b.dataset.pkt);if(!x)return;b.disabled=true;
    return schedCall(Object.assign({cmd:'schedSave',days:x.days,start:x.start,end:x.end,active:!act},act?{slot:x.slot}:{parked:x.id}),act?'התזמון הושבת':'התזמון הופעל')}
  if(b.id==='scNew'){SE={src:{},days:[],start:390,end:435,active:true};return openSched()}
  if(b.dataset.sd!=null&&SE){keepTimes();const i=+b.dataset.sd;SE.days.includes(i)?SE.days=SE.days.filter(x=>x!==i):SE.days.push(i);SE.days.sort();openSched();const q=SH&&SH.querySelector(`[data-sd="${i}"]`);q&&q.focus();return}
  if(b.id==='scSave'&&SE){keepTimes();if(SE.end===SE.start)return toast('שעת הסיום צריכה להיות אחרי ההתחלה');
    b.disabled=true;return schedCall(Object.assign({cmd:'schedSave',days:SE.days,start:SE.start,end:SE.end,active:SE.active},SE.src),'התזמון נשמר בדוד').then(()=>{SE=null;openSched()})}
  if(b.id==='scDel'&&SE){if(!confirm('למחוק את התזמון?'))return;return schedCall(Object.assign({cmd:'schedDelete'},SE.src),'התזמון נמחק').then(()=>{SE=null;openSched()})}
  if(b.id==='scBack'){SE=null;return openSched()}
  if(b.dataset.open==='auto')return openAuto();
  if(b.dataset.ah){b.disabled=true;return H.native({cmd:'autoOff',m:+b.dataset.ah*60}).then(v=>{Object.assign(H.link(),{auto:Number(v.auto)||+b.dataset.ah*3600});toast('הדוד ייכבה לבד אחרי '+hrs(+b.dataset.ah*3600));openAuto();draw()}).catch(e=>{toast(newer(e));openAuto()})}
  if(b.dataset.open==='stats'){ST=null;return openStats()}
  if(b.dataset.sr){SR=b.dataset.sr;return openStats()}
  if(b.id==='setup'||b.dataset.open==='setup')return H.after(()=>H.setup().catch(()=>{}));
  if(b.dataset.web)return H.after(()=>H.web(b.dataset.web));
  if(b.dataset.open==='full')return H.after(()=>H.full());
  if(b.dataset.open==='room')return H.after(()=>H.pickRoom());
  if(b.dataset.open==='hide')return H.after(()=>H.hide());
  if(b.dataset.open==='hist'){const h=H.history(),f=t=>new Date(t).toLocaleString('he-IL',{weekday:'short',hour:'2-digit',minute:'2-digit'});
    return sheet('היסטוריה',h.length?`<div class="grp">${h.map(l=>`<div class="it"><span class="g"><span class="t">${esc(l.text)}</span><span class="s">${esc(f(l.t))}</span></span></div>`).join('')}</div><button class="it" id="histClear" style="margin-top:12px;border-radius:18px;background:var(--card);justify-content:center;color:#ff6961;font-weight:700">מחיקת ההיסטוריה</button>`:'<p class="note">עוד לא בוצעו פעולות בדוד מ-HomeOn.</p>')}
  if(b.id==='histClear'){if(!confirm('למחוק את כל ההיסטוריה של הדוד?'))return;if(H.clearHistory)H.clearHistory();closeSheet();draw();return toast('ההיסטוריה נמחקה')}
});

/* one screen, no scrolling, like the AC page */
const app=$('app');
function fit(){const dl=document.querySelector('.dial'),hero=document.querySelector('.hero'),more=$('moreDet');app.style.overflowY='hidden';
  const R=document.documentElement,over=()=>app.scrollHeight>app.clientHeight+1;['fc1','fc2','fc3'].forEach(c=>R.classList.remove(c));
  if(dl&&hero&&!(more&&more.open)){const w=Math.round(Math.min(290,innerWidth-70,innerHeight*.36));dl.style.width=w+'px';
    for(const c of ['fc1','fc2','fc3']){if(!over())break;R.classList.add(c)}}
  app.style.overflowY=app.scrollHeight>app.clientHeight+1?'auto':'hidden'}
addEventListener('resize',fit);document.addEventListener('toggle',()=>setTimeout(fit,30),true);
let tx=0,ty=0;document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
document.addEventListener('touchmove',e=>{if(e.target.closest('.scrim'))return;const t=e.touches[0];if(Math.abs(t.clientX-tx)>Math.abs(t.clientY-ty))return;if(app.style.overflowY==='hidden')e.preventDefault()},{passive:false});

draw();if(H.inApp()){refresh().then(()=>{if(H.link().connected)loadSched()})}
/* the countdown moves every 30 s; the heater itself is asked every minute */
setInterval(()=>{const l=H.link();if(l.on&&l.left>30){l.left-=30;draw()}},30000);
setInterval(()=>{if(document.visibilityState==='visible'&&H.inApp()&&!busy)refresh()},60000);
})();
</script>
