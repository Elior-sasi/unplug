<!doctype html>
<html lang="he" dir="rtl" class="dv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>משקל - הדמיה</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew",system-ui,sans-serif;font-size:17px}
button{font:inherit;cursor:pointer}
.dial{position:relative;width:min(290px,calc(100vw - 70px),36vh);aspect-ratio:1;margin:20px auto -6%;container-type:inline-size}
.dial svg{width:100%;height:100%;display:block}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:4%}
.big{font-size:27cqw;font-weight:200;line-height:1;letter-spacing:-.03em;direction:ltr}
.big small{font-size:.3em;font-weight:300;color:#aeaeb2;margin-inline-start:4px}
.st{color:#aeaeb2;font-weight:500;font-size:1.05rem;margin-top:4px}
.st2{color:#d1d1d6;font-size:.95rem;margin-top:4px}
.down{color:#30d158;font-weight:700}
.tile b{font-size:1.15rem;font-weight:700;direction:ltr}.tile span{font-size:.82rem;color:#aeaeb2}
.tile i{font-style:normal;font-size:.75rem;color:#30d158}
.chart{background:var(--dv-card);border-radius:24px;padding:12px 14px}
.chart svg{width:100%;height:70px;display:block}
.chart .h{display:flex;justify-content:space-between;color:#aeaeb2;font-size:.85rem}
.bar2{flex:1;display:flex;align-items:center;gap:10px;padding:0 10px;min-height:60px;border-radius:22px;background:none;border:0;color:#fff;text-align:start}
.bar2 .bi{width:44px;height:44px;border-radius:14px;background:#ff9a3d2e;color:#ff9a3d;display:grid;place-items:center;flex:none}
.bar2 small{display:block;color:#aeaeb2;font-size:.85rem}.bar2 b{display:block;font-size:1.05rem}
.mock{position:fixed;top:calc(env(safe-area-inset-top,0px) + 26px);left:50%;transform:translateX(-50%);background:#ff9a3d22;color:#ffc48a;border:1px solid #ff9a3d55;border-radius:999px;padding:2px 10px;font-size:.75rem;z-index:6}
/* iOS zooms into any field under 16px when zoom is allowed */
input,select,textarea{font-size:max(16px,1em)!important}
</style>
<link rel="stylesheet" href="../device.css?v=2">
</head>
<body>
<span class="mock">הדמיה - נתונים לדוגמה</span>
<main class="dv-page">
  <div class="dv-corners">
    <button class="dv-circle" id="back" aria-label="חזרה ל-HomeOn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <button class="dv-circle" aria-label="הגדרות המשקל"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <h1 class="dv-title">משקל חכם</h1>
  <div class="dial" role="img" aria-label="62.4 קילו, ירידה של 0.6 קילו מהשקילה הקודמת. נשארו 2.4 קילו ליעד">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <g stroke="#ffffff40" stroke-width="2.5" stroke-linecap="round"></g>
      <path d="M56 244A133 133 0 1 1 244 244" fill="none" stroke="#ffffff14" stroke-width="12" stroke-linecap="round"/>
      <path d="M56 244A133 133 0 1 1 268 112" fill="none" stroke="#3d8bff" stroke-width="12" stroke-linecap="round"/>
      <circle cx="268" cy="112" r="13" fill="#fff"/>
    </svg>
    <div class="ctr"><div class="big">62.4<small>ק״ג</small></div><div class="st">היום 07:12</div><div class="st2"><span class="down">↓ 0.6</span> מהשקילה הקודמת</div></div>
  </div>
  <div class="dv-ctl"><button class="dv-chip" aria-pressed="true">שבוע</button><button class="dv-chip" aria-pressed="false">חודש</button><button class="dv-chip" aria-pressed="false">שנה</button></div>
  <div class="chart" role="img" aria-label="גרף משקל בשבוע האחרון: מ-63.4 ל-62.4">
    <div class="h"><span>63.4</span><span>שבוע אחרון</span></div>
    <svg viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12 L50 20 L100 18 L150 34 L200 30 L250 46 L300 58" fill="none" stroke="#3d8bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="58" r="4" fill="#3d8bff"/></svg>
  </div>
  <div class="dv-label" id="bL">הרכב גוף</div>
  <div class="dv-tiles" role="group" aria-labelledby="bL">
    <button class="dv-tile tile"><b>21.6</b><span>BMI</span></button>
    <button class="dv-tile tile"><b>18.4%</b><span>שומן</span><i>↓ 0.3</i></button>
    <button class="dv-tile tile"><b>56%</b><span>מים</span></button>
    <button class="dv-tile tile"><b>41%</b><span>שריר</span><i>↑ 0.2</i></button>
  </div>
  <button class="dv-more">הגדרות נוספות<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
</main>
<nav class="dv-bar" aria-label="יעד ותזכורת">
  <button class="bar2"><span class="bi" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></span><span><small>יעד</small><b>60.0 ק״ג · עוד 2.4</b></span></button>
  <button class="bar2"><span class="bi" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M5 3 2 6M19 3l3 3"/></svg></span><span><small>תזכורת שקילה</small><b>כל בוקר 07:00</b></span></button>
</nav>
<script>
document.getElementById('back').onclick=()=>{if(window.parent!==window)parent.postMessage('unplug-close','*');else history.back()};
/* HomeOn text size (settings) applies here too */(function(){const a=()=>{let s='100';try{const v=localStorage.getItem('unplug_ts');if(['100','115','130','150'].includes(v))s=v}catch(e){}document.documentElement.style.fontSize=s+'%'};a();addEventListener('storage',e=>{if(e.key==='unplug_ts')a()})})();
</script>
</body>
</html>
