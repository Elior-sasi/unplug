<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שואב</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--fg:#fff;--mut:#aeaeb2;--line:#ffffff14;--acc:#ff9a3d;--ink:#1f0e00;--on:#3d8bff;--on-txt:#6fa8ff;--bad:#ff6961;--ok:#30d158;
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #ffc48a;outline-offset:3px;border-radius:14px}
input:focus,input:focus-visible,select:focus,select:focus-visible{outline:3px solid #6fa8ff;outline-offset:2px}
svg{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 120px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;min-height:52px}
.circ{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.circ svg{width:22px;height:22px}
header .tt{flex:1;min-width:0}
header h1{margin:0;font-size:1.6rem;font-weight:700;line-height:1.1}
header .sub{font-size:.9rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the card with the ring - battery around, state in the middle (same as the AC dial) */
.hero{position:relative;background:var(--card);border-radius:28px;padding:14px 12px 12px}
.dial{position:relative;width:260px;aspect-ratio:1;margin:0 auto -9%;container-type:inline-size}
.dial svg{width:100%;height:100%;display:block}
.trk{stroke:#3a3a3c;stroke-width:14;fill:none;stroke-linecap:round}
.val{stroke:#8e8e93;stroke-width:14;fill:none;stroke-linecap:round;transition:stroke .4s}
.dial.on .val{stroke:var(--acc)}
.tick{stroke:#5a5a5e;stroke-width:3;stroke-linecap:round}
.knob{fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6% 18% 0}
.big{font-size:23cqw;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:.45em;font-weight:600;margin-inline-start:2px}
.st{font-size:1.05rem;font-weight:600;color:var(--mut);margin-top:4px}
.dial.on .st{color:var(--acc)}
.st2{font-size:1rem;font-weight:700;margin-top:6px;line-height:1.3}
.err{background:#3a1512;border:1px solid #ff453a88;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
.err span{flex:1}
.err button{background:#ffffff1a;border-radius:999px;min-height:44px;padding:0 14px;font-weight:700}
/* main row: small dock button + wide start, like turbo + power on the AC */
.mainrow{display:flex;gap:10px}
.sq{flex:0 0 76px;min-height:62px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.85rem;font-weight:600}
.pw{flex:1;min-height:62px;border-radius:999px;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.25rem;font-weight:700}
.pw.on{background:var(--on);color:#fff}
h2{font-size:1.1rem;margin:2px 4px -4px;font-weight:700}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-inline:16px}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;background:var(--card);font-size:.95rem;font-weight:700;white-space:nowrap}
.chip svg{width:19px;height:19px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.chip.busy{background:#3d8bff26;color:var(--on-txt)}
details.more{background:var(--card);border-radius:22px}
details.more summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 16px;font-weight:700;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .2s}
details.more[open] summary svg{transform:rotate(180deg)}
.lst{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;border-top:1px solid var(--line);text-align:start;width:100%}
.it .ico{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--acc);flex:none}
.it .ico svg{width:19px;height:19px}
.it .g{flex:1;min-width:0}
.it .t{display:block;font-weight:600}
.it .s{display:block;font-size:.88rem;color:var(--mut);margin-top:2px}
.it .chev{color:var(--mut);transform:scaleX(-1)}
.badge{background:var(--acc);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700}
/* floating bar: mode and suction, like mode and fan on the AC */
.bar{position:fixed;left:max(16px,calc((100vw - 608px)/2));right:max(16px,calc((100vw - 608px)/2));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;padding:6px;border-radius:28px;background:rgba(28,28,30,.94);border:1px solid #ff9a3d33;box-shadow:0 10px 30px #0009;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:5}
.bb{flex:1;min-width:0;min-height:60px;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:start}
.bb .bi{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:#ffc48a;flex:none}
.bb .bi svg{width:20px;height:20px}
.bb small{display:block;font-size:.8rem;color:var(--mut)}
.bb b{display:block;font-size:1rem;color:#ffc48a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar[hidden]{display:none}
.vhero{background:var(--card);border-radius:24px;padding:12px 14px;display:flex;align-items:center;gap:14px}
.vimg{width:72px;height:72px;flex:none;display:grid;place-items:center}.vimg img,.vimg svg{max-width:100%;max-height:100%;object-fit:contain}
.vhero.on .vimg{filter:drop-shadow(0 6px 18px #ff9a3d88)}
.vtx{flex:1;min-width:0}.vst{font-size:1.45rem;font-weight:700;line-height:1.15}.vhero.on .vst{color:var(--acc)}
.vsub{color:var(--mut);font-size:.95rem;margin-top:2px}
.vbat{height:8px;border-radius:999px;background:#3a3a3c;margin-top:8px;overflow:hidden}.vbat i{display:block;height:100%;background:var(--ok);border-radius:999px}.vbat.low i{background:#ffd60a}
.vstat{font-size:.85rem;color:var(--mut);margin-top:6px}
.mcard{position:relative;background:#141416;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mcard .mwrap{position:relative;max-width:100%}
.mcard img{display:block;max-width:100%;max-height:var(--mh,48vh);width:auto;height:auto;margin:auto}
.mbig{position:absolute;top:10px;left:10px;width:46px;height:46px;border-radius:50%;background:#000b;border:1px solid #ffffff33;display:grid;place-items:center}
.mpill{position:absolute;top:12px;right:12px;background:#000c;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.rbs{display:flex;justify-content:space-around;gap:4px}
.rb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.9rem;font-weight:600;color:#ddd;min-width:56px}
.rb>span{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.rb.busy>span{background:#3d8bff33;color:var(--on-txt)}
/* the big map */
.mv{position:fixed;inset:0;background:#000;z-index:15;display:flex;flex-direction:column}
.mv-h{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.mv-h h2{flex:1;margin:0;font-size:1.4rem}
.mv-stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#0b0b0c}
.mv-in{position:absolute;left:0;top:0;transform-origin:0 0}
.mv-in img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mv-in svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mv-in .pin{transform:translate(-50%,-50%) scale(var(--inv,1))}
.mv-zoom{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;gap:8px}
.mv-zoom button{width:48px;height:48px;border-radius:50%;background:#1c1c1e;border:1px solid #ffffff22;font-size:1.5rem;font-weight:700}
.mv-hint{position:absolute;top:10px;right:10px;left:70px;background:#000c;border-radius:16px;padding:10px 14px;font-weight:600;font-size:.95rem}
.mv-b{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:10px;background:#000}
.tools{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.tools::-webkit-scrollbar{display:none}
.tools .chip[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.tabs2{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:4px}
.tabs2 button{flex:1;min-height:44px;border-radius:999px;font-weight:700}
.tabs2 button[aria-pressed="true"]{background:var(--card3)}
.dot{fill:#fff;stroke:#ff9a3d;stroke-width:3}

/* sheets */
.scrim{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--card);border-radius:38px 38px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);box-shadow:0 -10px 40px #000a;overscroll-behavior:contain}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:48px}
.sh-h h3{flex:1;margin:0;font-size:1.35rem}
.sh-h .circ{background:var(--card3)}
.sheet .grp{background:var(--card2);border-radius:20px;overflow:hidden;margin-bottom:14px}
.sheet .grp .it{border-top:1px solid var(--line)}.sheet .grp .it:first-child{border-top:0}
.lbl{font-size:.95rem;color:var(--mut);margin:6px 4px 8px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.seg button{flex:1 1 30%;min-height:56px;border-radius:18px;background:var(--card2);font-weight:700;font-size:1rem;padding:4px 8px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.seg button[aria-pressed="true"]::before{content:"✓ "}
.sw{width:56px;height:34px;border-radius:999px;background:#48484a;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:right .2s}
.sw[aria-checked="true"]{background:var(--on)}
.sw[aria-checked="true"]::after{right:25px}
select,input[type=time],input[type=email],input[type=password]{font:inherit;font-size:1rem;min-height:48px;border-radius:14px;background:var(--card3);color:#fff;border:0;padding:0 12px;max-width:100%}
.wide{width:100%;min-height:58px;border-radius:999px;background:var(--acc);color:var(--ink);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:8px}
.wide.sec{background:var(--card2);color:#fff}
.meter{height:10px;border-radius:999px;background:#48484a;overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.meter.low>i{background:#ffd60a}.meter.out>i{background:var(--bad)}
.map{position:relative;border-radius:22px;overflow:hidden;background:#141416;margin-bottom:14px}
.map img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);min-height:44px;min-width:44px;padding:6px 12px;border-radius:999px;border:2px solid #fff6;background:#000b;color:#fff;font-weight:700;font-size:.95rem;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.pin[aria-pressed="true"]{background:var(--acc);color:var(--ink);border-color:#fff}
.pin[aria-pressed="true"]::before{content:"✓ "}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:14px}
.tot div{background:var(--card2);border-radius:18px;padding:12px 4px;font-size:.9rem;color:var(--mut)}
.tot b{display:block;font-size:1.35rem;color:#fff}
.num{display:flex;align-items:center;gap:8px}
.num button{width:48px;height:48px;border-radius:50%;background:var(--card3);font-size:1.5rem;font-weight:700}
.num output{min-width:80px;text-align:center;font-weight:700}
.note{font-size:.92rem;color:var(--mut);line-height:1.45;margin:4px 4px 14px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);margin:auto;max-width:420px;background:#2c2c2e;border:1px solid #ffffff14;border-radius:18px;padding:12px 16px;text-align:center;font-weight:600;z-index:30}
.login{display:flex;flex-direction:column;gap:12px}
.login label{font-weight:600}
.login .e{color:var(--bad);min-height:1.2em;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="circ" id="back" aria-label="חזרה ל-HomeOn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <div class="tt"><h1>שואב</h1><div class="sub" id="sub">MOVA</div></div>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:14px"></main>
</div>
<nav class="bar" id="bar" hidden aria-label="מצב ניקוי"></nav>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script>
(function(){
const P=window.parent!==window?window.parent:null;
if(!P||!P.HO){location.replace('/unplug/');return}
const HO=P.HO,MV=P.MOVA_ST||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=n=>'⁦'+n+'%⁩';
const say=t=>{$('live').textContent='';setTimeout(()=>$('live').textContent=t,30)};
let tt;const toast=t=>{document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);say(t);clearTimeout(tt);tt=setTimeout(()=>e.remove(),2600)};
const buzz=()=>{try{P.webkit&&P.webkit.messageHandlers&&P.webkit.messageHandlers.homeon&&P.webkit.messageHandlers.homeon.postMessage({action:'haptic'})}catch(e){}};
const api=(p,b)=>HO.api(p,b);
const I={
 power:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>',
 pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>',
 dock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>',
 stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
 drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
 wind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
 map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
 right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 station:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="6" y="3" width="12" height="15" rx="2"/><path d="M4 21h16M9 14h6"/></svg>',
 info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
 expand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

function mvPointer(st){const P=new Map();let start=null,pinch=null;
  st.addEventListener('pointerdown',e=>{P.set(e.pointerId,{x:e.clientX,y:e.clientY});if(P.size===1){start={x:e.clientX,y:e.clientY,tx:MVW.tx,ty:MVW.ty};MVW.dragged=false}
    if(P.size===2){const [a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:MVW.z}}});
  st.addEventListener('pointermove',e=>{if(!P.has(e.pointerId)||!MVW)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===2&&pinch){const [a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=st.getBoundingClientRect();MVW.dragged=true;mvZoom(pinch.z*d/pinch.d/MVW.z,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
    if(P.size===1&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>8)MVW.dragged=true;if(MVW.dragged&&MVW.z>1){MVW.tx=start.tx+dx;MVW.ty=start.ty+dy;mvApply()}}});
  const up=e=>{const was=P.has(e.pointerId);P.delete(e.pointerId);if(P.size<2)pinch=null;
    if(was&&P.size===0&&MVW&&!MVW.dragged&&!e.target.closest('button')){mvTap(e)}if(P.size===0)start=null};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',e=>{P.delete(e.pointerId);pinch=null;start=null});
  st.addEventListener('wheel',e=>{e.preventDefault();const r=st.getBoundingClientRect();mvZoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false})}
function mvTap(e){const m=MVW,t=m.tool;if(m.mode!=='edit'||!['nogo','nomop','wall','split'].includes(t))return;if(t==='split'&&!m.picks.length)return toast('קודם בוחרים את החדר');
  const r=m.el.querySelector('#mvIn').getBoundingClientRect();const p=[+((e.clientX-r.left)/r.width*100).toFixed(2),+((e.clientY-r.top)/r.height*100).toFixed(2)];
  if(p[0]<0||p[0]>100||p[1]<0||p[1]>100)return;if(m.pts.length>=2)m.pts=[];m.pts.push(p);buzz();mvDraw();say(m.pts.length===1?'נקודה ראשונה סומנה':'נקודה שנייה סומנה')}
async function mvEdit(body,ok){buzz();const b=MVW&&MVW.el.querySelector('#mvDo');if(b){b.disabled=true;b.textContent='שולח...'}
  try{const j=await api('/mova/edit',body);if(j.map){mapD=j.map;MV.map=j.map;mapAt=Date.now()}if(j.state){D=Object.assign({},D,j);delete D.sent;delete D.map;MV.d=D}
    toast(ok);if(MVW){MVW.picks=[];MVW.pts=[];MVW.zones=JSON.parse(JSON.stringify(mapD.zones||MVW.zones))}mvDraw();draw();setTimeout(()=>loadMap(true),6000)}
  catch(e){toast(e.message);mvDraw()}}
function mvClick(b){const m=MVW;if(m.dragged&&b.closest('.mv-stage')){m.dragged=false;return true}
  if(b.id==='mvX'){closeMapView();return true}
  if(b.id==='zIn'){mvZoom(1.5);return true}if(b.id==='zOut'){mvZoom(1/1.5);return true}
  if(b.dataset.mvmode){m.mode=b.dataset.mvmode;m.tool=null;m.picks=[];m.pts=[];mvDraw();return true}
  if(b.dataset.tool){const k=b.dataset.tool;if(k==='order'){sheet('order');return true}m.tool=m.tool===k?null:k;m.picks=[];m.pts=[];mvDraw();if(m.tool&&HINT[k])say(HINT[k]);return true}
  if(b.dataset.mapsel){mvEdit({op:'select_map',id:+b.dataset.mapsel},'עברנו מפה');return true}
  if(b.dataset.room){const id=+b.dataset.room;
    if(m.mode==='clean'){sel.has(id)?sel.delete(id):sel.add(id);buzz();mvDraw();draw();say(sel.has(id)?'נבחר':'בוטלה הבחירה');return true}
    if(m.tool==='rename'){RENAME=id;sheet('rename');return true}
    if(m.tool==='merge'){m.picks.includes(id)?m.picks=m.picks.filter(x=>x!==id):m.picks=[...m.picks,id].slice(-2);mvDraw();return true}
    if(m.tool==='split'){m.picks=[id];m.pts=[];mvDraw();say('עכשיו שתי נקודות לקו');return true}
    toast('בוחרים כלי עריכה למטה');return true}
  if(b.dataset.zdel){const [k,i]=b.dataset.zdel.split(':');m.zones[k].splice(+i,1);mvEdit({op:'zones',zones:m.zones},'האזור נמחק');return true}
  if(b.id==='mvDo'){const t=m.tool;
    if(t==='merge')mvEdit({op:'merge',ids:m.picks},'החדרים אוחדו. המפה תתעדכן בעוד רגע');
    if(t==='split')mvEdit({op:'split',id:m.picks[0],line:[...m.pts[0],...m.pts[1]]},'החדר חולק. המפה תתעדכן בעוד רגע');
    if(t==='nogo'||t==='nomop'||t==='wall'){const k=t==='wall'?'walls':t;(m.zones[k]=m.zones[k]||[]).push([...m.pts[0],...m.pts[1]]);mvEdit({op:'zones',zones:m.zones},'נשמר')}
    return true}
  if(b.id==='goRooms'){const ids=[...sel];closeMapView();act('rooms','מנקה '+(ids.length===1?'חדר אחד':ids.length+' חדרים'),{rooms:ids,times});return true}
  if(b.dataset.times){times=+b.dataset.times;mvDraw();return true}
  return false}
let RENAME=null,ORDER=null;
addEventListener('resize',()=>{if(MVW)mvFitView()});

/* ---------- taps ---------- */
const MSG={start:'מתחיל לנקות',pause:'מושהה',dock:'חוזר לעמדה',stop:'נעצר',locate:'השואב משמיע צליל',clear:'ההתראה נוקתה',wash:'פקודה נשלחה',dry:'פקודה נשלחה',empty:'מרוקן אבק'};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(MVW&&b.closest('.mv')&&mvClick(b))return;
  if(b.id==='back'){try{P.postMessage('unplug-close','*')}catch(_){}return}
  if(b.dataset.open){if(b.dataset.open==='mapview'){closeSheet(true);if(MVW){MVW.mode='edit';mvDraw();return}openMapView();if(b.closest('.sheet')&&MVW){MVW.mode='edit';mvDraw()}return}return sheet(b.dataset.open)}
  if(b.dataset.a){const a=b.dataset.a;
    if(a==='rooms'){const ids=[...sel];return act('rooms','מנקה '+(ids.length===1?'חדר אחד':ids.length+' חדרים'),{rooms:ids,times})}
    if(a==='start'&&D&&D.state&&(D.state.paused||D.state.state===3))return act('start','ממשיך לנקות');
    return act(a,MSG[a])}
  if(b.dataset.ren){RENAME=+b.dataset.ren;return sheet('rename')}
  if(b.dataset.rtype){SH.el.querySelectorAll('[data-rtype]').forEach(o=>o.setAttribute('aria-pressed',o===b));return}
  if(b.id==='rnSave'){const name=$('rnN').value.trim(),tb=SH.el.querySelector('[data-rtype][aria-pressed="true"]'),type=tb?+tb.dataset.rtype:0;
    if(!name&&!type)return toast('צריך שם או סוג חדר');closeSheet();return MVW?mvEdit({op:'rename',id:RENAME,name,type},'השם נשמר'):api('/mova/edit',{op:'rename',id:RENAME,name,type}).then(j=>{if(j.map)mapD=j.map;toast('השם נשמר');load()}).catch(e=>toast(e.message))}
  if(b.dataset.up||b.dataset.down){const i=+(b.dataset.up||b.dataset.down),j=b.dataset.up?i-1:i+1;[ORDER[i],ORDER[j]]=[ORDER[j],ORDER[i]];SH.sig='';refreshSheet();const q=SH.el.querySelector(b.dataset.up?`[data-up="${j}"]`:`[data-down="${j}"]`)||SH.el.querySelector(`[data-up="${j}"],[data-down="${j}"]`);q&&q.focus();return}
  if(b.id==='orSave'){const ids=ORDER.slice();ORDER=null;closeSheet();return MVW?mvEdit({op:'order',ids},'הסדר נשמר'):null}
  if(b.dataset.room){const id=+b.dataset.room;sel.has(id)?sel.delete(id):sel.add(id);buzz();draw();refreshSheet();say(sel.has(id)?'נבחר':'בוטלה הבחירה');return}
  if(b.dataset.times){times=+b.dataset.times;refreshSheet();return}
  if(b.id==='goRooms'){const ids=[...sel];closeSheet();return act('rooms','מנקה '+(ids.length===1?'חדר אחד':ids.length+' חדרים'),{rooms:ids,times})}
  if(b.dataset.q){const k=b.dataset.q,v=b.dataset.v,s=(D.selects||[]).find(s=>s.k===k);if(s)s.cur=v;refreshSheet();draw();return setv(k,v)}
  if(b.dataset.k&&b.classList.contains('sw')){const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);const s=(D.switches||[]).find(s=>s.k===b.dataset.k);if(s)s.on=on;return setv(b.dataset.k,on)}
  if(b.dataset.reset){const c=(D.consumables||[]).find(c=>c.k===b.dataset.reset);if(!confirm('לאפס את המונה של '+(c?c.t:'')+'? רק אחרי שהחלפת או ניקית אותו.'))return;return act('reset:'+b.dataset.reset,'אופס')}
  if(b.dataset.num){const n=(D.numbers||[]).find(n=>n.k===b.dataset.num);if(!n)return;const v=Math.max(n.min,Math.min(n.max,n.v+(+b.dataset.d)));if(v===n.v)return;n.v=v;b.parentNode.querySelector('output').textContent=n.u==='%'?pct(v):v+' '+n.u;clearTimeout(b._t);b._t=setTimeout(()=>setv(n.k,v),600);return}
  if(b.dataset.sch){const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);return setv('schedule_on',{id:b.dataset.sch,on})}
  if(b.dataset.schdel){if(!confirm('למחוק את התזמון מהשואב?'))return;return setv('schedule_delete',b.dataset.schdel,'התזמון נמחק')}
  if(b.id==='dndOn'){const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);return setv('dnd',{on,start:$('dS').value,end:$('dE').value},on?'שעות שקטות פעילות':'שעות שקטות כבויות')}
  if(b.id==='dvRoom')return HO.after(()=>HO.pickRoom());
  if(b.id==='dvPair')return HO.after(()=>HO.pair());
  if(b.id==='dvHide')return HO.after(()=>HO.hide());
  if(b.id==='dvOut'){if(!confirm('לנתק את חשבון MOVAhome מ-HomeOn?'))return;closeSheet();return api('/mova/logout').then(()=>{linked=false;D=null;mapD=null;MV.linked=false;MV.d=null;MV.map=null;HO.render();draw()}).catch(e=>toast(e.message))}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.sel){const s=(D.selects||[]).find(s=>s.k===t.dataset.sel);if(s)s.cur=t.value;return setv(t.dataset.sel,t.value,'נשמר')}
  if(t.id==='dS'||t.id==='dE')return setv('dnd',{on:$('dndOn').getAttribute('aria-checked')==='true',start:$('dS').value,end:$('dE').value},'נשמר')});

/* ---------- fit on one screen, like the AC page ---------- */
const app=$('app');
function fit(){if(linked===false||MVW)return;const bar=$('bar');const pb=bar.hidden?24:Math.ceil(innerHeight-bar.getBoundingClientRect().top+16);app.style.paddingBottom=pb+'px';
  const mc=$('mcard'),more=$('moreDet');app.style.overflowY='hidden';
  if(mc&&!(more&&more.open)){let h=Math.round(innerHeight*.5);mc.style.setProperty('--mh',h+'px');while(h>150&&app.scrollHeight>app.clientHeight+1){h-=12;mc.style.setProperty('--mh',h+'px')}}
  app.style.overflowY=app.scrollHeight>app.clientHeight+1?'auto':'hidden'}
addEventListener('resize',fit);
let tx=0,ty=0;document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
document.addEventListener('touchmove',e=>{if(e.target.closest('.scrim'))return;const t=e.touches[0];if(Math.abs(t.clientX-tx)>Math.abs(t.clientY-ty))return;if(app.style.overflowY==='hidden')e.preventDefault()},{passive:false});
/* edge swipe back, like the other pages */
let x0=null,y0=0;addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX>innerWidth-28||t.clientX<28?t.clientX:null;y0=t.clientY},{passive:true});
addEventListener('touchend',e=>{if(x0==null||SH)return;const t=e.changedTouches[0];if(Math.abs(t.clientX-x0)>90&&Math.abs(t.clientY-y0)<60)$('back').click();x0=null},{passive:true});

draw();load().then(()=>loadMap(!mapD));
setInterval(()=>{if(document.visibilityState==='visible'&&linked)load()},8000);
setInterval(()=>{if(document.visibilityState==='visible'&&SH&&SH.kind==='map')loadMap(false)},20000);
})();
</script>
