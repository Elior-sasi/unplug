<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שואב</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--fg:#fff;--mut:#aeaeb2;--line:#ffffff14;--acc:#ff9a3d;--ink:#1f0e00;--on:#3d8bff;--on-txt:#6fa8ff;--bad:#ff6961;--ok:#30d158;
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #ffc48a;outline-offset:3px;border-radius:14px}
input:focus,input:focus-visible,select:focus,select:focus-visible{outline:3px solid #6fa8ff;outline-offset:2px}
svg{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 120px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;min-height:52px}
.circ{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.circ svg{width:22px;height:22px}
header .tt{flex:1;min-width:0}
header h1{margin:0;font-size:1.6rem;font-weight:700;line-height:1.1}
header .sub{font-size:.9rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the card with the ring - battery around, state in the middle (same as the AC dial) */
.hero{position:relative;background:var(--card);border-radius:28px;padding:14px 12px 12px}
.dial{position:relative;width:260px;aspect-ratio:1;margin:0 auto -9%;container-type:inline-size}
.dial svg{width:100%;height:100%;display:block}
.trk{stroke:#3a3a3c;stroke-width:14;fill:none;stroke-linecap:round}
.val{stroke:#8e8e93;stroke-width:14;fill:none;stroke-linecap:round;transition:stroke .4s}
.dial.on .val{stroke:var(--acc)}
.tick{stroke:#5a5a5e;stroke-width:3;stroke-linecap:round}
.knob{fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6% 18% 0}
.big{font-size:23cqw;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:.45em;font-weight:600;margin-inline-start:2px}
.st{font-size:1.05rem;font-weight:600;color:var(--mut);margin-top:4px}
.dial.on .st{color:var(--acc)}
.st2{font-size:1rem;font-weight:700;margin-top:6px;line-height:1.3}
.err{background:#3a1512;border:1px solid #ff453a88;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
.err span{flex:1}
.err button{background:#ffffff1a;border-radius:999px;min-height:44px;padding:0 14px;font-weight:700}
/* main row: small dock button + wide start, like turbo + power on the AC */
.mainrow{display:flex;gap:10px}
.sq{flex:0 0 76px;min-height:62px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.85rem;font-weight:600}
.pw{flex:1;min-height:62px;border-radius:999px;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.25rem;font-weight:700}
.pw.on{background:var(--on);color:#fff}
h2{font-size:1.1rem;margin:2px 4px -4px;font-weight:700}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-inline:16px}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;background:var(--card);font-size:.95rem;font-weight:700;white-space:nowrap}
.chip svg{width:19px;height:19px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.chip.busy{background:#3d8bff26;color:var(--on-txt)}
details.more{background:var(--card);border-radius:22px}
details.more summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 16px;font-weight:700;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .2s}
details.more[open] summary svg{transform:rotate(180deg)}
.lst{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;border-top:1px solid var(--line);text-align:start;width:100%}
.it .ico{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--acc);flex:none}
.it .ico svg{width:19px;height:19px}
.it .g{flex:1;min-width:0}
.it .t{display:block;font-weight:600}
.it .s{display:block;font-size:.88rem;color:var(--mut);margin-top:2px}
.it .chev{color:var(--mut);transform:scaleX(-1)}
.badge{background:var(--acc);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700}
/* floating bar: mode and suction, like mode and fan on the AC */
.bar{position:fixed;left:max(16px,calc((100vw - 608px)/2));right:max(16px,calc((100vw - 608px)/2));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;padding:6px;border-radius:28px;background:rgba(28,28,30,.94);border:1px solid #ff9a3d33;box-shadow:0 10px 30px #0009;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:5}
.bb{flex:1;min-width:0;min-height:60px;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:start}
.bb .bi{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:#ffc48a;flex:none}
.bb .bi svg{width:20px;height:20px}
.bb small{display:block;font-size:.8rem;color:var(--mut)}
.bb b{display:block;font-size:1rem;color:#ffc48a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar[hidden]{display:none}
/* sheets */
.scrim{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--card);border-radius:38px 38px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);box-shadow:0 -10px 40px #000a;overscroll-behavior:contain}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:48px}
.sh-h h3{flex:1;margin:0;font-size:1.35rem}
.sh-h .circ{background:var(--card3)}
.sheet .grp{background:var(--card2);border-radius:20px;overflow:hidden;margin-bottom:14px}
.sheet .grp .it{border-top:1px solid var(--line)}.sheet .grp .it:first-child{border-top:0}
.lbl{font-size:.95rem;color:var(--mut);margin:6px 4px 8px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.seg button{flex:1 1 30%;min-height:56px;border-radius:18px;background:var(--card2);font-weight:700;font-size:1rem;padding:4px 8px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.seg button[aria-pressed="true"]::before{content:"✓ "}
.sw{width:56px;height:34px;border-radius:999px;background:#48484a;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:right .2s}
.sw[aria-checked="true"]{background:var(--on)}
.sw[aria-checked="true"]::after{right:25px}
select,input[type=time],input[type=email],input[type=password]{font:inherit;font-size:1rem;min-height:48px;border-radius:14px;background:var(--card3);color:#fff;border:0;padding:0 12px;max-width:100%}
.wide{width:100%;min-height:58px;border-radius:999px;background:var(--acc);color:var(--ink);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:8px}
.wide.sec{background:var(--card2);color:#fff}
.meter{height:10px;border-radius:999px;background:#48484a;overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.meter.low>i{background:#ffd60a}.meter.out>i{background:var(--bad)}
.map{position:relative;border-radius:22px;overflow:hidden;background:#141416;margin-bottom:14px}
.map img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);min-height:44px;min-width:44px;padding:6px 12px;border-radius:999px;border:2px solid #fff6;background:#000b;color:#fff;font-weight:700;font-size:.95rem;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.pin[aria-pressed="true"]{background:var(--acc);color:var(--ink);border-color:#fff}
.pin[aria-pressed="true"]::before{content:"✓ "}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:14px}
.tot div{background:var(--card2);border-radius:18px;padding:12px 4px;font-size:.9rem;color:var(--mut)}
.tot b{display:block;font-size:1.35rem;color:#fff}
.num{display:flex;align-items:center;gap:8px}
.num button{width:48px;height:48px;border-radius:50%;background:var(--card3);font-size:1.5rem;font-weight:700}
.num output{min-width:80px;text-align:center;font-weight:700}
.note{font-size:.92rem;color:var(--mut);line-height:1.45;margin:4px 4px 14px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);margin:auto;max-width:420px;background:#2c2c2e;border:1px solid #ffffff14;border-radius:18px;padding:12px 16px;text-align:center;font-weight:600;z-index:30}
.login{display:flex;flex-direction:column;gap:12px}
.login label{font-weight:600}
.login .e{color:var(--bad);min-height:1.2em;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- data ---------- */
let D=MV.d||null,linked=MV.linked,err='',mapD=MV.map||null,mapAt=MV.mapAt||0;
async function load(){try{const j=await api('/mova/state');D=j;linked=true;err='';MV.d=j;MV.linked=true}
  catch(e){const m=String(e.message||e);if(/לא מחובר|פג|עדכון/.test(m)){linked=false;D=null;MV.linked=false;MV.d=null}err=m}
  draw()}
async function loadMap(force){if(!linked)return;const x=D&&D.state,busy=x&&(x.running||BUSY.has(x.state));
  if(!force&&!busy&&mapD&&Date.now()-mapAt<5*60000)return;
  try{const j=await api('/mova/map');mapAt=Date.now();if(j.map){mapD=j.map;MV.map=j.map;MV.mapAt=mapAt;refreshSheet()}}catch(e){}}
async function send(path,body,ok){buzz();try{const j=await api(path,body);if(j&&j.state){D=Object.assign({},D,j);delete D.sent;MV.d=D}ok&&toast(ok);draw();refreshSheet()}catch(e){toast(e.message);load()}}
const act=(a,ok,extra)=>send('/mova/act',Object.assign({a},extra||{}),ok);
const setv=(k,v,ok)=>send('/mova/set',{k,v},ok);

/* ---------- main screen ---------- */
const C=150,R=133,A0=135,SPAN=270;
const pt=(d,r)=>{const a=d*Math.PI/180;return[C+(r||R)*Math.cos(a),C+(r||R)*Math.sin(a)]};
const arc=(a1,a2)=>{const[x1,y1]=pt(a1),[x2,y2]=pt(a2);return`M${x1} ${y1}A${R} ${R} 0 ${a2-a1>180?1:0} 1 ${x2} ${y2}`};
const ticks=Array.from({length:9},(_,i)=>{const d=A0+SPAN*i/8,[x1,y1]=pt(d,108),[x2,y2]=pt(d,116);return`<line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join('');
let sig={};
function part(id,html,parent){let el=$(id);if(!el){el=document.createElement('div');el.id=id;(parent||$('main')).append(el)}
  if(sig[id]===html)return el;const a=document.activeElement,inside=el.contains(a);
  const key=inside&&a?(a.id?'#'+a.id:a.dataset.k?`[data-k="${a.dataset.k}"]`:a.dataset.room?`[data-room="${a.dataset.room}"]`:a.dataset.open?`[data-open="${a.dataset.open}"]`:a.dataset.a?`[data-a="${a.dataset.a}"]`:a.tagName==='SUMMARY'?'summary':null):null;
  el.innerHTML=html;sig[id]=html;el.hidden=!html;if(key){const n=el.querySelector(key);n&&n.focus({preventScroll:true})}return el}
function stateName(x){return x?(ST_HE[x.state]||'מוכן'):''}
function draw(){
  $('sub').textContent=HO.dname(HO.MOVA)+(HO.roomOf(HO.MOVA)?' · '+HO.roomOf(HO.MOVA):'');
  if(linked===false){$('bar').hidden=true;return drawLogin()}
  if($('login')){$('main').innerHTML='';sig={}}
  const x=D&&D.state;
  const busy=x&&(x.running||BUSY.has(x.state)),paused=x&&(x.paused||x.state===3),home=x&&(x.docked||HOME.has(x.state));
  /* the ring: battery; while cleaning it follows the progress */
  const prog=x&&x.running&&x.progress?x.progress:null,val=prog!=null?prog:(x&&x.battery!=null?x.battery:0);
  const a=A0+SPAN*Math.max(.001,Math.min(1,val/100)),[kx,ky]=pt(a);
  const room=x&&x.room&&D.rooms?(D.rooms.find(r=>r.id===x.room)||{}).name:null;
  const sub2=!x?(err||'מתחבר...'):busy||paused?[room?'ב'+room:'',x.area?x.area+' מ״ר':'',x.time?x.time+' דק׳':''].filter(Boolean).join(' · '):(x.drying&&x.drying_left?'נשארו '+x.drying_left+' דק׳ ייבוש':(x.charging===1||x.state===6?'בעמדה, נטען':home?'בעמדה':''));
  const big=x&&x.battery!=null?(prog!=null?prog:x.battery):'--';
  const aria=x?`${stateName(x)}. ${prog!=null?'התקדמות '+prog+' אחוז':''} סוללה ${x.battery} אחוז. ${sub2}`:'מתחבר';
  part('pHero',`<div class="hero" role="group" aria-label="${esc(aria)}"><div class="dial${busy?' on':''}"><svg viewBox="0 0 300 300" aria-hidden="true">${ticks}<path class="trk" d="${arc(A0,A0+SPAN)}"/><path class="val" d="${arc(A0,a)}"/><circle class="knob" r="13" cx="${kx}" cy="${ky}"/></svg>
    <div class="ctr" aria-hidden="true"><div class="big">${big}<small>%</small></div><div class="st">${esc(x?stateName(x)+(prog!=null?' · התקדמות':' · סוללה'):'')}</div>${sub2?`<div class="st2">${esc(sub2)}</div>`:''}</div></div></div>`);
  part('pErr',x&&(x.error||x.has_error)?`<div class="err" role="alert"><span>${esc(ERR_HE[x.error]||('השואב מדווח על תקלה'+(x.error?' (קוד '+x.error+')':'')))}</span><button data-a="clear">הבנתי</button></div>`:'');
  const n=sel.size,names=[...sel].map(id=>((D&&D.rooms||[]).find(r=>r.id===id)||{}).name).filter(Boolean);
  const main=busy?{a:'pause',t:'השהיה',i:I.pause,on:1}:paused?{a:'start',t:'המשך ניקוי',i:I.power}:n?{a:'rooms',t:'ניקוי '+(n===1?names[0]:n+' חדרים'),i:I.power}:{a:'start',t:'ניקוי כל הבית',i:I.power};
  part('pMain',`<div class="mainrow"><button class="sq" data-a="dock"${home?' disabled':''} aria-label="חזרה לעמדה">${I.dock}<span aria-hidden="true">לעמדה</span></button>
    <button class="pw${main.on?' on':''}" data-a="${main.a}" aria-pressed="${!!main.on}">${main.i}<span>${esc(main.t)}</span></button></div>`);
  /* rooms as chips; the map opens in a window */
  const rooms=(D&&D.rooms)||[];
  part('pRooms',rooms.length?`<h2 id="hRooms">חדרים</h2><div class="row" role="group" aria-labelledby="hRooms">
    <button class="chip" data-open="map" aria-label="מפה - בחירת חדרים במפה">${I.map}מפה</button>
    ${rooms.map(r=>`<button class="chip" data-room="${r.id}" aria-pressed="${sel.has(r.id)}">${sel.has(r.id)?'✓ ':''}${esc(r.name)}</button>`).join('')}</div>`:'');
  /* quick actions */
  const cn=(D&&D.can)||{},q=[];
  q.push(`<button class="chip" data-a="stop"${!busy&&!paused?' disabled':''}>${I.stop}עצירה</button>`);
  q.push(`<button class="chip" data-a="locate" aria-label="איתור, השואב משמיע צליל">${I.bell}איתור</button>`);
  if(cn.empty)q.push(`<button class="chip${x&&x.emptying?' busy':''}" data-a="empty">${I.trash}${x&&x.emptying?'מרוקן...':'ריקון אבק'}</button>`);
  if(cn.washing)q.push(`<button class="chip${x&&x.washing?' busy':''}" data-a="wash">${I.drop}${x&&x.washing?'עצירת שטיפה':'שטיפת מגבים'}</button>`);
  if(cn.drying)q.push(`<button class="chip${x&&x.drying?' busy':''}" data-a="dry">${I.sun}${x&&x.drying?'עצירת ייבוש':'ייבוש מגבים'}</button>`);
  part('pQuick',D?`<h2 id="hQ">פעולות</h2><div class="row" role="group" aria-labelledby="hQ">${q.join('')}</div>`:'');
  /* more settings - each opens its own window */
  if(D){const cons=D.consumables||[],due=cons.filter(c=>c.pct<=15).length,sch=D.schedules||[],dnd=x.dnd;
    const items=[
      ['mode',I.sliders,'מצב ניקוי מתקדם','מים, לחות מגבים, CleanGenius'],
      (cn.station||cn.empty)&&['station',I.station,'העמדה',stationLine(x)],
      cons.length&&['cons',I.wrench,'תחזוקה',due?due+' חלקים להחלפה':'הכול תקין',due],
      ['settings',I.gear,'הגדרות','שטיחים, נעילת ילדים, ייבוש ועוד'],
      dnd&&['dnd',I.moon,'שעות שקטות',dnd.on?`פעיל ${dnd.start||''}-${dnd.end||''}`:'כבוי'],
      sch.length&&['sch',I.clock,'תזמונים',sch.length+' בשואב'],
      ['hist',I.list,'היסטוריה',x.totals&&x.totals.count!=null?x.totals.count+' ניקויים':''],
      ['device',I.info,'השואב','חדר, ראוטר, ניתוק']].filter(Boolean);
    const open=$('moreDet')?$('moreDet').open:false;
    const html=`<details class="more" id="moreDet"${open?' open':''}><summary>הגדרות נוספות${I.chev}</summary><div class="lst">${items.map(([k,ic,t,s,b])=>`<button class="it" data-open="${k}"><span class="ico" aria-hidden="true">${ic}</span><span class="g"><span class="t">${t}</span>${s?`<span class="s">${esc(s)}</span>`:''}</span>${b?`<span class="badge" aria-hidden="true">${b}</span>`:''}<span class="chev" aria-hidden="true">${I.chev.replace('m6 9 6 6 6-6','m15 6-6 6 6 6')}</span></button>`).join('')}</div></details>`;
    const el=part('pMore',html);const det=el.querySelector('details');if(det&&!det._w){det._w=1;det.addEventListener('toggle',()=>setTimeout(fit,30))}}
  /* the floating bar: mode and suction */
  const S=(D&&D.selects)||[],m=S.find(s=>s.k==='cleaning_mode'),su=S.find(s=>s.k==='suction_level');
  const lab=s=>s?((s.o.find(o=>o.v===s.cur)||{}).t||''):'';
  if(m||su){$('bar').hidden=false;const bh=`${m?`<button class="bb" data-open="qmode" aria-label="מצב ניקוי: ${esc(lab(m))}. שינוי"><span class="bi" aria-hidden="true">${I.drop}</span><span aria-hidden="true"><small>מצב</small><b>${esc(lab(m))}</b></span></button>`:''}

    if(sig.bar!==bh){$('bar').innerHTML=bh;sig.bar=bh}}else $('bar').hidden=true;

function stationLine(x){const t=[['clean_tank','מים נקיים'],['dirty_tank','מים מלוכלכים'],['dust_bag','שקית אבק']].filter(([k])=>x[k]&&x[k]!=='unknown'&&x[k]!=='installed');
  return t.length?t.map(([k,n])=>n+': '+(TANK_HE[x[k]]||x[k])).join(' · '):'הכול תקין'}

function drawLogin(){if($('login'))return;sig={};
  $('main').innerHTML=`<div class="hero" style="padding:20px"><div style="width:140px;margin:0 auto" aria-hidden="true">${HO.devArt(HO.MOVA,1.5)}</div></div>
  <div class="login" id="login"><h2 style="margin:0">חיבור לשואב</h2><p class="note" style="margin:0">פעם אחת, עם חשבון MOVAhome שלך.</p>

  const go=async()=>{const e=$('mvE').value.trim(),p=$('mvP').value,er=$('mvErr'),b=$('mvIn');if(!e||!p){er.textContent='צריך אימייל וסיסמה';return}
    b.disabled=true;b.textContent='מתחבר... (עד חצי דקה)';er.textContent='';

function sheet(kind){closeSheet(true);lastFocus=document.activeElement;
  const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="sh-h"><h3 id="shT" tabindex="-1"></h3><button class="circ" data-x aria-label="סגירה">${I.x}</button></div><div id="shB"></div></div>`;
  s.addEventListener('click',e=>{if(e.target===s)closeSheet()});s.querySelector('[data-x]').onclick=()=>closeSheet();
  s.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
  document.body.append(s);$('app').setAttribute('aria-hidden','true');$('bar').setAttribute('aria-hidden','true');
  SH={kind,el:s,sig:''};refreshSheet();s.querySelector('#shT').focus();if(kind==='map')loadMap(!mapD)}
function closeSheet(quiet){if(!SH)return;SH.el.remove();SH=null;$('app').removeAttribute('aria-hidden');$('bar').removeAttribute('aria-hidden');if(!quiet)try{lastFocus&&lastFocus.focus()}catch(e){}}
function segHtml(s,big){return `<div class="lbl" id="l_${s.k}">${esc(s.t)}</div><div class="seg" role="group" aria-labelledby="l_${s.k}">${s.o.map(o=>`<button style="flex-basis:${s.o.length===4||s.o.length===2?'45%':'30%'}" data-q="${s.k}" data-v="${esc(o.v)}" aria-pressed="${o.v===s.cur}">${esc(o.t)}</button>`).join('')}</div>`}
function refreshSheet(){if(!SH||!D&&SH.kind!=='device')return;const x=D&&D.state,S=(D&&D.selects)||[];let t='',h='';
  const k=SH.kind;
  if(k==='qmode'){t='מצב ניקוי';h=S.filter(s=>['cleaning_mode','water_volume','mop_pad_humidity'].includes(s.k)).map(segHtml).join('')}

  else if(k==='mode'){t='מצב ניקוי מתקדם';const q=S.filter(s=>QUICK.includes(s.k)&&s.k!=='cleaning_mode'&&s.k!=='suction_level');

    h=`${mapD?`<div class="map"><img src="data:image/png;base64,${mapD.png}" alt="מפת הבית">${pins?pins.map(r=>`<button class="pin" style="left:${r.px}%;top:${r.py}%" data-room="${r.id}" aria-pressed="${sel.has(r.id)}">${esc(r.name)}</button>`).join(''):''}</div>`:'<p class="note">טוען מפה...</p>'}

  else if(k==='station'){t='העמדה';const cn=D.can||{},b=[];
    if(cn.washing)b.push(`<button class="wide sec" data-a="wash">${I.drop}${x.washing?'עצירת שטיפת מגבים':'שטיפת מגבים עכשיו'}</button>`);
    if(cn.drying)b.push(`<button class="wide sec" data-a="dry">${I.sun}${x.drying?'עצירת ייבוש':'ייבוש מגבים עכשיו'}</button>`);
    if(cn.empty)b.push(`<button class="wide sec" data-a="empty">${I.trash}ריקון אבק עכשיו</button>`);
    const tk=[['clean_tank','מיכל מים נקיים'],['dirty_tank','מיכל מים מלוכלכים'],['dust_bag','שקית אבק'],['detergent','נוזל ניקוי']].filter(([k])=>x[k]&&x[k]!=='unknown');
    h=`${tk.length?`<div class="grp">${tk.map(([k,n])=>`<div class="it"><span class="g t">${n}</span><span class="s">${esc(TANK_HE[x[k]]||x[k].replace(/_/g,' '))}</span></div>`).join('')}</div>`:''}<div style="display:flex;flex-direction:column;gap:10px">${b.join('')}</div>`}
  else if(k==='cons'){t='תחזוקה';h=`<div class="grp">${(D.consumables||[]).map(c=>`<div class="it" style="flex-wrap:wrap"><span class="g"><span class="t">${esc(c.t)}</span><span class="s">${c.pct<=0?'להחליף עכשיו':c.pct<=15?'להחליף בקרוב':'נשאר '+pct(c.pct)}</span>
      <div class="meter${c.pct<=0?' out':c.pct<=15?' low':''}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${c.pct}" aria-label="${esc(c.t)}, נשאר ${c.pct} אחוז"><i style="width:${Math.max(0,Math.min(100,c.pct))}%"></i></div></span>
      ${c.reset?`<button class="chip" style="background:#3a3a3c" data-reset="${esc(c.k)}" aria-label="החלפתי את ${esc(c.t)}, איפוס המונה">החלפתי</button>`:''}</div>`).join('')}</div><p class="note">אחרי שמחליפים או מנקים חלק, לוחצים "החלפתי" כדי לאפס את המונה.</p>`}
  else if(k==='settings'){t='הגדרות';const more=S.filter(s=>!QUICK.includes(s.k));
    h=`${(D.switches||[]).length?`<div class="grp">${D.switches.map(s=>`<div class="it"><span class="g"><span class="t" id="sw_${s.k}">${esc(s.t)}</span>${s.h?`<span class="s">${esc(s.h)}</span>`:''}</span><button class="sw" role="switch" data-k="${s.k}" aria-checked="${!!s.on}" aria-labelledby="sw_${s.k}"></button></div>`).join('')}</div>`:''}
      ${more.length?`<div class="grp">${more.map(s=>`<div class="it"><label class="g t" for="se_${s.k}">${esc(s.t)}</label><select id="se_${s.k}" data-sel="${s.k}">${s.o.map(o=>`<option value="${esc(o.v)}"${o.v===s.cur?' selected':''}>${esc(o.t)}</option>`).join('')}</select></div>`).join('')}</div>`:''}
      ${(D.numbers||[]).length?`<div class="grp">${D.numbers.map(n=>`<div class="it"><span class="g t" id="nm_${n.k}">${esc(n.t)}</span><div class="num" role="group" aria-labelledby="nm_${n.k}"><button data-num="${n.k}" data-d="${-n.step}" aria-label="פחות">−</button><output aria-live="polite">${n.u==='%'?pct(n.v):n.v+' '+esc(n.u)}</output><button data-num="${n.k}" data-d="${n.step}" aria-label="יותר">+</button></div></div>`).join('')}</div>`:''}`}
  else if(k==='dnd'){t='שעות שקטות';const d=x.dnd||{};
    h=`<div class="grp"><div class="it"><span class="g t" id="dndL">שעות שקטות</span><button class="sw" role="switch" id="dndOn" aria-checked="${!!d.on}" aria-labelledby="dndL"></button></div>
      <div class="it"><label class="g t" for="dS">מהשעה</label><input type="time" id="dS" value="${esc(d.start||'22:00')}"></div>
      <div class="it"><label class="g t" for="dE">עד השעה</label><input type="time" id="dE" value="${esc(d.end||'08:00')}"></div></div>
      <p class="note">בשעות האלה השואב לא יתחיל ניקוי מתוזמן ולא ישמיע הודעות.</p>`}
  else if(k==='sch'){t='תזמונים בשואב';const DN=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
    const days=s=>{if(s.once)return 'פעם אחת';const r=String(s.days||'').padStart(7,'0'),on=[...r].map((c,i)=>c==='1'?i:-1).filter(i=>i>=0);return on.length===7?'כל יום':on.map(i=>DN[i]).join(' ')};
    h=`<div class="grp">${(D.schedules||[]).map(s=>`<div class="it"><span class="g"><span class="t" id="sc_${s.id}">${esc(s.time)}</span><span class="s">${esc(days(s))}</span></span>
      <button class="sw" role="switch" data-sch="${s.id}" aria-checked="${!!s.on}" aria-labelledby="sc_${s.id}"></button><button class="circ" style="background:#3a3a3c" data-schdel="${s.id}" aria-label="מחיקת התזמון של ${esc(s.time)}">${I.x}</button></div>`).join('')}</div>`}
  else if(k==='hist'){t='היסטוריה';const tt=x.totals||{},hs=D.history||[];
    h=`${tt.count!=null?`<div class="tot"><div><b>${tt.count}</b>ניקויים</div><div><b>${tt.m2!=null?tt.m2:'-'}</b>מ״ר בסך הכול</div><div><b>${tt.minutes!=null?Math.round(tt.minutes/60):'-'}</b>שעות</div></div>`:''}
      ${hs.length?`<div class="grp">${hs.slice(0,15).map(r=>{const d=new Date(r.t*1000);return `<div class="it"><span class="g"><span class="t">${d.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})} ${d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span><span class="s">${r.m2!=null?r.m2+' מ״ר':''}${r.min!=null?' · '+r.min+' דק׳':''}${r.done===false?' · לא הושלם':''}</span></span></div>`}).join('')}</div>`:'<p class="note">אין עדיין היסטוריה.</p>'}`}
  else if(k==='device'){t='השואב';const w=HO.wifi()||{};
    h=`<div class="grp">
      <button class="it" id="dvRoom"><span class="g"><span class="t">חדר</span><span class="s">${esc(HO.roomOf(HO.MOVA)||'בלי חדר')}</span></span></button>
      ${HO.inApp()?`<button class="it" id="dvPair"><span class="g"><span class="t">זיהוי השואב בראוטר</span><span class="s">${HO.META.movaMac?(w.visible?'מחובר לרשת הבית':'לא נראה ברשת כרגע'):'לא הוגדר'}</span></span></button>`:''}
      ${D&&D.model?`<div class="it"><span class="g"><span class="t">דגם</span><span class="s" dir="ltr" style="text-align:right">${esc(D.model)}${D.fw?' · '+esc(D.fw):''}</span></span></div>`:''}
      <button class="it" id="dvOut"><span class="g t">ניתוק החשבון מ-HomeOn</span></button>
      <button class="it" id="dvHide"><span class="g"><span class="t">הסתרת השואב מ-HomeOn</span><span class="s">לא מוחק אותו מ-MOVAhome</span></span></button></div>
      <p class="note">חיבור Wi-Fi ראשוני של שואב חדש ועדכוני תוכנה נעשים עדיין דרך MOVAhome.</p>`}
  if(SH.sig===t+h)return;const box=SH.el.querySelector('#shB'),a=document.activeElement,inside=box.contains(a);
  if(inside&&/^(SELECT|INPUT)$/.test(a.tagName))return;
  const key=inside?(a.id?'#'+a.id:a.dataset.q?`[data-q="${a.dataset.q}"][data-v="${a.dataset.v}"]`:a.dataset.room?`[data-room="${a.dataset.room}"]`:a.dataset.k?`[data-k="${a.dataset.k}"]`:a.dataset.times?`[data-times="${a.dataset.times}"]`:a.dataset.reset?`[data-reset="${a.dataset.reset}"]`:a.dataset.num?`[data-num="${a.dataset.num}"][data-d="${a.dataset.d}"]`:null):null;
  SH.el.querySelector('#shT').textContent=t;box.innerHTML=h;SH.sig=t+h;if(key){const n=box.querySelector(key);n&&n.focus({preventScroll:true})}}

/* ---------- taps ---------- */
const MSG={start:'מתחיל לנקות',pause:'מושהה',dock:'חוזר לעמדה',stop:'נעצר',locate:'השואב משמיע צליל',clear:'ההתראה נוקתה',wash:'פקודה נשלחה',dry:'פקודה נשלחה',empty:'מרוקן אבק'};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.id==='back'){try{P.postMessage('unplug-close','*')}catch(_){}return}
  if(b.dataset.open){return sheet(b.dataset.open)}
  if(b.dataset.a){const a=b.dataset.a;
    if(a==='rooms'){const ids=[...sel];return act('rooms','מנקה '+(ids.length===1?'חדר אחד':ids.length+' חדרים'),{rooms:ids,times})}
    if(a==='start'&&D&&D.state&&(D.state.paused||D.state.state===3))return act('start','ממשיך לנקות');
    return act(a,MSG[a])}
  if(b.dataset.room){const id=+b.dataset.room;sel.has(id)?sel.delete(id):sel.add(id);buzz();draw();refreshSheet();say(sel.has(id)?'נבחר':'בוטלה הבחירה');return}
  if(b.dataset.times){times=+b.dataset.times;refreshSheet();return}
  if(b.id==='goRooms'){const ids=[...sel];closeSheet();return act('rooms','מנקה '+(ids.length===1?'חדר אחד':ids.length+' חדרים'),{rooms:ids,times})}
  if(b.dataset.q){const k=b.dataset.q,v=b.dataset.v,s=(D.selects||[]).find(s=>s.k===k);if(s)s.cur=v;refreshSheet();draw();return setv(k,v)}
  if(b.dataset.k&&b.classList.contains('sw')){const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);const s=(D.switches||[]).find(s=>s.k===b.dataset.k);if(s)s.on=on;return setv(b.dataset.k,on)}
  if(b.dataset.reset){const c=(D.consumables||[]).find(c=>c.k===b.dataset.reset);if(!confirm('לאפס את המונה של '+(c?c.t:'')+'? רק אחרי שהחלפת או ניקית אותו.'))return;return act('reset:'+b.dataset.reset,'אופס')}
  if(b.dataset.num){const n=(D.numbers||[]).find(n=>n.k===b.dataset.num);if(!n)return;const v=Math.max(n.min,Math.min(n.max,n.v+(+b.dataset.d)));if(v===n.v)return;n.v=v;b.parentNode.querySelector('output').textContent=n.u==='%'?pct(v):v+' '+n.u;clearTimeout(b._t);b._t=setTimeout(()=>setv(n.k,v),600);return}
  if(b.dataset.sch){const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);return setv('schedule_on',{id:b.dataset.sch,on})}
  if(b.dataset.schdel){if(!confirm('למחוק את התזמון מהשואב?'))return;return setv('schedule_delete',b.dataset.schdel,'התזמון נמחק')}
  if(b.id==='dndOn'){const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);return setv('dnd',{on,start:$('dS').value,end:$('dE').value},on?'שעות שקטות פעילות':'שעות שקטות כבויות')}
  if(b.id==='dvRoom')return HO.after(()=>HO.pickRoom());
  if(b.id==='dvPair')return HO.after(()=>HO.pair());
  if(b.id==='dvHide')return HO.after(()=>HO.hide());
  if(b.id==='dvOut'){if(!confirm('לנתק את חשבון MOVAhome מ-HomeOn?'))return;closeSheet();return api('/mova/logout').then(()=>{linked=false;D=null;mapD=null;MV.linked=false;MV.d=null;MV.map=null;HO.render();draw()}).catch(e=>toast(e.message))}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.sel){const s=(D.selects||[]).find(s=>s.k===t.dataset.sel);if(s)s.cur=t.value;return setv(t.dataset.sel,t.value,'נשמר')}
  if(t.id==='dS'||t.id==='dE')return setv('dnd',{on:$('dndOn').getAttribute('aria-checked')==='true',start:$('dS').value,end:$('dE').value},'נשמר')});

/* ---------- fit on one screen, like the AC page ---------- */
const app=$('app');
function fit(){if(linked===false)return;const bar=$('bar');const pb=bar.hidden?24:Math.ceil(innerHeight-bar.getBoundingClientRect().top+16);app.style.paddingBottom=pb+'px';
  const dl=document.querySelector('.dial'),hero=document.querySelector('.hero'),more=$('moreDet');app.style.overflowY='hidden';
  if(dl&&hero&&!(more&&more.open)){let w=Math.min(300,hero.clientWidth-60);dl.style.width=w+'px';while(w>170&&app.scrollHeight>app.clientHeight+1){w-=10;dl.style.width=w+'px'}}
  app.style.overflowY=app.scrollHeight>app.clientHeight+1?'auto':'hidden'}
addEventListener('resize',fit);
let tx=0,ty=0;document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
document.addEventListener('touchmove',e=>{if(e.target.closest('.scrim'))return;const t=e.touches[0];if(Math.abs(t.clientX-tx)>Math.abs(t.clientY-ty))return;if(app.style.overflowY==='hidden')e.preventDefault()},{passive:false});
/* edge swipe back, like the other pages */
let x0=null,y0=0;addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX>innerWidth-28||t.clientX<28?t.clientX:null;y0=t.clientY},{passive:true});
addEventListener('touchend',e=>{if(x0==null||SH)return;const t=e.changedTouches[0];if(Math.abs(t.clientX-x0)>90&&Math.abs(t.clientY-y0)<60)$('back').click();x0=null},{passive:true});

draw();load().then(()=>loadMap(!mapD));
setInterval(()=>{if(document.visibilityState==='visible'&&linked)load()},8000);
setInterval(()=>{if(document.visibilityState==='visible'&&SH&&SH.kind==='map')loadMap(false)},20000);
})();
</script>
</body>
